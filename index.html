y office is in the city centre. I work from eight until five. At midday I eat a soup or a sandwich in the canteen. After work I often go shopping or I meet friends. In the evening I cook at home and watch TV. At eleven I go to bed. My day is long, but I like it.","q":[["What time does she get up?","Um sechs Uhr","Um sieben Uhr","Um acht Uhr"],["Where does she eat lunch?","In der Kantine","Zu Hause","Im Bus"],["What does she do in the evening?","Sie kocht und sieht fern","Sie arbeitet","Sie geht einkaufen"]],"v":[["aufstehen","to get up"],["zuerst","first"],["die Kantine","the canteen"],["einkaufen","to shop"],["gefallen","to please / to like"]]},{"lv":"A1","t":"Meine Wohnung","tag":"home","de":"Ich wohne seit zwei Jahren in einer kleinen Wohnung im dritten Stock. Die Wohnung hat drei Zimmer: ein Wohnzimmer, ein Schlafzimmer und eine Küche. Das Wohnzimmer ist groß und hell. Dort steht ein Sofa, ein Tisch und ein Regal mit vielen Büchern. Die Küche ist klein, aber modern. Ich koche gern dort. Das Badezimmer hat keine Badewanne, nur eine Dusche. Mein Lieblingsplatz ist der Balkon. Im Sommer sitze ich dort und lese. Die Miete ist nicht billig, aber die Wohnung ist schön und die Nachbarn sind freundlich.","en":"I have lived for two years in a small flat on the third floor. The flat has three rooms: a living room, a bedroom and a kitchen. The living room is big and bright. There is a sofa, a table and a shelf with many books. The kitchen is small but modern. I like cooking there. The bathroom has no bathtub, only a shower. My favourite place is the balcony. In summer I sit there and read. The rent is not cheap, but the flat is nice and the neighbours are friendly.","q":[["On which floor is the flat?","Im dritten Stock","Im ersten Stock","Im zweiten Stock"],["What is not in the bathroom?","Eine Badewanne","Eine Dusche","Ein Regal"],["Where does she sit in summer?","Auf dem Balkon","In der Küche","Im Schlafzimmer"]],"v":[["die Miete","the rent"],["der Stock","the floor (storey)"],["hell","bright"],["die Nachbarn","the neighbours"],["seit","since / for"]]},{"lv":"A1","t":"Im Supermarkt","tag":"shopping","de":"Jeden Samstag gehe ich zum Supermarkt. Er ist nicht weit von meiner Wohnung. Ich nehme immer einen Einkaufswagen und eine Liste. Zuerst kaufe ich Obst und Gemüse: Äpfel, Bananen, Tomaten und Kartoffeln. Dann brauche ich Brot, Milch, Käse und Eier. Ich trinke gern Orangensaft, also kommt auch eine Flasche in den Wagen. An der Kasse zahle ich mit der Karte. Eine Tüte nehme ich nicht, ich habe eine Tasche dabei. Der Einkauf dauert zwanzig Minuten und kostet ungefähr vierzig Euro.","en":"Every Saturday I go to the supermarket. It is not far from my flat. I always take a trolley and a list. First I buy fruit and vegetables: apples, bananas, tomatoes and potatoes. Then I need bread, milk, cheese and eggs. I like drinking orange juice, so a bottle goes into the trolley too. At the till I pay by card. I do not take a bag, I have a bag with me. The shopping takes twenty minutes and costs about forty euros.","q":[["When does she go shopping?","Am Samstag","Am Sonntag","Am Montag"],["How does she pay?","Mit der Karte","Mit Bargeld","Mit einer Liste"],["How long does the shopping take?","Zwanzig Minuten","Zwei Stunden","Vierzig Minuten"]],"v":[["der Einkaufswagen","the shopping trolley"],["die Kasse","the till / checkout"],["die Tüte","the (plastic) bag"],["ungefähr","about / approximately"],["brauchen","to need"]]},{"lv":"A1","t":"Das Wetter in Deutschland","tag":"weather","de":"In Deutschland gibt es vier Jahreszeiten. Der Frühling beginnt im März. Es wird wärmer, aber es regnet oft. Der Sommer ist von Juni bis August. Dann ist es manchmal sehr heiß, bis 35 Grad. Viele Menschen fahren in den Urlaub oder gehen schwimmen. Im Herbst fallen die Blätter von den Bäumen und es wird kühler. Der Winter ist von Dezember bis Februar. Es schneit und es ist kalt. Ich mag den Herbst am liebsten, weil die Farben schön sind. Aber meine Kinder lieben den Winter, denn sie spielen gern im Schnee.","en":"In Germany there are four seasons. Spring begins in March. It gets warmer, but it often rains. Summer is from June to August. Then it is sometimes very hot, up to 35 degrees. Many people go on holiday or go swimming. In autumn the leaves fall from the trees and it gets cooler. Winter is from December to February. It snows and it is cold. I like autumn best because the colours are beautiful. But my children love winter, because they like playing in the snow.","q":[["When does spring begin?","Im März","Im Juni","Im Dezember"],["Which season does the writer like most?","Den Herbst","Den Winter","Den Sommer"],["Why do the children love winter?","Sie spielen gern im Schnee","Es regnet oft","Sie fahren schwimmen"]],"v":[["die Jahreszeit","the season"],["der Frühling","spring"],["es schneit","it is snowing"],["kühl","cool"],["am liebsten","best / most of all"]]},{"lv":"A1","t":"Mein Beruf","tag":"work","de":"Ich bin Krankenpfleger von Beruf. Ich arbeite in einem Krankenhaus in Köln. Meine Arbeit ist anstrengend, aber sie macht mir Spaß. Ich helfe Patienten, ich bringe ihnen Essen und ich messe Fieber. Manchmal muss ich auch nachts arbeiten. Meine Kollegen sind nett und wir helfen uns gegenseitig. Ich arbeite vier Tage pro Woche, von sieben Uhr morgens bis drei Uhr nachmittags. Am Wochenende habe ich oft frei. In meiner Freizeit schlafe ich viel oder ich fahre mit dem Fahrrad. Ich möchte später in einer Praxis arbeiten, da ist der Stress kleiner.","en":"I am a nurse by profession. I work in a hospital in Cologne. My work is exhausting, but I enjoy it. I help patients, I bring them food and I take their temperature. Sometimes I have to work at night too. My colleagues are nice and we help each other. I work four days a week, from seven in the morning until three in the afternoon. At the weekend I am often off. In my free time I sleep a lot or I cycle. Later I would like to work in a doctor's practice, the stress is lower there.","q":[["Where does he work?","In einem Krankenhaus","In einer Praxis","In einer Schule"],["How many days a week does he work?","Vier Tage","Fünf Tage","Sieben Tage"],["What does he do in his free time?","Er schläft und fährt Fahrrad","Er arbeitet nachts","Er misst Fieber"]],"v":[["anstrengend","exhausting / strenuous"],["der Kollege","the colleague"],["gegenseitig","each other / mutually"],["frei haben","to be off (work)"],["messen","to measure"]]},{"lv":"A1","t":"Meine Hobbys","tag":"hobbies","de":"In meiner Freizeit mache ich sehr gern Musik. Ich spiele seit acht Jahren Gitarre. Jeden Mittwoch treffe ich meine Band. Wir proben in einem Keller und wir spielen Rock und Pop. Ich singe auch, aber nicht sehr gut. Mein zweites Hobby ist Fotografie. Ich habe eine alte Kamera und ich fotografiere gern die Stadt bei Nacht. Die Bilder zeige ich meinen Freunden im Internet. Im Winter lese ich mehr, besonders Krimis. Hobbys sind wichtig für mich, weil ich dann den Stress von der Arbeit vergesse.","en":"In my free time I really like making music. I have played guitar for eight years. Every Wednesday I meet my band. We rehearse in a cellar and we play rock and pop. I also sing, but not very well. My second hobby is photography. I have an old camera and I like photographing the city at night. I show the pictures to my friends online. In winter I read more, especially crime novels. Hobbies are important for me because then I forget the stress from work.","q":[["How long has he played guitar?","Seit acht Jahren","Seit zwei Jahren","Seit einem Jahr"],["What does he photograph?","Die Stadt bei Nacht","Seine Band","Krimis"],["What does he read in winter?","Krimis","Bilder","Noten"]],"v":[["die Probe / proben","rehearsal / to rehearse"],["der Keller","the cellar"],["bei Nacht","at night"],["vergessen","to forget"],["besonders","especially"]]},{"lv":"A1","t":"Beim Arzt","tag":"health","de":"Seit drei Tagen habe ich starke Halsschmerzen und ich kann kaum schlucken. Heute Morgen habe ich beim Arzt angerufen und einen Termin bekommen. Um zehn Uhr bin ich in der Praxis. Die Sprechstundenhilfe gibt mir ein Formular und ich warte zwanzig Minuten. Dann ruft mich der Arzt. Er schaut in meinen Hals und misst Fieber. Ich habe 38,5 Grad. Er sagt, ich muss drei Tage im Bett bleiben und viel Tee trinken. Ich bekomme ein Rezept für die Apotheke. Das Medikament kostet fünf Euro. Ich hoffe, ich bin am Montag wieder gesund.","en":"For three days I have had a bad sore throat and I can hardly swallow. This morning I called the doctor and got an appointment. At ten o'clock I am at the practice. The receptionist gives me a form and I wait twenty minutes. Then the doctor calls me. He looks into my throat and takes my temperature. I have 38.5 degrees. He says I must stay in bed for three days and drink a lot of tea. I get a prescription for the pharmacy. The medicine costs five euros. I hope I am healthy again on Monday.","q":[["What is wrong with him?","Halsschmerzen","Kopfschmerzen","Bauchschmerzen"],["How much fever does he have?","38,5 Grad","37 Grad","40 Grad"],["What must he do?","Drei Tage im Bett bleiben","Zur Arbeit gehen","Sport machen"]],"v":[["schlucken","to swallow"],["der Termin","the appointment"],["das Rezept","the prescription"],["hoffen","to hope"],["kaum","hardly"]]},{"lv":"A1","t":"Wo ist der Bahnhof?","tag":"travel","de":"Entschuldigung, ich bin fremd hier. Können Sie mir helfen? Ich suche den Hauptbahnhof. — Ja, natürlich. Gehen Sie hier die Straße geradeaus, bis zur zweiten Ampel. Dann biegen Sie links in die Bahnhofstraße ein. Nach etwa 300 Metern sehen Sie auf der rechten Seite ein großes Gebäude mit einer Uhr. Das ist der Bahnhof. — Ist es weit? — Nein, zu Fuß sind das ungefähr zehn Minuten. Sie können auch mit der Straßenbahn fahren, die Linie 4 fährt direkt dorthin. — Vielen Dank! — Gern geschehen.","en":"Excuse me, I am a stranger here. Can you help me? I am looking for the main station. — Yes, of course. Go straight along this street, as far as the second traffic light. Then turn left into Bahnhofstraße. After about 300 metres you will see a large building with a clock on the right-hand side. That is the station. — Is it far? — No, on foot that is about ten minutes. You can also take the tram, line 4 goes directly there. — Thank you very much! — You're welcome.","q":[["What is the person looking for?","Den Hauptbahnhof","Die Apotheke","Den Supermarkt"],["What should they do at the second traffic light?","Links abbiegen","Rechts abbiegen","Geradeaus weitergehen"],["How long does it take on foot?","Zehn Minuten","Zwanzig Minuten","Eine Stunde"]],"v":[["fremd","stranger / unfamiliar"],["die Ampel","the traffic light"],["abbiegen","to turn (off)"],["zu Fuß","on foot"],["Gern geschehen","You're welcome"]]},{"lv":"A1","t":"Im Restaurant","tag":"food","de":"Wir sind heute in einem kleinen Restaurant in der Altstadt. Der Kellner bringt uns die Speisekarte. Ich bestelle eine Suppe als Vorspeise und dann Schnitzel mit Kartoffelsalat. Mein Freund nimmt eine Pizza mit Pilzen. Zum Trinken bestellen wir Wasser und ein Bier. Das Essen schmeckt sehr gut, aber die Portionen sind groß. Nach dem Essen möchte ich noch einen Kaffee trinken. Der Kellner kommt und fragt: „Hat es Ihnen geschmeckt?“ Wir sagen ja. Dann bezahlen wir: zusammen 38 Euro, das Trinkgeld ist nicht inklusive. Wir geben 42 Euro und gehen zufrieden nach Hause.","en":"Today we are in a small restaurant in the old town. The waiter brings us the menu. I order a soup as a starter and then schnitzel with potato salad. My friend has a pizza with mushrooms. To drink we order water and a beer. The food tastes very good, but the portions are big. After the meal I would like to drink a coffee as well. The waiter comes and asks: “Did you enjoy it?” We say yes. Then we pay: 38 euros together, the tip is not included. We give 42 euros and go home satisfied.","q":[["What does the writer order as a main course?","Schnitzel mit Kartoffelsalat","Eine Suppe","Eine Pizza"],["What does the friend have?","Eine Pizza mit Pilzen","Ein Schnitzel","Einen Salat"],["How much tip do they leave?","Vier Euro","Zwei Euro","Acht Euro"]],"v":[["der Kellner","the waiter"],["die Speisekarte","the menu"],["die Vorspeise","the starter"],["schmecken","to taste"],["das Trinkgeld","the tip"]]},{"lv":"A1","t":"In der Schule","tag":"school","de":"Meine Tochter geht in die fünfte Klasse. Ihre Schule heißt Goethe-Gymnasium und sie ist zehn Minuten von unserer Wohnung entfernt. Der Unterricht beginnt um acht Uhr und endet um dreizehn Uhr. Sie hat Fächer wie Deutsch, Mathe, Englisch, Bio und Sport. Mathe findet sie schwer, aber Englisch macht ihr Spaß. Jeden Montag schreibt sie einen Test, deshalb lernt sie am Wochenende. In der Pause spielt sie mit ihren Freundinnen im Schulhof. Nachmittags hat sie zweimal pro Woche Schwimmen. Ihr Lieblingslehrer heißt Herr Wagner und er unterrichtet Bio.","en":"My daughter is in the fifth class. Her school is called Goethe-Gymnasium and it is ten minutes from our flat. Lessons begin at eight o'clock and end at one. She has subjects like German, maths, English, biology and sport. She finds maths difficult, but she enjoys English. Every Monday she writes a test, so she studies at the weekend. In the break she plays with her friends in the schoolyard. In the afternoon she has swimming twice a week. Her favourite teacher is called Mr Wagner and he teaches biology.","q":[["When do lessons end?","Um dreizehn Uhr","Um acht Uhr","Um fünfzehn Uhr"],["Which subject is difficult for her?","Mathe","Englisch","Sport"],["What does she do twice a week in the afternoon?","Schwimmen","Einen Test schreiben","Im Schulhof spielen"]],"v":[["der Unterricht","the lessons / class"],["das Fach","the subject"],["der Test","the test"],["die Pause","the break"],["entfernt","away / distant"]]},{"lv":"A1","t":"Pläne für das Wochenende","tag":"plans","de":"Morgen ist endlich Freitag und ich habe viele Pläne. Am Freitagabend gehe ich mit zwei Kollegen ins Kino. Wir wollen den neuen Film mit dem deutschen Titel „Nachtzug“ sehen. Am Samstag fahre ich mit dem Zug nach Heidelberg. Dort wohnt meine Schwester und sie hat Geburtstag. Ich möchte ihr ein Buch schenken. Am Sonntag bleibt keine Zeit für einen Ausflug, denn ich muss meine Wohnung putzen und die Wäsche waschen. Aber am Sonntagabend treffe ich meine Freunde im Park. Wir wollen grillen, wenn das Wetter mitspielt. Ich freue mich auf das Wochenende.","en":"Tomorrow is finally Friday and I have many plans. On Friday evening I am going to the cinema with two colleagues. We want to see the new film with the German title “Nachtzug”. On Saturday I am travelling by train to Heidelberg. My sister lives there and it is her birthday. I would like to give her a book. On Sunday there is no time for a trip, because I have to clean my flat and do the laundry. But on Sunday evening I am meeting my friends in the park. We want to have a barbecue, if the weather plays along. I am looking forward to the weekend.","q":[["What are they doing on Friday evening?","Ins Kino gehen","Grillen","Die Wohnung putzen"],["Why is she going to Heidelberg?","Ihre Schwester hat Geburtstag","Sie arbeitet dort","Sie hat einen Termin"],["What does she have to do on Sunday?","Putzen und waschen","Einen Ausflug machen","Ein Buch kaufen"]],"v":[["der Plan","the plan"],["schenken","to give (a gift)"],["die Wäsche waschen","to do the laundry"],["grillen","to barbecue"],["sich freuen auf","to look forward to"]]},{"lv":"A2","t":"Ein Brief aus Berlin","tag":"letter","de":"Liebe Sophie, entschuldige bitte, dass ich so lange nicht geschrieben habe. Die letzten Wochen waren sehr stressig. Ich bin vor einem Monat nach Berlin gezogen und habe hier eine neue Wohnung gefunden. Sie liegt in einem alten Haus in Kreuzberg und hat einen kleinen Balkon. Die ersten Tage waren schwer: Ich habe niemanden gekannt und ich habe mich oft einsam gefühlt. Inzwischen habe ich aber ein paar nette Leute aus dem Café unten kennengelernt. Letztes Wochenende sind wir zusammen an die Spree gefahren und haben ein Picknick gemacht. Ich habe auch einen Deutschkurs angefangen; er findet zweimal pro Woche statt. Besuch mich doch mal! Ich habe ein Gästezimmer. Liebe Grüße, Julia","en":"Dear Sophie, please forgive me for not writing for so long. The last few weeks were very stressful. I moved to Berlin a month ago and have found a new flat here. It is in an old house in Kreuzberg and has a small balcony. The first days were hard: I didn't know anyone and I often felt lonely. Meanwhile, though, I have met a few nice people from the café downstairs. Last weekend we went to the Spree together and had a picnic. I have also started a German course; it takes place twice a week. Do come and visit me! I have a guest room. Best wishes, Julia","q":[["When did Julia move to Berlin?","Vor einem Monat","Letztes Wochenende","Vor einem Jahr"],["How did she feel in the first days?","Einsam","Stressig","Neugierig"],["What did they do at the Spree?","Ein Picknick machen","Ein Haus kaufen","Deutsch lernen"]],"v":[["umziehen","to move (house)"],["kennenlernen","to get to know"],["einsam","lonely"],["inzwischen","meanwhile"],["stattfinden","to take place"]]},{"lv":"A2","t":"Meine Reise nach München","tag":"travel","de":"Letzten Sommer bin ich mit dem Zug nach München gefahren. Die Fahrt hat fünf Stunden gedauert, aber sie war sehr schön, denn ich habe aus dem Fenster gesehen und ein Buch gelesen. In München habe ich bei einer Freundin gewohnt. Sie wohnt in einer WG in der Nähe vom Englischen Garten. Am ersten Tag sind wir in die Innenstadt gegangen und haben den Marienplatz besichtigt. Um zwölf Uhr haben wir das Glockenspiel gehört. Am zweiten Tag haben wir eine Fahrradtour durch die Stadt gemacht. Das Wetter war perfekt, nur am Abend hat es einmal geregnet. Am letzten Tag sind wir in ein Museum gegangen. Ich habe viele Fotos gemacht und möchte unbedingt wiederkommen.","en":"Last summer I travelled to Munich by train. The journey took five hours, but it was very nice because I looked out of the window and read a book. In Munich I stayed with a friend. She lives in a shared flat near the Englischer Garten. On the first day we went into the city centre and visited Marienplatz. At twelve o'clock we heard the carillon. On the second day we did a bike tour through the city. The weather was perfect, only in the evening it rained once. On the last day we went to a museum. I took a lot of photos and definitely want to come back.","q":[["How long was the train journey?","Fünf Stunden","Zwei Stunden","Einen Tag"],["What did they hear at twelve o'clock?","Das Glockenspiel","Den Zug","Ein Museum"],["What did they do on the second day?","Eine Fahrradtour","Ein Picknick","Eine Zugfahrt"]],"v":[["die Fahrt","the journey"],["die WG","shared flat"],["besichtigen","to visit / sightsee"],["die Fahrradtour","the bike tour"],["unbedingt","definitely / absolutely"]]},{"lv":"A2","t":"Der Umzug","tag":"home","de":"Endlich ist es geschafft! Wir sind am Samstag in die neue Wohnung gezogen. Zum Glück haben viele Freunde geholfen. Wir haben einen Transporter gemietet und sind dreimal gefahren. Die größte Herausforderung war das Sofa: Es hat nicht durch die Tür gepasst, also haben wir es über den Balkon gehoben. In der neuen Wohnung gibt es mehr Platz und einen Garten. Die Küche ist noch nicht fertig, aber das ist kein Problem. Am Montag muss ich mich beim Einwohnermeldeamt anmelden und danach gehe ich zur Bank. Ich bin sehr müde, aber auch sehr glücklich über unser neues Zuhause.","en":"Finally it is done! We moved into the new flat on Saturday. Luckily many friends helped. We rented a van and drove three times. The biggest challenge was the sofa: it didn't fit through the door, so we lifted it over the balcony. In the new flat there is more space and a garden. The kitchen is not finished yet, but that is no problem. On Monday I have to register at the residents' registration office and afterwards I am going to the bank. I am very tired, but also very happy about our new home.","q":[["Who helped with the move?","Viele Freunde","Die Nachbarn","Die Bank"],["Why did the sofa come over the balcony?","Es hat nicht durch die Tür gepasst","Es war zu schwer","Es war kaputt"],["What must he do on Monday?","Sich anmelden","Das Sofa kaufen","Die Küche putzen"]],"v":[["der Umzug","the move"],["der Transporter","the van"],["die Herausforderung","the challenge"],["heben","to lift"],["sich anmelden","to register"]]},{"lv":"A2","t":"Im Hotel an der Küste","tag":"travel","de":"Wir sind gestern Abend im Hotel angekommen und haben gleich eingecheckt. Das Zimmer liegt im vierten Stock und hat einen tollen Blick auf das Meer. Leider funktioniert die Klimaanlage nicht richtig und das WLAN ist sehr langsam. Ich habe an der Rezeption nachgefragt; die Dame war sehr freundlich und hat versprochen, sich darum zu kümmern. Das Frühstück gibt es von sieben bis zehn Uhr im Restaurant unten. Wir dürfen unser Gepäck bis zwölf Uhr im Zimmer lassen, wenn wir auschecken. Morgen möchte ich einen Ausflug machen und ein paar kleine Inseln besuchen. Man kann mit dem Boot fahren.","en":"We arrived at the hotel yesterday evening and checked in straight away. The room is on the fourth floor and has a great view of the sea. Unfortunately the air conditioning doesn't work properly and the wifi is very slow. I asked at reception; the lady was very friendly and promised to take care of it. Breakfast is from seven to ten o'clock in the restaurant downstairs. We may leave our luggage in the room until twelve o'clock when we check out. Tomorrow I would like to take a trip and visit a few small islands. You can go by boat.","q":[["What is the problem in the room?","Die Klimaanlage funktioniert nicht","Es gibt kein Bett","Der Blick ist schlecht"],["Until when is breakfast available?","Bis zehn Uhr","Bis zwölf Uhr","Bis sieben Uhr"],["What does he want to do tomorrow?","Inseln besuchen","Auschecken","Das WLAN reparieren"]],"v":[["einchecken","to check in"],["auschecken","to check out"],["die Rezeption","the reception"],["das Gepäck","the luggage"],["sich kümmern um","to take care of"]]},{"lv":"A2","t":"Mein erster Arbeitstag","tag":"work","de":"Heute war mein erster Arbeitstag in der neuen Firma. Ich war sehr nervös, als ich das Gebäude betreten habe. Meine neue Chefin hat mich am Empfang abgeholt und mir alles gezeigt: das Büro, die Küche und den Aufenthaltsraum. Meine Kollegen haben sich alle vorgestellt. Ich habe einen Laptop und einen Ausweis bekommen. Die Einarbeitung dauert zwei Wochen. Am Vormittag habe ich viele E-Mails gelesen und am Nachmittag habe ich an einer Besprechung teilgenommen. Ich habe nicht alles verstanden, aber ich habe mir Notizen gemacht. Mein Kollege Thomas hat gesagt: „Fragen Sie mich einfach, wenn etwas unklar ist.“ Das hat mir sehr geholfen.","en":"Today was my first day of work at the new company. I was very nervous when I entered the building. My new boss picked me up at reception and showed me everything: the office, the kitchen and the staff room. All my colleagues introduced themselves. I got a laptop and an ID card. The induction takes two weeks. In the morning I read a lot of emails and in the afternoon I took part in a meeting. I didn't understand everything, but I made notes. My colleague Thomas said: “Just ask me if anything is unclear.” That helped me a lot.","q":[["Who showed him the company?","Seine neue Chefin","Ein Kollege","Der Empfang"],["How long is the induction?","Zwei Wochen","Einen Tag","Zwei Monate"],["What did he do in the afternoon?","An einer Besprechung teilnehmen","E-Mails lesen","Einen Ausweis machen"]],"v":[["betreten","to enter"],["der Empfang","the reception"],["die Einarbeitung","the induction / onboarding"],["teilnehmen an","to take part in"],["unklar","unclear"]]},{"lv":"A2","t":"Ein Praktikum im Tierheim","tag":"work","de":"Im letzten Jahr habe ich ein Praktikum in einem Tierheim gemacht, weil ich Tiere liebe. Ich musste jeden Morgen um sechs Uhr aufstehen und zuerst die Hunde füttern. Danach habe ich die Käfige gereinigt und mit den Katzen gespielt. Die Arbeit war anstrengend, aber ich habe viel gelernt. Besonders gut hat mir gefallen, dass ich den Tieren helfen konnte. Einmal ist ein kleiner Hund krank geworden und ich habe ihn zum Tierarzt gebracht. Zum Glück ist er schnell wieder gesund geworden. Ich habe auch gelernt, wie man mit schwierigen Tieren umgeht. Ich kann das Praktikum jedem empfehlen, der Tiere mag.","en":"Last year I did an internship in an animal shelter because I love animals. I had to get up at six every morning and feed the dogs first. After that I cleaned the cages and played with the cats. The work was exhausting, but I learned a lot. I particularly liked that I could help the animals. Once a small dog became ill and I took it to the vet. Luckily it got well again quickly. I also learned how to handle difficult animals. I can recommend the internship to anyone who likes animals.","q":[["Why did she do the internship?","Weil sie Tiere liebt","Weil sie früh aufsteht","Weil es ein Job war"],["What did she do first in the morning?","Die Hunde füttern","Die Käfige reinigen","Zum Tierarzt fahren"],["What happened to the small dog?","Er ist krank geworden","Er ist weggelaufen","Er hat gespielt"]],"v":[["das Praktikum","the internship"],["das Tierheim","the animal shelter"],["füttern","to feed"],["umgehen mit","to handle / deal with"],["empfehlen","to recommend"]]},{"lv":"A2","t":"Gesund leben","tag":"health","de":"Mein Arzt hat mir gesagt, dass ich mich mehr bewegen soll. Ich habe jahrelang im Büro gesessen und wenig Sport gemacht. Jetzt jogge ich zweimal pro Woche im Park und ich fahre mit dem Fahrrad zur Arbeit. Außerdem versuche ich, gesünder zu essen: mehr Gemüse, weniger Fleisch und kein Fertigessen. Am Anfang war es schwer, aber inzwischen fühle ich mich viel besser. Ich schlafe tiefer und ich habe mehr Energie im Alltag. Ich trinke auch zwei Liter Wasser pro Tag und ich stehe eine halbe Stunde früher auf, damit ich Zeit für Sport habe. Mein nächster Plan: Ich möchte im Frühling einen Marathon laufen.","en":"My doctor told me that I should exercise more. For years I sat in the office and did little sport. Now I jog twice a week in the park and I cycle to work. Besides, I try to eat more healthily: more vegetables, less meat and no ready meals. In the beginning it was hard, but meanwhile I feel much better. I sleep more deeply and I have more energy in everyday life. I also drink two litres of water a day and I get up half an hour earlier so that I have time for sport. My next plan: I would like to run a marathon in spring.","q":[["What did the doctor advise?","Sich mehr bewegen","Mehr Fleisch essen","Weniger schlafen"],["How does she get to work now?","Mit dem Fahrrad","Mit dem Auto","Mit dem Bus"],["Why does she get up earlier?","Damit sie Zeit für Sport hat","Weil sie nicht schlafen kann","Weil die Arbeit früher beginnt"]],"v":[["sich bewegen","to exercise / move"],["das Fertigessen","the ready meal"],["außerdem","besides / in addition"],["damit","so that"],["der Marathon","the marathon"]]},{"lv":"A2","t":"Ein Konzert in der Stadt","tag":"culture","de":"Gestern Abend waren wir auf einem Konzert. Die Band spielt seit fünfzehn Jahren und ich höre ihre Musik seit meiner Jugend. Wir haben die Karten schon im Februar gekauft, deshalb haben wir gute Plätze gehabt. Die Halle war voll und die Stimmung war fantastisch. Um acht Uhr ist die Band auf die Bühne gekommen und alle haben applaudiert. Sie haben zwei Stunden gespielt, auch viele alte Lieder. Ich habe die ganze Zeit gesungen und getanzt. Am Ende hat der Sänger gesagt: „Danke, ihr wart ein wunderbares Publikum!“ Wir sind erst um Mitternacht nach Hause gekommen und ich war heute Morgen sehr müde.","en":"Yesterday evening we were at a concert. The band has been playing for fifteen years and I have listened to their music since my youth. We bought the tickets back in February, so we had good seats. The hall was full and the atmosphere was fantastic. At eight o'clock the band came on stage and everyone applauded. They played for two hours, including many old songs. I sang and danced the whole time. At the end the singer said: “Thank you, you were a wonderful audience!” We only got home at midnight and I was very tired this morning.","q":[["When did they buy the tickets?","Im Februar","Gestern","Vor fünfzehn Jahren"],["How long did the band play?","Zwei Stunden","Eine Stunde","Fünfzehn Jahre"],["When did they get home?","Um Mitternacht","Um acht Uhr","Am Morgen"]],"v":[["die Stimmung","the atmosphere / mood"],["die Bühne","the stage"],["applaudieren","to applaud"],["das Publikum","the audience"],["die Jugend","the youth"]]},{"lv":"A2","t":"Wohnungssuche in der Großstadt","tag":"home","de":"Ich suche schon seit drei Monaten eine Wohnung und es ist sehr frustrierend. Die Wohnungen in der Innenstadt sind viel zu teuer; für zwei Zimmer zahlt man oft über tausend Euro. Ich habe ungefähr fünfzig Anzeigen gelesen und bei zwanzig angerufen. Bei den meisten war die Wohnung schon weg. Zweimal war ich bei einer Besichtigung. Die erste Wohnung war zu dunkel, die zweite war zu klein und das Bad war alt. Trotzdem muss ich bald eine Entscheidung treffen, denn mein Mietvertrag läuft in zwei Monaten ab. Ein Kollege hat mir geraten, auch am Stadtrand zu suchen. Dort ist es ruhiger, aber die Fahrt zur Arbeit ist länger.","en":"I have been looking for a flat for three months and it is very frustrating. The flats in the city centre are far too expensive; for two rooms you often pay over a thousand euros. I have read about fifty adverts and called about twenty. In most cases the flat was already gone. I went to two viewings. The first flat was too dark, the second was too small and the bathroom was old. Nevertheless I have to make a decision soon, because my tenancy runs out in two months. A colleague advised me to also look on the outskirts. It is quieter there, but the journey to work is longer.","q":[["Why is the search frustrating?","Die Wohnungen sind zu teuer","Es gibt zu viele Wohnungen","Die Anzeigen sind falsch"],["How many viewings did she go to?","Zwei","Zwanzig","Fünfzig"],["When does her tenancy end?","In zwei Monaten","In drei Monaten","In einem Jahr"]],"v":[["die Wohnungssuche","the flat hunt"],["die Anzeige","the advert"],["die Besichtigung","the viewing"],["trotzdem","nevertheless"],["der Stadtrand","the outskirts"]]},{"lv":"A2","t":"Ein kleiner Unfall","tag":"story","de":"Am Montagmorgen bin ich mit dem Fahrrad zur Arbeit gefahren. Es hat geregnet und die Straße war nass. An einer Kreuzung habe ich die Straßenbahn nicht gesehen, weil ein Auto vor mir stand. Ich habe stark gebremst, bin aber trotzdem gestürzt. Mein Fahrrad war kaputt und mein Knie hat sehr wehgetan. Ein Autofahrer hat sofort angehalten und mir geholfen. Er hat einen Krankenwagen gerufen. Im Krankenhaus haben sie mein Knie geröntgt. Zum Glück war nichts gebrochen, nur eine Prellung. Seitdem fahre ich langsamer und ich trage immer einen Helm. Ich weiß jetzt, wie schnell so etwas passieren kann.","en":"On Monday morning I was cycling to work. It was raining and the road was wet. At a junction I didn't see the tram because a car was in front of me. I braked hard, but fell off anyway. My bike was broken and my knee hurt a lot. A driver stopped immediately and helped me. He called an ambulance. At the hospital they x-rayed my knee. Luckily nothing was broken, only a bruise. Since then I cycle more slowly and I always wear a helmet. I now know how quickly something like that can happen.","q":[["Why didn't he see the tram?","Weil ein Auto vor ihm stand","Weil es dunkel war","Weil er zu schnell gefahren ist"],["What happened to his knee?","Eine Prellung","Ein Bruch","Nichts"],["What does he do differently now?","Er trägt einen Helm","Er fährt nicht mehr","Er nimmt die Straßenbahn"]],"v":[["die Kreuzung","the junction / crossroads"],["bremsen","to brake"],["stürzen","to fall (off)"],["wehtun","to hurt"],["die Prellung","the bruise"]]},{"lv":"A2","t":"Kochen mit Freunden","tag":"food","de":"Am Samstag haben wir Freunde zum Essen eingeladen. Wir haben lange überlegt, was wir kochen sollen, und haben uns für ein indisches Curry entschieden. Mein Freund ist zum Markt gegangen und hat frisches Gemüse, Reis und Gewürze gekauft. Ich habe die Küche aufgeräumt und den Tisch gedeckt. Um sechs Uhr sind die Gäste gekommen. Wir haben zusammen gekocht und viel gelacht. Das Curry war am Anfang zu scharf, aber mit etwas Joghurt hat es sehr gut geschmeckt. Zum Nachtisch gab es Eis und frische Mangos. Wir haben bis Mitternacht am Tisch gesessen und über alte Zeiten gesprochen. Es war ein wunderschöner Abend.","en":"On Saturday we invited friends for a meal. We thought for a long time about what we should cook and decided on an Indian curry. My friend went to the market and bought fresh vegetables, rice and spices. I tidied the kitchen and laid the table. At six o'clock the guests arrived. We cooked together and laughed a lot. At first the curry was too hot, but with a little yoghurt it tasted very good. For dessert there was ice cream and fresh mangoes. We sat at the table until midnight and talked about old times. It was a wonderful evening.","q":[["What did they cook?","Ein indisches Curry","Einen Braten","Eine Pizza"],["Why was the curry too hot at first?","Wegen der Gewürze","Wegen des Joghurts","Wegen des Reises"],["What time did the guests arrive?","Um sechs Uhr","Um Mitternacht","Um acht Uhr"]],"v":[["einladen","to invite"],["sich entscheiden für","to decide on"],["das Gewürz","the spice"],["den Tisch decken","to lay the table"],["der Nachtisch","the dessert"]]},{"lv":"A2","t":"Arbeiten von zu Hause","tag":"work","de":"Seit einem Jahr arbeite ich drei Tage pro Woche im Homeoffice. Am Anfang war es schwierig: Ich habe am Küchentisch gesessen und mich schlecht konzentriert. Jetzt habe ich ein kleines Arbeitszimmer mit einem richtigen Schreibtisch und einem guten Stuhl. Ich darf mir meine Zeit selbst einteilen, solange ich zu den Besprechungen komme und meine Aufgaben erledige. Das ist der größte Vorteil: Ich muss nicht mehr eine Stunde pendeln und kann mittags sport machen. Der Nachteil ist, dass ich meine Kollegen seltener sehe. Früher habe ich viel im Büro gelernt, einfach weil ich zugehört habe. Deshalb fahre ich an zwei Tagen bewusst ins Büro. Ich möchte nicht mehr ganz darauf verzichten.","en":"For a year now I have been working from home three days a week. In the beginning it was difficult: I sat at the kitchen table and concentrated badly. Now I have a small study with a proper desk and a good chair. I am allowed to organise my time myself, as long as I come to the meetings and complete my tasks. That is the biggest advantage: I no longer have to commute for an hour and I can do sport at midday. The disadvantage is that I see my colleagues less often. I used to learn a lot in the office, simply because I listened. That is why I deliberately go into the office two days. I would not want to give that up entirely.","q":[["How often does he work from home?","Drei Tage pro Woche","Jeden Tag","Zwei Tage pro Woche"],["What was the problem at the beginning?","Er konnte sich am Küchentisch schlecht konzentrieren","Er hatte keinen Computer","Sein Chef war dagegen"],["Why does he still go to the office?","Weil er dort Kollegen sieht und nebenbei lernt","Weil er dort weniger arbeitet","Weil er pendeln muss"]],"v":[["das Homeoffice","working from home"],["sich konzentrieren","to concentrate"],["sich einteilen","to organise (one's time)"],["pendeln","to commute"],["verzichten auf","to give up / do without"]]},{"lv":"B1","t":"Bahnfahren in Deutschland","tag":"society","de":"Viele Pendler in Deutschland verbringen jeden Tag zwei Stunden im Zug. Früher galt die Deutsche Bahn als zuverlässig, heute klagen viele Fahrgäste über Verspätungen. Im vergangenen Jahr kam nur etwa jeder zweite Fernzug pünktlich an. Die Gründe sind bekannt: Jahrzehntelang wurde zu wenig in Schienen, Brücken und Signale investiert. Gleichzeitig ist die Zahl der Fahrgäste stark gestiegen. Die Bahn verspricht nun eine „Generalsanierung“ des Netzes. Dafür sollen wichtige Strecken für mehrere Monate komplett gesperrt werden. Kritiker warnen, dass Reisende dann noch länger unterwegs sind. Befürworter entgegnen, dass man ein kaputtes System nicht im laufenden Betrieb reparieren kann. Wer flexibel ist, fährt außerhalb der Stoßzeiten und bucht früh; dann ist die Bahn immer noch das umweltfreundlichste Verkehrsmittel.","en":"Many commuters in Germany spend two hours on the train every day. The German railway used to be considered reliable, today many passengers complain about delays. Last year only about every second long-distance train arrived on time. The reasons are well known: for decades too little was invested in rails, bridges and signals. At the same time the number of passengers has risen sharply. The railway is now promising a “general overhaul” of the network. For that, important routes are to be completely closed for several months. Critics warn that travellers will then be on the road even longer. Supporters reply that you cannot repair a broken system while it is running. Anyone who is flexible travels outside rush hour and books early; then the train is still the most environmentally friendly means of transport.","q":[["How many long-distance trains arrived on time last year?","Etwa die Hälfte","Fast alle","Nur wenige"],["What is being criticised about the “general overhaul”?","Dass Reisende länger unterwegs sind","Dass sie zu teuer ist","Dass sie zu lange dauert"],["What does the railway recommend implicitly?","Außerhalb der Stoßzeiten zu fahren","Nur mit dem Auto zu fahren","Tickets teurer zu machen"]],"v":[["der Pendler","the commuter"],["die Verspätung","the delay"],["die Schiene","the rail"],["sperren","to close (off)"],["entgegnen","to reply / retort"],["die Stoßzeit","the rush hour"]]},{"lv":"B1","t":"Arbeitskultur im Vergleich","tag":"work","de":"Wer in Deutschland arbeitet, merkt schnell: Die Erwartungen sind anders als in vielen anderen Ländern. Pünktlichkeit gilt als Respekt, und eine Besprechung beginnt meist zur vereinbarten Minute. Es wird erwartet, dass man sich vorbereitet und seine Meinung deutlich sagt, auch wenn sie von der des Chefs abweicht. Kritik an einer Idee ist nicht als Kritik an der Person gemeint; das empfinden Menschen aus höflicheren Kulturen oft als hart. Gleichzeitig legt man Wert auf die Trennung von Beruf und Privatleben: Nach Feierabend E-Mails zu beantworten ist unüblich, und Urlaubstage werden tatsächlich genommen. In den letzten Jahren haben sich viele Regeln gelockert. Homeoffice ist verbreitet, und jüngere Teams duzen sich meistens. Geblieben ist die Erwartung, dass Absprachen eingehalten werden.","en":"Anyone who works in Germany notices quickly: the expectations are different from many other countries. Punctuality counts as respect, and a meeting usually begins at the agreed minute. People are expected to prepare and to state their opinion clearly, even if it differs from the boss's. Criticism of an idea is not meant as criticism of the person; people from more polite cultures often find that harsh. At the same time, value is placed on separating work and private life: answering emails after work is unusual, and holiday days are actually taken. In recent years many rules have relaxed. Working from home is widespread, and younger teams usually use the informal “du”. What remains is the expectation that agreements are kept.","q":[["What does punctuality count as in Germany?","Respekt","Höflichkeit","Stress"],["How is criticism of an idea meant?","Nicht als Kritik an der Person","Als Beleidigung","Als Frage"],["What has changed in recent years?","Homeoffice ist verbreitet","Pünktlichkeit ist unwichtig","Man macht weniger Urlaub"]],"v":[["merken","to notice"],["abweichen von","to differ from"],["der Feierabend","the end of the working day"],["unüblich","unusual"],["sich duzen","to use the informal “du”"],["die Absprache","the agreement"]]},{"lv":"B1","t":"Wie wird man in Deutschland Lehrerin?","tag":"education","de":"Wer in Deutschland Lehrerin oder Lehrer werden will, muss einen langen Weg gehen. Zuerst studiert man an der Universität zwei Fächer, zum Beispiel Deutsch und Geschichte. Das Studium dauert in der Regel zehn Semester und schließt mit dem Staatsexamen ab. Danach folgt der Vorbereitungsdienst, auch Referendariat genannt: Achtzehn Monate lang unterrichtet man an einer Schule, wird von erfahrenen Kollegen betreut und legt am Ende eine weitere Prüfung ab. Erst dann darf man sich auf eine Stelle bewerben. Kritisiert wird, dass die Ausbildung sehr theoretisch beginnt und die Praxis zu spät kommt. Deshalb wurde in einigen Bundesländern ein Praxissemester eingeführt. Der Beruf ist anspruchsvoll, aber die meisten Lehrkräfte berichten, dass die Arbeit mit jungen Menschen sie motiviert.","en":"Anyone who wants to become a teacher in Germany has a long road ahead. First you study two subjects at university, for example German and history. The degree course usually lasts ten semesters and ends with the state examination. After that comes the preparatory service, also called the traineeship: for eighteen months you teach at a school, are supervised by experienced colleagues and sit a further examination at the end. Only then may you apply for a post. It is criticised that the training begins very theoretically and the practice comes too late. That is why a practical semester was introduced in some federal states. The profession is demanding, but most teachers report that working with young people motivates them.","q":[["How long does the traineeship last?","Achtzehn Monate","Zehn Semester","Zwei Jahre"],["What is criticised about the training?","Dass die Praxis zu spät kommt","Dass sie zu kurz ist","Dass sie zu billig ist"],["When may you apply for a post?","Nach dem Vorbereitungsdienst","Nach dem ersten Semester","Nach dem Abitur"]],"v":[["der Vorbereitungsdienst","the preparatory service"],["betreuen","to supervise / mentor"],["ablegen (eine Prüfung)","to sit (an exam)"],["anspruchsvoll","demanding"],["die Lehrkraft","the teacher"]]},{"lv":"B1","t":"Was wäre, wenn …","tag":"environment","de":"Wenn wir unseren Lebensstil nicht ändern, werden die Sommer in Europa noch heißer und trockener. Schon heute erleben wir Dürren, Waldbrände und Ernteausfälle. Viele Maßnahmen sind bekannt: Wir könnten öffentliche Verkehrsmittel nutzen statt des Autos, regional und saisonal einkaufen, weniger Fleisch essen und unsere Wohnungen besser dämmen. Kritiker sagen, der Verzicht sei zu teuer und der Einzelne habe ohnehin keinen Einfluss. Doch das ist nur die halbe Wahrheit: Ein Viertel der Emissionen hängt direkt am Verhalten der Haushalte. Außerdem wirkt politischer Druck, wenn viele Menschen ihn ausüben. Würde jeder Haushalt auch nur zehn Prozent Energie sparen, entspräche das dem Stromverbrauch einer Kleinstadt. Die Frage ist also nicht, ob wir handeln können, sondern ob wir es wollen.","en":"If we do not change our lifestyle, summers in Europe will become even hotter and drier. Already today we are experiencing droughts, forest fires and crop failures. Many measures are known: we could use public transport instead of the car, buy regional and seasonal produce, eat less meat and insulate our homes better. Critics say that doing without is too expensive and the individual has no influence anyway. But that is only half the truth: a quarter of emissions depend directly on household behaviour. Besides, political pressure works when many people exert it. If every household saved even just ten percent of energy, that would correspond to the electricity consumption of a small town. The question therefore is not whether we can act, but whether we want to.","q":[["What do critics argue?","Der Verzicht sei zu teuer","Das Klima ändere sich nicht","Autos seien besser"],["How much of emissions depends on household behaviour?","Ein Viertel","Die Hälfte","Zehn Prozent"],["What does the text say is the real question?","Ob wir handeln wollen","Ob wir handeln können","Ob es zu teuer ist"]],"v":[["die Dürre","the drought"],["der Ernteausfall","the crop failure"],["die Maßnahme","the measure"],["dämmen","to insulate"],["der Verzicht","doing without / renunciation"]]},{"lv":"B1","t":"Das Vorstellungsgespräch","tag":"work","de":"Als ich den Raum betrat, saßen drei Personen am Tisch: die Personalchefin, der Abteilungsleiter und eine Mitarbeiterin, die während des gesamten Gesprächs schwieg. Man bot mir Wasser an, und wir sprachen zwanzig Minuten über meinen Lebenslauf. Dann kam die Frage, auf die ich mich vorbereitet hatte: „Warum sollten wir gerade Sie einstellen?“ Ich nannte zwei Projekte, die ich geleitet hatte, und erklärte, was ich daraus gelernt hatte. Als Nächstes fragte man nach meinen Schwächen. Ich gab eine ehrliche Antwort und beschrieb, woran ich arbeite. Am Ende durfte ich selbst Fragen stellen; ich erkundigte mich nach dem Team und nach den Erwartungen im ersten Jahr. Zwei Tage später erhielt ich eine Zusage. Rückblickend war entscheidend, dass ich konkret geblieben bin statt allgemein zu antworten.","en":"When I entered the room, three people were sitting at the table: the head of personnel, the department head and an employee who remained silent during the entire conversation. I was offered water, and we talked for twenty minutes about my CV. Then came the question I had prepared for: “Why should we hire you of all people?” I named two projects I had led and explained what I had learned from them. Next they asked about my weaknesses. I gave an honest answer and described what I am working on. At the end I was allowed to ask questions myself; I asked about the team and about the expectations in the first year. Two days later I received an offer. In retrospect it was decisive that I stayed concrete instead of answering in general terms.","q":[["Who stayed silent during the conversation?","Eine Mitarbeiterin","Die Personalchefin","Der Abteilungsleiter"],["How did he answer the question about weaknesses?","Ehrlich","Gar nicht","Mit einer Gegenfrage"],["What does he think was decisive?","Dass er konkret geblieben ist","Dass er Wasser getrunken hat","Dass er zwei Projekte hatte"]],"v":[["die Schwäche","the weakness"],["einstellen","to hire"],["leiten","to lead / manage"],["sich erkundigen nach","to ask about"],["die Zusage","the acceptance / offer"],["rückblickend","in retrospect"]]},{"lv":"B1","t":"Bildschirmzeit und Schlaf","tag":"science","de":"Kaum ein Thema beschäftigt Eltern so sehr wie die Bildschirmzeit ihrer Kinder. Studien zeigen: Es kommt weniger auf die Dauer an als auf den Inhalt und den Zeitpunkt. Wer kurz vor dem Schlafen auf ein helles Display schaut, dessen Körper produziert weniger Melatonin; man schläft später ein und wacht häufiger auf. Deshalb empfehlen Fachleute, Geräte eine Stunde vor dem Schlafengehen wegzulegen. Ebenso wichtig ist, was man konsumiert: Ein schnelles Spiel mit ständigen Belohnungen regt mehr auf als ein langer Artikel oder ein Hörspiel. Positiv wirkt es, wenn Eltern mit ihren Kindern über das Gesehene sprechen, statt es nur zu verbieten. Wer versteht, was er sieht, kann besser damit umgehen. Ein generelles Verbot dagegen führt oft nur dazu, dass heimlich geschaut wird.","en":"Few subjects preoccupy parents as much as their children's screen time. Studies show: it depends less on the duration than on the content and the timing. Anyone who looks at a bright screen shortly before sleeping produces less melatonin; they fall asleep later and wake up more often. That is why experts recommend putting devices away an hour before going to bed. Equally important is what is consumed: a fast game with constant rewards is more stimulating than a long article or an audio play. It has a positive effect when parents talk with their children about what they have watched instead of simply forbidding it. Anyone who understands what they see can handle it better. A general ban, by contrast, often only leads to secret watching.","q":[["What matters more than the duration of screen time?","Der Inhalt und der Zeitpunkt","Das Alter des Kindes","Die Größe des Displays"],["Why is a screen before bed problematic?","Der Körper produziert weniger Melatonin","Das Display ist zu hell für die Augen","Die Kinder werden hungrig"],["What do experts recommend instead of a ban?","Über das Gesehene sprechen","Nur Hörspiele erlauben","Den Internetanschluss abschalten"]],"v":[["beschäftigen","to preoccupy"],["einschlafen","to fall asleep"],["aufregen","to stimulate / agitate"],["das Hörspiel","the audio play"],["heimlich","secretly"]]},{"lv":"B1","t":"Angekommen","tag":"society","de":"Als Amara vor sieben Jahren nach Deutschland kam, sprach sie kein Wort Deutsch. Sie hatte im Heimatland als Krankenschwester gearbeitet, doch ihr Abschluss wurde hier zunächst nicht anerkannt. Zwei Jahre lang arbeitete sie in einer Reinigung, lernte abends Deutsch und bereitete sich auf die Anerkennungsprüfung vor. Sie bestand im zweiten Versuch. Heute arbeitet sie in einer Klinik in Hannover und bildet selbst neue Pflegekräfte aus. Was ihr geholfen hat? „Ein Vermieter, der mir beim Ausfüllen der Formulare geholfen hat, und eine Kollegin, die mir nie die einfache Antwort gegeben hat.“ Sie sagt auch, dass die Bürokratie das Schwierigste war, nicht die Sprache. Ohne Geduld, meint sie, scheitern viele, die fachlich längst bereit wären.","en":"When Amara came to Germany seven years ago, she did not speak a word of German. She had worked as a nurse in her home country, but her qualification was initially not recognised here. For two years she worked in a cleaning job, learned German in the evenings and prepared for the recognition examination. She passed on her second attempt. Today she works in a clinic in Hanover and trains new nursing staff herself. What helped her? “A landlord who helped me fill in the forms, and a colleague who never gave me the easy answer.” She also says that the bureaucracy was the hardest part, not the language. Without patience, she thinks, many people fail who professionally have long been ready.","q":[["What did Amara do before her qualification was recognised?","In einer Reinigung arbeiten","Als Krankenschwester arbeiten","Deutsch unterrichten"],["When did she pass the examination?","Im zweiten Versuch","Im ersten Versuch","Nach sieben Jahren"],["What does she say was the hardest part?","Die Bürokratie","Die Sprache","Die Arbeit"]],"v":[["anerkennen","to recognise (a qualification)"],["die Reinigung","the cleaning job"],["der Versuch","the attempt"],["ausbilden","to train"],["ausfüllen","to fill in"]]},{"lv":"B1","t":"Die Energiewende","tag":"environment","de":"Der Umbau der Energieversorgung ist eines der größten Projekte der deutschen Nachkriegsgeschichte. Ziel ist es, bis zum Jahr 2045 klimaneutral zu sein. Der Anteil der erneuerbaren Energien am Stromverbrauch ist inzwischen auf über fünfzig Prozent gestiegen; an windigen Tagen wird zeitweise mehr Strom erzeugt als verbraucht. Dennoch bleiben drei Probleme: Erstens wird der Netzausbau nicht mit dem Tempo des Ausbaus der Windräder Schritt halten. Zweitens fehlen Speicher, um den überschüssigen Strom für windstille Nächte zu bewahren. Drittens entstehen weiterhin Emissionen im Verkehr und in der Industrie, die schwerer zu vermeiden sind als im Stromsektor. Ob das Ziel erreicht wird, hängt deshalb weniger von der Technik ab als von der Geschwindigkeit, mit der Genehmigungen erteilt werden.","en":"The transformation of the energy supply is one of the largest projects in German post-war history. The aim is to be climate-neutral by 2045. The share of renewable energies in electricity consumption has meanwhile risen to over fifty percent; on windy days more electricity is at times generated than consumed. Nevertheless three problems remain: first, the expansion of the grid will not keep pace with the speed at which wind turbines are being built. Second, storage facilities are lacking to keep the surplus electricity for windless nights. Third, emissions continue to arise in transport and industry, which are harder to avoid than in the electricity sector. Whether the goal is reached therefore depends less on the technology than on the speed with which permits are granted.","q":[["By when does Germany want to be climate-neutral?","Bis 2045","Bis 2025","Bis 2050"],["What happens on windy days?","Mehr Strom wird erzeugt als verbraucht","Der Strom wird teurer","Die Netze werden abgeschaltet"],["What does success depend on most, according to the text?","Der Geschwindigkeit der Genehmigungen","Der Zahl der Windräder","Dem Preis für Strom"]],"v":[["der Umbau","the conversion / rebuilding"],["der Netzausbau","the grid expansion"],["mit etwas Schritt halten","to keep pace with something"],["der Speicher","the storage facility"],["die Genehmigung","the permit"]]},{"lv":"B1","t":"Ein Jahr im Ausland","tag":"society","de":"Nach dem Abitur wusste ich nicht, was ich studieren sollte. Statt mich sofort einzuschreiben, habe ich ein Freiwilligenjahr in einem Dorf in Ghana gemacht. Ich habe in einer kleinen Schule Englisch unterrichtet und bei einem Brunnenprojekt mitgearbeitet. Die ersten Wochen waren schwer: Es gab oft keinen Strom, das Wasser musste vom Brunnen geholt werden, und ich war die einzige Europäerin im Umkreis von dreißig Kilometern. Aber gerade deshalb habe ich gelernt, wie wenig man eigentlich braucht. Zurück in Deutschland fiel mir auf, wie selbstverständlich wir Dinge wie fließendes Wasser nehmen. Das Jahr hat mir nicht gesagt, was ich werden will — aber es hat mir gezeigt, was mir wichtig ist.","en":"After my A-levels I did not know what I should study. Instead of enrolling immediately, I did a voluntary year in a village in Ghana. I taught English in a small school and helped with a well project. The first weeks were hard: there was often no electricity, water had to be fetched from the well, and I was the only European within thirty kilometres. But precisely because of that I learned how little one actually needs. Back in Germany I noticed how much we take things like running water for granted. The year did not tell me what I want to become — but it showed me what is important to me.","q":[["Why did she do a voluntary year?","Weil sie nicht wusste, was sie studieren sollte","Weil sie Geld brauchte","Weil es Pflicht war"],["What was difficult in the first weeks?","Es gab oft keinen Strom","Die Arbeit war zu schwer","Die Kinder waren unfreundlich"],["What did the year show her?","Was ihr wichtig ist","Was sie werden will","Wie man Brunnen baut"]],"v":[["sich einschreiben","to enrol"],["der Brunnen","the well"],["im Umkreis von","within a radius of"],["selbstverständlich","a matter of course"],["auffallen","to notice / to stand out"]]},{"lv":"B1","t":"Ernährung und Klima","tag":"environment","de":"Was wir essen, hat Folgen, die weit über den eigenen Teller hinausgehen. Die Erzeugung von einem Kilogramm Rindfleisch verbraucht etwa fünfzehntausend Liter Wasser und verursacht so viele Treibhausgase wie eine Autofahrt von hundertzwanzig Kilometern. Pflanzliche Lebensmittel kommen mit einem Bruchteil davon aus. Das bedeutet nicht, dass jeder vollständig auf Fleisch verzichten muss. Wer nur zwei Tage pro Woche darauf verzichtet und dafür Hülsenfrüchte isst, senkt seinen Fußabdruck bereits deutlich. Hinzu kommt ein zweiter Faktor, der oft übersehen wird: Rund ein Drittel aller Lebensmittel wird weggeworfen — in der Landwirtschaft, im Handel und vor allem in privaten Küchen. Wer bewusst einkauft und Reste verwertet, bewirkt mehr als mancher Verzicht.","en":"What we eat has consequences that go far beyond our own plate. Producing one kilogram of beef uses about fifteen thousand litres of water and causes as many greenhouse gases as a car journey of a hundred and twenty kilometres. Plant-based foods manage with a fraction of that. That does not mean that everyone has to give up meat completely. Anyone who gives it up just two days a week and eats pulses instead already lowers their footprint considerably. In addition there is a second factor that is often overlooked: around a third of all food is thrown away — in agriculture, in retail and above all in private kitchens. Anyone who shops consciously and uses up leftovers achieves more than some renunciation.","q":[["How much water does one kilogram of beef use?","Etwa fünfzehntausend Liter","Etwa fünfzig Liter","Etwa tausend Liter"],["What is the second factor that is often overlooked?","Dass ein Drittel der Lebensmittel weggeworfen wird","Dass Fleisch teuer ist","Dass Obst gesund ist"],["What does the text recommend?","Weniger wegwerfen und bewusst einkaufen","Vollständig auf Fleisch verzichten","Nur Bio-Produkte kaufen"]],"v":[["die Erzeugung","the production"],["der Bruchteil","the fraction"],["die Hülsenfrüchte","the pulses / legumes"],["der Fußabdruck","the footprint"],["verwerten","to use up / utilise"]]},{"lv":"B1","t":"Aus einem Roman","tag":"literature","de":"Es regnete schon, als er den Bahnhof verließ. Der Ort sah anders aus als in seiner Erinnerung: Die Häuser waren frisch gestrichen, die Geschäfte trugen neue Namen, und dort, wo früher das Café gewesen war, stand nun ein Parkhaus. Er schlug den Kragen hoch und ging die Straße hinunter, die er als Kind jeden Morgen gelaufen war. Nichts rief seinen Namen. Nach zwanzig Minuten erreichte er das Haus am Ende der Straße. Im Erdgeschoss brannte Licht. Er blieb stehen, die Hand auf der Gartentür, und überlegte, ob er klingeln sollte. Dann drehte er sich um und ging zurück zum Bahnhof, ohne zu wissen, warum. Manche Orte, dachte er im Zug, darf man nicht zurückerobern wollen.","en":"It was already raining when he left the station. The place looked different from his memory: the houses had been freshly painted, the shops had new names, and where the café used to be there was now a multi-storey car park. He turned up his collar and walked down the street that he had walked every morning as a child. Nothing called his name. After twenty minutes he reached the house at the end of the street. On the ground floor a light was burning. He stopped, his hand on the garden gate, and wondered whether he should ring. Then he turned around and walked back to the station, without knowing why. Some places, he thought on the train, one must not want to recapture.","q":[["What stands where the café used to be?","Ein Parkhaus","Ein Bahnhof","Ein Garten"],["How long does he walk before reaching the house?","Zwanzig Minuten","Zehn Minuten","Eine Stunde"],["What does he do in the end?","Er geht zurück zum Bahnhof","Er klingelt","Er geht ins Haus"]],"v":[["die Erinnerung","the memory"],["streichen","to paint"],["der Kragen","the collar"],["klingeln","to ring (the bell)"],["zurückerobern","to recapture"]]},{"lv":"B2","t":"Künstliche Intelligenz in der Arbeitswelt","tag":"technology","de":"Die Verbreitung leistungsfähiger Sprachmodelle hat eine Debatte ausgelöst, die über die bloße Frage nach Effizienzgewinnen hinausgeht. Unstrittig ist, dass Routineaufgaben — das Zusammenfassen von Texten, die Auswertung tabellarischer Daten, das Verfassen standardisierter Schreiben — zunehmend automatisiert werden. Umstritten ist, was dies für die Qualifikation von Berufsanfängern bedeutet. Traditionell erwirbt man Urteilsvermögen, indem man genau jene Tätigkeiten ausübt, die nun entfallen: Man lernt Verträge zu prüfen, indem man hundert Verträge prüft. Fällt diese Übungsfläche weg, droht eine Lücke, die erst sichtbar wird, wenn die heutigen Anfänger Führungspositionen besetzen. Einige Unternehmen reagieren darauf, indem sie die Überprüfung von Maschinenoutput ausdrücklich zur Aufgabe machen — wer ein Ergebnis begründet kritisieren kann, hat es verstanden. Ob sich dieses Modell durchsetzt, hängt davon ab, ob Produktivitätsgewinne kurzfristig oder Kompetenzerhalt langfristig bewertet werden.","en":"The spread of powerful language models has triggered a debate that goes beyond the mere question of efficiency gains. It is uncontested that routine tasks — summarising texts, evaluating tabular data, writing standardised letters — are increasingly being automated. What is disputed is what this means for the qualifications of young professionals. Traditionally one acquires judgement by carrying out precisely those activities that are now disappearing: one learns to check contracts by checking a hundred contracts. If this practice ground disappears, a gap threatens that will only become visible when today's beginners occupy leadership positions. Some companies are responding by explicitly making the verification of machine output a task — anyone who can criticise a result with reasons has understood it. Whether this model prevails depends on whether productivity gains in the short term or the preservation of competence in the long term are valued.","q":[["What is the actual risk described in the text?","Dass Berufsanfänger keine Übungsfläche mehr haben","Dass Maschinen mehr Fehler machen","Dass Texte schlechter werden"],["How do some companies respond?","Indem sie die Überprüfung des Outputs zur Aufgabe machen","Indem sie Anfänger entlassen","Indem sie weniger automatisieren"],["What does the outcome depend on?","Ob kurzfristige Gewinne oder langfristige Kompetenz zählen","Ob die Modelle besser werden","Ob die Kosten sinken"]],"v":[["die Verbreitung","the spread"],["unstrittig","uncontested"],["die Tätigkeit","the activity"],["entfallen","to be dropped / no longer apply"],["die Übungsfläche","the practice ground"],["das Urteilsvermögen","the power of judgement"]]},{"lv":"B2","t":"Der demografische Wandel","tag":"society","de":"Deutschland altert, und zwar auf eine Weise, die sich nicht durch Zuwanderung allein ausgleichen lässt. Prognosen des Statistischen Bundesamts zufolge wird im Jahr 2050 etwa jede dritte Person im Land älter als fünfundsechzig sein. Die Folgen betreffen vor allem drei Systeme: die Rentenversicherung, die Gesundheitsversorgung und den Arbeitsmarkt. Im Umlageverfahren finanzieren heute rund zwei Beitragszahler eine Rente; künftig dürfte es auf ein Verhältnis von eins zu eins hinauslaufen. Gleichzeitig steigt der Bedarf an Pflegekräften, während genau jene Altersgruppe schrumpft, aus der sie rekrutiert wird. Als Gegenmaßnahmen werden ein höheres Renteneintrittsalter, die stärkere Erwerbsbeteiligung von Frauen und Älteren sowie produktivitätssteigernde Technik diskutiert. Keine dieser Maßnahmen wirkt für sich allein; sie verlangen, dass politische Entscheidungen über Jahrzehnte hinweg Bestand haben.","en":"Germany is ageing, and in a way that cannot be offset by immigration alone. According to projections by the Federal Statistical Office, around one in three people in the country will be older than sixty-five in 2050. The consequences affect above all three systems: the pension insurance, the health-care system and the labour market. In the pay-as-you-go system, around two contributors finance one pension today; in future it is likely to work out at a ratio of one to one. At the same time the need for care workers is rising while exactly that age group from which they are recruited is shrinking. As counter-measures, a higher retirement age, greater labour-force participation by women and older people, and productivity-increasing technology are being discussed. None of these measures works on its own; they require that political decisions remain in force over decades.","q":[["What share of the population is expected to be over 65 in 2050?","Etwa ein Drittel","Etwa die Hälfte","Etwa ein Fünftel"],["Which three systems are most affected?","Renten, Gesundheit, Arbeitsmarkt","Schule, Uni, Ausbildung","Verkehr, Energie, Handel"],["What is said about the counter-measures?","Keine wirkt für sich allein","Eine genügt","Sie sind zu teuer"]],"v":[["ausgleichen","to offset"],["die Prognose","the projection"],["das Umlageverfahren","the pay-as-you-go system"],["schrumpfen","to shrink"],["Bestand haben","to remain in force"]]},{"lv":"B2","t":"Was die Presse berichtete","tag":"media","de":"In einer Mitteilung vom vergangenen Dienstag erklärte das Ministerium, die geplanten Reformen seien „alternativlos“ und würden noch vor der Sommerpause verabschiedet. Die Opposition widersprach umgehend: Es handle sich um einen Eingriff in Grundrechte, der dem Parlament nicht einmal vollständig vorgelegen habe. Ein Sprecher der Regierung wies dies zurück und betonte, man habe die Fraktionen frühzeitig informiert. Beobachter merkten an, dass beide Seiten denselben Vorgang mit völlig unterschiedlichen Verben beschrieben — „verabschieden“ auf der einen, „durchdrücken“ auf der anderen. Auffällig war zudem, was in keiner der Meldungen stand: Keine der großen Zeitungen berichtete, dass der Gesetzentwurf bereits in einer früheren Legislaturperiode einmal gescheitert war. Wer nur eine Quelle liest, erfährt selten, was ihr fehlt.","en":"In a statement last Tuesday, the ministry declared that the planned reforms were “without alternative” and would be passed before the summer recess. The opposition objected immediately: this was, it said, an interference with fundamental rights that parliament had not even been given in full. A government spokesman rejected this and stressed that the parliamentary groups had been informed at an early stage. Observers noted that both sides described the same process with completely different verbs — “passing” on the one hand, “forcing through” on the other. What was striking, in addition, was what appeared in none of the reports: none of the major newspapers reported that the draft bill had already failed once in an earlier legislative period. Anyone who reads only one source rarely learns what it is missing.","q":[["What does the ministry claim about the reforms?","Sie seien alternativlos","Sie seien gescheitert","Sie seien geheim"],["What do observers find striking about the language?","Dass beide Seiten denselben Vorgang anders benennen","Dass beide Seiten schweigen","Dass beide Seiten identisch formulieren"],["What fact was missing from the reports?","Dass der Entwurf früher schon einmal scheiterte","Dass es keine Opposition gibt","Dass die Reformen teuer sind"]],"v":[["die Mitteilung","the statement / communiqué"],["verabschieden","to pass (a law)"],["zurückweisen","to reject"],["der Gesetzentwurf","the draft bill"],["die Legislaturperiode","the legislative period"]]},{"lv":"B2","t":"Stadt der kurzen Wege","tag":"society","de":"Die Charta von Athen, jenes einflussreiche Manifest der Moderne von 1933, trennte Wohnen, Arbeiten und Verkehr in klar abgegrenzte Zonen. Was als Befreiung von dunklen Hinterhöfen gedacht war, erzeugte neue Abhängigkeiten: Ohne Auto war das Leben in den aufgespannten Siedlungsflächen kaum zu organisieren. Seit einigen Jahrzehnten wird diese Trennung rückgängig gemacht. Unter dem Schlagwort der Stadt der kurzen Wege entstehen Quartiere, in denen Wohnungen, Werkstätten, Kitas und Nahversorger innerhalb von fünfzehn Gehminuten liegen. Die Wirkung lässt sich messen: Der motorisierte Verkehr geht zurück, die Aufenthaltsqualität im öffentlichen Raum steigt, und die Zahl der zufälligen Begegnungen nimmt zu. Kritisch wird angemerkt, dass gut erreichbare Quartiere begehrt und damit teuer werden. Die soziale Frage verschwindet also nicht; sie wird lediglich neu gestellt.","en":"The Athens Charter, that influential manifesto of modernism from 1933, separated living, working and traffic into clearly demarcated zones. What was intended as liberation from dark back courtyards created new dependencies: without a car, life in the sprawling settlement areas could hardly be organised. For several decades now this separation has been reversed. Under the banner of the city of short distances, neighbourhoods are emerging in which flats, workshops, nurseries and local shops lie within fifteen minutes' walk. The effect can be measured: motorised traffic declines, the quality of staying in public space rises, and the number of chance encounters increases. It is noted critically that well-connected neighbourhoods become sought-after and therefore expensive. The social question thus does not disappear; it is merely reformulated.","q":[["What did the Athens Charter of 1933 introduce?","Die Trennung von Wohnen, Arbeiten und Verkehr","Die Stadt der kurzen Wege","Den öffentlichen Nahverkehr"],["What is a measurable effect of the new concept?","Der motorisierte Verkehr geht zurück","Die Mieten sinken","Die Städte wachsen schneller"],["What criticism is raised?","Dass gute Quartiere teuer werden","Dass es zu viele Autos gibt","Dass die Charta unwirksam war"]],"v":[["die Charta","the charter"],["abgegrenzt","demarcated"],["rückgängig machen","to reverse"],["die Nahversorgung","local supply / amenities"],["begehrt","sought-after"]]},{"lv":"B2","t":"Bedingungsloses Grundeinkommen","tag":"society","de":"Der Vorschlag ist bestechend einfach: Jeder Bürger erhält monatlich einen festen Betrag, ohne Bedürftigkeitsprüfung und ohne Gegenleistung. Befürworter führen zwei Argumente an. Erstens entfalle der Zwang, eine entwürdigende Tätigkeit anzunehmen, nur um den Lebensunterhalt zu sichern; das verschiebe die Verhandlungsmacht zugunsten der Arbeitnehmer. Zweitens ersetze ein einziger Transfer ein Dutzend komplizierter Sozialleistungen und spare Verwaltung. Skeptiker halten dagegen, die Finanzierung sei bei realistischen Beträgen nicht darstellbar, und eine Abkopplung von Einkommen und Leistung gefährde die Bereitschaft, unangenehme Arbeit zu übernehmen. Empirisch ist die Lage uneindeutig: Pilotprojekte in Finnland und Kanada zeigten positive Effekte auf psychische Gesundheit und Weiterbildung, jedoch kaum auf die Erwerbstätigkeit. Möglicherweise ist das die ehrlichste Auskunft, die man erwarten kann: Das Grundeinkommen macht manches besser, aber nicht alles.","en":"The proposal is disarmingly simple: every citizen receives a fixed monthly amount, without a means test and without anything in return. Supporters put forward two arguments. First, the compulsion to accept a degrading activity merely to secure a living disappears; this shifts the negotiating power in favour of employees. Second, a single transfer replaces a dozen complicated social benefits and saves administration. Sceptics object that the financing is not feasible at realistic amounts, and that decoupling income and performance endangers the willingness to take on unpleasant work. Empirically the situation is unclear: pilot projects in Finland and Canada showed positive effects on mental health and further training, but hardly any on employment. Possibly that is the most honest answer one can expect: basic income makes some things better, but not everything.","q":[["What is the first argument of supporters?","Der Zwang zu entwürdigender Arbeit entfällt","Die Steuern sinken","Die Verwaltung wächst"],["What did pilot projects show?","Positive Effekte auf Gesundheit und Weiterbildung","Starke Effekte auf die Erwerbstätigkeit","Keine messbaren Effekte"],["How does the author judge the overall result?","Es macht manches besser, aber nicht alles","Es ist eine vollständige Lösung","Es ist gescheitert"]],"v":[["bestechend","disarmingly (convincing)"],["die Bedürftigkeitsprüfung","the means test"],["entwürdigend","degrading"],["darstellbar","feasible / achievable"],["uneindeutig","unclear / ambiguous"]]},{"lv":"B2","t":"Sprache und Identität","tag":"language","de":"Sprache ist selten nur ein Werkzeug zum Informationsaustausch; sie ist ein Archiv von Zugehörigkeit. Wer einen Dialekt spricht, teilt etwas mit, das sich nicht vollständig übersetzen lässt — eine Herkunft, eine Landschaft, eine soziale Schicht. Deshalb reagieren Menschen empfindlich, wenn ihre Sprechweise korrigiert wird: Getadelt wird nicht die Grammatik, sondern die Person. Zugleich erfüllt die Standardsprache eine notwendige Funktion: Sie macht Verständigung über Regionen und Milieus hinweg erst möglich. Spannungsreich ist das Verhältnis dort, wo eine Minderheitensprache verdrängt wurde. Die Wiederbelebung des Sorbischen oder des Nordfriesischen zeigt, dass Sprachpolitik mehr sein kann als Folklore: Sie entscheidet darüber, welche Geschichten erzählt werden können und von wem. Eine Sprache zu verlieren heißt nicht, stumm zu werden — aber es heißt, die Welt in einem engeren Rahmen zu beschreiben.","en":"Language is rarely just a tool for exchanging information; it is an archive of belonging. Anyone who speaks a dialect communicates something that cannot be fully translated — an origin, a landscape, a social class. That is why people react sensitively when their way of speaking is corrected: it is not the grammar that is criticised, but the person. At the same time the standard language fulfils a necessary function: it is what makes communication across regions and social milieus possible in the first place. The relationship is tense where a minority language was displaced. The revival of Sorbian or North Frisian shows that language policy can be more than folklore: it decides which stories can be told and by whom. Losing a language does not mean becoming mute — but it does mean describing the world within a narrower frame.","q":[["Why do people react sensitively to corrections of their dialect?","Weil die Person getadelt wird, nicht die Grammatik","Weil Dialekte grammatisch falsch sind","Weil Dialekte schwer zu verstehen sind"],["What function does the standard language have?","Sie ermöglicht Verständigung über Regionen hinweg","Sie ersetzt alle Dialekte","Sie ist leichter zu lernen"],["What does losing a language mean, according to the text?","Die Welt in einem engeren Rahmen zu beschreiben","Dass man stumm wird","Dass man keine Grammatik mehr hat"]],"v":[["die Zugehörigkeit","the belonging"],["der Dialekt","the dialect"],["tadeln","to criticise / reprimand"],["verdrängen","to displace"],["der Rahmen","the frame"]]},{"lv":"B2","t":"Die europäische Idee","tag":"history","de":"Wer heute die Europäische Union betrachtet, sieht vor allem ihre Institutionen: Kommission, Rat, Parlament. Deren Ursprung liegt jedoch in einer sehr viel einfacheren Einsicht. Nach 1945 herrschte die Überzeugung, dass der Nationalismus nicht durch Appelle, sondern durch Verflechtung überwunden werden müsse. Kohle und Stahl, die Grundstoffe damaliger Rüstung, wurden deshalb 1952 einer gemeinsamen Behörde unterstellt — nicht aus wirtschaftlichem Kalkül, sondern weil ein Krieg zwischen den Mitgliedern technisch unmöglich werden sollte. Diese Logik der Verflechtung hat erstaunlich lange getragen. Sie stößt dort an Grenzen, wo gemeinsame Entscheidungen als Fremdbestimmung empfunden werden, also überall dort, wo keine europäische Öffentlichkeit existiert, die sie legitimiert. Die entscheidende Frage ist mithin nicht, ob mehr oder weniger Europa gebraucht wird, sondern ob das Vorhandene als gemeinsam empfunden wird.","en":"Anyone looking at the European Union today sees above all its institutions: Commission, Council, Parliament. Their origin, however, lies in a much simpler insight. After 1945 the conviction prevailed that nationalism had to be overcome not by appeals but by interweaving. Coal and steel, the raw materials of armaments at the time, were therefore placed under a joint authority in 1952 — not out of economic calculation, but because a war between the members was to become technically impossible. This logic of interweaving held for a remarkably long time. It reaches its limits where joint decisions are felt as external domination, that is everywhere that no European public sphere exists to legitimise them. The decisive question is therefore not whether more or less Europe is needed, but whether what exists is felt as shared.","q":[["Why were coal and steel placed under a joint authority in 1952?","Um einen Krieg technisch unmöglich zu machen","Um Steuern zu sparen","Um die Industrie zu stärken"],["Where does the logic of interweaving reach its limits?","Wo Entscheidungen als Fremdbestimmung empfunden werden","Wo es keine Industrie gibt","Wo Wahlen stattfinden"],["What is the decisive question, according to the text?","Ob das Vorhandene als gemeinsam empfunden wird","Ob mehr Europa gebraucht wird","Ob die Institutionen stark sind"]],"v":[["betrachten","to consider / look at"],["die Verflechtung","the interweaving"],["unterstellen","to place under"],["das Kalkül","the calculation"],["die Fremdbestimmung","external determination"]]},{"lv":"B2","t":"Warum wir an Verschwörungen glauben","tag":"science","de":"Verschwörungstheorien sind kein Zeichen mangelnder Bildung. Studien zeigen, dass ihr Anhängerkreis quer durch alle Bildungsgrade reicht; entscheidend ist vielmehr das Bedürfnis nach Kontrolle. Wer sich ohnmächtig fühlt, dem erscheint eine Welt, in der mächtige Akteure alles planen, beruhigender als eine, in der Zufall und Komplexität regieren. Hinzu kommt eine kognitive Eigenheit: Das Gehirn erkennt Muster bevorzugt auch dort, wo keine sind. In einer unübersichtlichen Lage liefert eine Erzählung mit klaren Tätern Struktur — und sie liefert sie sofort, während wissenschaftliche Erklärungen Unsicherheit zumuten. Zu widerlegen ist eine solche Erzählung kaum, denn jedes Gegenargument lässt sich als Teil der Verschwörung deuten. Wirksamer ist, was unbefriedigend klingt: zuzuhören, Sicherheiten anzubieten, die der Betroffene selbst herstellen kann, und Geduld zu haben.","en":"Conspiracy theories are not a sign of a lack of education. Studies show that their following cuts across all levels of education; what matters is rather the need for control. To anyone who feels powerless, a world in which powerful actors plan everything appears more reassuring than one in which chance and complexity rule. Added to this is a cognitive peculiarity: the brain preferentially recognises patterns even where there are none. In a confusing situation, a narrative with clear perpetrators provides structure — and it provides it immediately, whereas scientific explanations impose uncertainty. Such a narrative can hardly be refuted, because every counter-argument can be interpreted as part of the conspiracy. What is more effective sounds unsatisfying: listening, offering certainties that the person concerned can produce themselves, and having patience.","q":[["What is decisive for believing in conspiracy theories?","Das Bedürfnis nach Kontrolle","Mangelnde Bildung","Zu viel Lesen"],["Why is a conspiracy narrative hard to refute?","Jedes Gegenargument lässt sich als Teil der Verschwörung deuten","Sie ist zu kompliziert","Sie ist geheim"],["What does the text recommend?","Zuhören und Geduld haben","Hart widersprechen","Fakten aufzählen"]],"v":[["die Verschwörungstheorie","the conspiracy theory"],["ohnmächtig","powerless"],["die Eigenheit","the peculiarity"],["zumuten","to impose / expect of someone"],["widerlegen","to refute"]]},{"lv":"B2","t":"Arbeiten im Jahr 2035","tag":"work","de":"Prognosen über die Zukunft der Arbeit leiden regelmäßig daran, dass sie technische Machbarkeit mit tatsächlicher Einführung verwechseln. Was möglich ist, geschieht nicht automatisch; es geschieht dort, wo es sich betriebswirtschaftlich rechnet und organisatorisch durchsetzen lässt. Mit dieser Einschränkung lassen sich drei Trends benennen. Erstens verschiebt sich die Nachfrage von ausführenden zu beurteilenden Tätigkeiten — wer entscheidet, was ein System tun soll, bleibt gebraucht. Zweitens wächst der Anteil projektförmiger Zusammenarbeit; feste Stellen werden seltener, und damit werden Netzwerke zur eigentlichen Ressource. Drittens gewinnt eine Fähigkeit an Wert, die lange als nebensächlich galt: Ambiguitätstoleranz, also das Aushalten unvollständiger Informationen. Wer sofortige Gewissheit verlangt, wird in einer Arbeitswelt scheitern, in der Gewissheit dasjenige ist, was am wenigsten verfügbar sein wird.
