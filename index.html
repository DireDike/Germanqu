","en":"Forecasts about the future of work regularly suffer from confusing technical feasibility with actual adoption. What is possible does not happen automatically; it happens where it pays off commercially and can be pushed through organisationally. With this qualification, three trends can be identified. First, demand is shifting from executing to judging activities — whoever decides what a system should do remains needed. Second, the proportion of project-based collaboration is growing; permanent posts become rarer, and with that networks become the actual resource. Third, an ability is gaining value that was long regarded as marginal: tolerance of ambiguity, that is, enduring incomplete information. Anyone who demands immediate certainty will fail in a working world in which certainty is what will be least available.","q":[["What mistake do forecasts often make?","Sie verwechseln Machbarkeit mit Einführung","Sie sind zu pessimistisch","Sie vergessen die Technik"],["Which ability is gaining value?","Ambiguitätstoleranz","Schnelligkeit","Gehorsam"],["Why do networks become the actual resource?","Weil feste Stellen seltener werden","Weil Computer sie ersetzen","Weil Projekte teurer sind"]],"v":[["die Machbarkeit","the feasibility"],["sich rechnen","to pay off"],["die Einschränkung","the qualification / limitation"],["verschieben","to shift"],["nebensächlich","marginal"]]},{"lv":"B2","t":"Konsum und Verantwortung","tag":"society","de":"Der Hinweis, der Einzelne könne durch bewussten Konsum globale Lieferketten verändern, ist ebenso verbreitet wie umstritten. Richtig ist: Nachfrage wirkt, aber sie wirkt langsam und nur dort, wo sie organisiert auftritt. Ein Boykott einzelner Produkte trifft häufig nicht den Hersteller, sondern die Beschäftigten an dessen Standort. Wirksamer sind deshalb zwei andere Hebel. Der erste ist Transparenz: Wenn Unternehmen gesetzlich verpflichtet werden, über Arbeitsbedingungen zu berichten, entsteht ein Wettbewerb, der ohne Zwang nicht entstünde. Der zweite ist die Dauerhaftigkeit des Gebrauchs. Das billigste Kleidungsstück ist selten das günstigste, wenn man die Zahl der Wäschen einrechnet, die es überlebt. Verantwortung liegt mithin weniger im Moment des Kaufens als in der Frage, wie lange ein Gegenstand im Umlauf bleibt. Wegwerfen ist die eigentliche Entscheidung.","en":"The suggestion that the individual can change global supply chains through conscious consumption is as widespread as it is disputed. What is true is: demand works, but it works slowly and only where it appears in an organised way. A boycott of individual products frequently hits not the manufacturer but the employees at its location. Two other levers are therefore more effective. The first is transparency: if companies are legally obliged to report on working conditions, a competition arises that would not arise without compulsion. The second is the durability of use. The cheapest item of clothing is seldom the cheapest when you factor in the number of washes it survives. Responsibility thus lies less in the moment of buying than in the question of how long an object remains in circulation. Throwing away is the real decision.","q":[["Why can a boycott be problematic?","Er trifft oft die Beschäftigten vor Ort","Er ist zu teuer","Er wirkt sofort"],["Which lever is named first?","Transparenz durch Berichtspflicht","Höhere Preise","Weniger Werbung"],["Where does responsibility lie, according to the text?","In der Frage, wie lange ein Gegenstand im Umlauf bleibt","Im Moment des Kaufens","Beim Hersteller allein"]],"v":[["die Lieferkette","the supply chain"],["der Boykott","the boycott"],["der Hebel","the lever"],["verpflichten","to oblige"],["der Umlauf","the circulation"]]},{"lv":"B2","t":"Erinnerungskultur","tag":"history","de":"Wie eine Gesellschaft ihre Vergangenheit behandelt, sagt mehr über ihre Gegenwart aus als über die Vergangenheit selbst. In Deutschland hat sich seit den achtziger Jahren eine Form der Erinnerung durchgesetzt, die das Gedenken in den Alltag holt: Stolpersteine vor Haustüren, Gedenktafeln an Schulen, Orte, an denen man unvermutet liest, was hier geschah. Diese Dezentralität ist keine Erfindung der Nachkriegszeit, sondern eine Reaktion auf deren Versagen: Jahrzehntelang war die Auseinandersetzung an juristische Verfahren delegiert worden und damit erledigt. Kritiker wenden ein, verstreute Denkmäler ersetzten das Wissen durch Betroffenheit; man könne an hundert Steinen vorbeigehen und dennoch nichts wissen. Der Einwand ist ernst zu nehmen. Aber er spricht eher für eine Ergänzung als für eine Abschaffung: Erinnerung, die nicht im Alltag vorkommt, findet gar nicht statt.","en":"How a society treats its past says more about its present than about the past itself. In Germany a form of remembrance has prevailed since the 1980s that brings commemoration into everyday life: stumbling stones in front of front doors, memorial plaques at schools, places where one unexpectedly reads what happened here. This decentralisation is not an invention of the post-war period but a reaction to its failure: for decades the confrontation had been delegated to legal proceedings and was thus dealt with. Critics object that scattered monuments replace knowledge with being moved; one could walk past a hundred stones and still know nothing. The objection is to be taken seriously. But it argues rather for an addition than for an abolition: remembrance that does not occur in everyday life does not occur at all.","q":[["Since when has this form of remembrance prevailed in Germany?","Seit den achtziger Jahren","Seit 1945","Seit den sechziger Jahren"],["What do critics object to?","Dass Denkmäler Wissen durch Betroffenheit ersetzen","Dass es zu wenige gibt","Dass sie zu teuer sind"],["What does the author conclude?","Erinnerung muss im Alltag vorkommen","Denkmäler sollten abgeschafft werden","Juristische Verfahren genügen"]],"v":[["das Gedenken","the commemoration"],["die Gedenktafel","the memorial plaque"],["delegieren","to delegate"],["die Betroffenheit","being moved / affectedness"],["der Einwand","the objection"]]},{"lv":"B2","t":"Die Zukunft der Städte","tag":"society","de":"Es ist nicht die Technik, die Städte verändert, sondern die Frage, wem die Stadt gehört. In den vergangenen zwanzig Jahren sind die Mieten in vielen Metropolen schneller gestiegen als die Einkommen; die Folge ist eine Sortierung nach Kaufkraft, die ganze Viertel verändert. Wohnraum wird dabei zunehmend als Anlage behandelt und nicht als Gebrauchsgut — eine Verschiebung, die sich in der Bilanz eines Investors vernünftig ausnimmt und im Leben der Bewohner nicht. Als Gegenentwurf gilt das Modell der Bodenpolitik: Kommunen kaufen Grundstücke an, bevor die Preise steigen, und vergeben sie im Erbbaurecht, sodass die Spekulation entfällt. Wien und Singapur verfahren seit Jahrzehnten so. Der Erfolg hängt indes an einer Bedingung, die sich nicht kaufen lässt: am politischen Willen, langfristig zu handeln, wo kurzfristige Verkäufe bequemer wären.","en":"It is not technology that changes cities, but the question of who the city belongs to. Over the past twenty years rents in many metropolises have risen faster than incomes; the consequence is a sorting by purchasing power that transforms entire districts. Housing is thereby increasingly treated as an investment and not as a use value — a shift that looks reasonable in an investor's balance sheet and does not in the lives of the residents. The model of land policy counts as a counter-proposal: municipalities buy plots before prices rise and lease them under hereditary building rights, so that speculation is eliminated. Vienna and Singapore have proceeded this way for decades. Success, however, depends on one condition that cannot be bought: on the political will to act in the long term where short-term sales would be more convenient.","q":[["What has happened to rents in many metropolises?","Sie sind schneller gestiegen als die Einkommen","Sie sind gesunken","Sie sind gleich geblieben"],["How does the land policy model work?","Kommunen kaufen Grundstücke und vergeben sie im Erbbaurecht","Der Staat zahlt Mietzuschüsse","Investoren bauen selbst"],["What does success depend on?","Am langfristigen politischen Willen","An der Technik","An der Größe der Stadt"]],"v":[["die Kaufkraft","the purchasing power"],["die Anlage","the investment"],["das Erbbaurecht","the hereditary building right"],["die Spekulation","the speculation"],["indes","however / meanwhile"]]},{"lv":"B1","t":"Der Verein","tag":"society","de":"In Deutschland gibt es rund sechshunderttausend Vereine; jeder zweite Bürger ist mindestens in einem Mitglied. Diese Zahl überrascht Ausländer oft, und doch erklärt sie viel über das Land. Ein Verein ist keine Firma: Er verfolgt keinen Gewinn, sondern einen Zweck, der in der Satzung steht — den Gesang, den Sport, die Feuerwehr, den Schutz von Tieren. Entscheidungen werden nicht vom Inhaber getroffen, sondern von einer Mitgliederversammlung, in der jede Stimme gleich zählt. Wer Mitglied wird, unterschreibt damit eine kleine Verfassung. Das hat eine Nebenwirkung, die Soziologen seit langem beschreiben: Wer sich in einem Verein engagiert, lernt Demokratie im Kleinen — Anträge stellen, Kompromisse schließen, Verantwortung übernehmen. In einer Zeit, in der viele Institutionen Vertrauen verlieren, ist diese unscheinbare Schule der Beteiligung vielleicht wichtiger, als sie aussieht.","en":"In Germany there are around six hundred thousand associations; every second citizen is a member of at least one. This number often surprises foreigners, and yet it explains a lot about the country. An association is not a company: it pursues no profit but a purpose that is written in its statutes — singing, sport, the fire brigade, the protection of animals. Decisions are not made by the owner but by a general meeting in which every vote counts equally. Anyone who becomes a member thereby signs a small constitution. That has a side effect which sociologists have long described: anyone who gets involved in an association learns democracy in miniature — tabling motions, reaching compromises, taking responsibility. At a time when many institutions are losing trust, this inconspicuous school of participation is perhaps more important than it appears.","q":[["How many associations are there in Germany?","Rund sechshunderttausend","Rund sechstausend","Rund sechzig"],["How are decisions made in an association?","Von der Mitgliederversammlung","Vom Inhaber","Vom Staat"],["What do sociologists say about associations?","Dort lernt man Demokratie im Kleinen","Dort verdient man Geld","Dort trifft man Ausländer"]],"v":[["der Verein","the association / club"],["die Satzung","the statutes / constitution"],["die Mitgliederversammlung","the general meeting"],["der Antrag","the motion"],["unscheinbar","inconspicuous"]]}]};

}

/* Three-component memory model: Difficulty D ∈[1,10], Stability S (days),
   Retrievability R = (1 + F·t/S)^DECAY  with F=19/81, DECAY=-0.5 so R(S)=0.9
   Interval solved for a target retention: I = (S/F)·(r^(1/DECAY) − 1)
   Stability grows multiplicatively; growth is bigger when recall happens at
   LOW retrievability (desirable difficulty) and smaller for hard items.      */
var DECAY = -0.5, FACTOR = 19 / 81;
var S0 = [0.35, 0.9, 2.4, 5.5];          // initial stability by grade (days)
var W = { d0: 7.1949, d1: 0.5345, dg: 1.4604, dr: 0.0046, sg: 1.5458, sn: 0.1192, sr: 1.0193, hp: 0.2315, eb: 2.9898, lp: 1.9395, ln: 0.11, lr: 0.29605, lx: 2.2698 };

function retrievability(st, elapsedDays) {
  if (!st.s || st.s <= 0) return 0;
  var t = Math.max(0, elapsedDays);
  return Math.pow(1 + FACTOR * t / st.s, DECAY);
}
function initDifficulty(g) { return clamp(W.d0 - Math.exp(W.d1 * (g - 1)) + 1, 1, 10); }
function nextInterval(s, r) { return Math.max(0.008, (s / FACTOR) * (Math.pow(r, 1 / DECAY) - 1)); }
function meanReversion(d, g) {
  var d0 = initDifficulty(g);
  var nd = d - W.dg * (g - 3);
  return clamp(W.dr * d0 + (1 - W.dr) * nd, 1, 10);
}
function schedule(it, g, now) {
  now = now || NOW();
  var st = it.st;
  var firstTime = !st.s;
  var R = firstTime ? 1 : retrievability(st, (now - (st.last || now)) / DAY);
  if (g === 1) {                                     // Again / lapse
    var lapseD = clamp(st.d || 5, 1, 10);
    var newS = W.lp * Math.pow(lapseD, -W.ln) * (Math.pow((st.s || 1) + 1, W.lr) - 1) * Math.exp(W.lx * (1 - R));
    st.s = clamp(newS, 0.05, 3650);
    st.d = meanReversion(st.d || 5, 1);
    st.lapses = (st.lapses || 0) + 1;
    st.rel = 1;
  } else {
    var hard = g === 2 ? W.hp : 1, easy = g === 4 ? W.eb : 1;
    if (firstTime) {
      st.s = S0[g - 1];
      st.d = initDifficulty(g);
    } else {
      var growth = Math.exp(W.sg) * (11 - st.d) * Math.pow(st.s, -W.sn) * (Math.exp(W.sr * (1 - R)) - 1) * hard * easy;
      st.s = clamp(st.s * (1 + growth), st.s * 1.02, 3650);
      st.d = meanReversion(st.d, g);
    }
    st.rel = 0;
  }
  st.reps = (st.reps || 0) + 1;
  st.last = now;
  var iv = nextInterval(st.s, S.retention);
  if (g === 1) iv = Math.min(iv, 0.0104);            // ~15 min
  if (st.rel) iv = 0.0056;                           // 8 min relearn step
  st.iv = iv;
  st.due = now + iv * DAY;
  return st;
}
function mature(it) { return (it.st.reps || 0) >= 3 && (it.st.s || 0) >= 7; }
function learning(it) { return (it.st.reps || 0) > 0 && !mature(it); }

/* ----------------------------- content index ---------------------------- */
var ITEMS = [];        // {id,type,de,en,lv,...}
var BY = {};           // id -> item
var IDX = {};          // type -> [items]
var LVIDX = { A1: [], A2: [], B1: [], B2: [] };
var SENT = [], GRAM = [], PASS = [];

function addItem(o) { ITEMS.push(o); BY[o.id] = o; (IDX[o.type] = IDX[o.type] || []).push(o); LVIDX[o.lv].push(o); return o; }

function buildIndex() {
  D.nouns.forEach(function (n) {
    addItem({ id: 'n:' + n[0], type: 'n', de: n[0], en: n[1], art: n[2], pl: n[3], lv: n[4] });
  });
  D.verbs.forEach(function (v) {
    addItem({ id: 'v:' + v[0], type: 'v', de: v[0], en: v[1], lv: v[2], sep: v[3], aux: v[4], pp: v[5], perf: v[6], pres: v[7] ? v[7].split('|') : [], prat: v[8] ? v[8].split('|') : [] });
  });
  ['adj', 'adv', 'conj', 'prep', 'pron', 'qw', 'num', 'intj'].forEach(function (k) {
    (D[k] || []).forEach(function (w) {
      addItem({ id: 'w:' + w[0] + '|' + k, type: k, de: w[0], en: w[1], lv: w[3], extra: w[4] || '' });
    });
  });
  D.phrases.forEach(function (p, i) {
    addItem({ id: 'p:' + i, type: 'p', de: p[0], en: p[1], lv: p[2], cat: p[3] });
  });
  D.sentences.forEach(function (s, i) {
    addItem({ id: 's:' + i, type: 's', de: s[0], en: s[1], lv: s[2], tag: s[3] });
  });
  D.grammar.forEach(function (g, i) {
    GRAM.push(g);
    (g.q || []).forEach(function (q, j) {
      addItem({ id: 'g:' + i + ':' + j, type: 'g', de: q[0], ans: q.slice(1), lv: g.lv, gi: i, prompt: q[0], rule: (g.r || []).join('\n'), title: g.t });
    });
  });
  (D.passages || []).forEach(function (p, i) {
    PASS.push(p);
    (p.q || []).forEach(function (q, j) {
      addItem({ id: 'r:' + i + ':' + j, type: 'r', de: p.t, en: q[0], lv: p.lv, pi: i, qi: j,
        title: p.t, pass: p.de, trans: p.en, vocab: p.v || [], opts: q.slice(1), ans: 0 });
    });
  });
  SENT = IDX.s || [];
}

/* --------------------------- item state access -------------------------- */
function st(id) {
  if (!S.items[id]) S.items[id] = { st: { s: 0, d: 5, due: 0, last: 0, reps: 0, lapses: 0, iv: 0 }, tut: 0, ok: 0, no: 0, t: 0 };
  return S.items[id];
}
function dueItems(now) {
  var out = [];
  for (var id in S.items) {
    var it = S.items[id];
    if (!it.st.due) continue;
    if (it.st.due <= now) out.push({ id: id, st: it });
  }
  return out;
}
function newItemIds(n, lvMax) {
  var order = ['A1', 'A2', 'B1', 'B2'], out = [];
  var lim = order.indexOf(lvMax || 'B2');
  for (var l = 0; l <= lim && out.length < n; l++) {
    var pool = LVIDX[order[l]].filter(function (it) { return it.type !== 'r' && (!S.items[it.id] || !S.items[it.id].st.due); });
    pool = shuffle(pool);
    for (var i = 0; i < pool.length && out.length < n; i++) out.push(pool[i].id);
  }
  return out;
}
/* mastery / progress */
function countBy(pred) { var n = 0; for (var id in S.items) if (pred(S.items[id], BY[id])) n++; return n; }
function stats() {
  var seen = 0, mat = 0, lvCount = { A1: 0, A2: 0, B1: 0, B2: 0 }, lvSeen = { A1: 0, A2: 0, B1: 0, B2: 0 };
  var tot = 0;
  for (var i = 0; i < ITEMS.length; i++) {
    var it = ITEMS[i], r = S.items[it.id];
    if (it.type === 'r') continue;
    tot++;
    var key = it.type === 'g' ? 'B1' : it.lv;
    lvCount[key] = (lvCount[key] || 0) + 1;
    if (r && r.st.reps > 0) { seen++; lvSeen[key] = (lvSeen[key] || 0) + 1; if (mature(r)) mat++; }
  }
  return { total: tot, seen: seen, mature: mat, lvCount: lvCount, lvSeen: lvSeen };
}
var COVER = { 500: 72, 1000: 80, 1500: 85, 2000: 88, 2500: 90, 3000: 92, 4000: 94 };
function coverage() {
  var s = stats().seen, keys = Object.keys(COVER).map(Number).sort(function (a, b) { return a - b; });
  var v = 45; for (var i = 0; i < keys.length; i++) if (s >= keys[i]) v = COVER[keys[i]];
  return Math.min(96, v + Math.max(0, (s - 4000) / 2000));
}

/* ------------------------------ XP & level ------------------------------ */
function xpForLevel(l) { return Math.round(60 * Math.pow(l, 1.42)); }
function levelInfo(xp) {
  var l = 1, need = xpForLevel(1), acc = 0;
  while (xp >= acc + need) { acc += need; l++; need = xpForLevel(l); }
  return { level: l, cur: xp - acc, need: need, pct: (xp - acc) / need };
}
function addXp(n, why) {
  var li = levelInfo(S.xp);
  S.xp += n; S.dayXp += n; S.tot.xpToday = S.dayXp;
  var nl = levelInfo(S.xp);
  if (nl.level > li.level) { S.level = nl.level; save(); setTimeout(function () { UI.levelUp(nl.level); }, 900); }
  if (why) floatXp('+' + n + ' ' + why);
  var k = dayKey(NOW());
  S.log[k] = S.log[k] || { xp: 0, min: 0, c: 0, w: 0 };
  S.log[k].xp += n;
  save();
  return n;
}
function floatXp(txt, x, y) {
  var e = el('div', 'floatxp', txt);
  e.style.left = (x != null ? x : (window.innerWidth / 2 - 40 + rnd(80))) + 'px';
  e.style.top = (y != null ? y : (window.innerHeight * 0.42)) + 'px';
  document.body.appendChild(e);
  setTimeout(function () { e.remove(); }, 1000);
}

/* ------------------------------- audio ---------------------------------- */
var AC = null, VOICE = null;
function ac() {
  if (AC) return AC;
  try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = null; }
  return AC;
}
function beep(freq, dur, type, vol, delay) {
  if (!S.sfx) return;
  var c = ac(); if (!c) return;
  try {
    var t0 = c.currentTime + (delay || 0);
    var o = c.createOscillator(), g = c.createGain();
    o.type = type || 'sine'; o.frequency.setValueAtTime(freq, t0);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol || 0.12, t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(c.destination); o.start(t0); o.stop(t0 + dur + 0.02);
  } catch (e) { }
}
var SFX = {
  ok: function () { beep(660, .09, 'sine', .11); beep(990, .12, 'sine', .09, .07); },
  no: function () { beep(190, .22, 'sawtooth', .09); },
  tick: function () { beep(1200, .03, 'square', .04); },
  chest: function () { [523, 659, 784, 1046].forEach(function (f, i) { beep(f, .18, 'triangle', .1, i * .09); }); },
  level: function () { [523, 659, 784, 1046, 1318].forEach(function (f, i) { beep(f, .26, 'sine', .1, i * .1); }); },
  boss: function () { beep(90, .5, 'sawtooth', .13); beep(60, .6, 'square', .1, .1); },
  hurt: function () { beep(300, .18, 'square', .1); beep(150, .22, 'square', .1, .1); },
  win: function () { [659, 784, 988, 1318, 1568].forEach(function (f, i) { beep(f, .3, 'triangle', .1, i * .12); }); }
};
var TTSQ = [];
function pickVoice() {
  if (VOICE) return VOICE;
  try {
    var vs = speechSynthesis.getVoices() || [];
    VOICE = vs.filter(function (v) { return /^de/i.test(v.lang); })[0] || null;
  } catch (e) { VOICE = null; }
  return VOICE;
}
function speak(text, rate, cb) {
  if (!S.tts || !window.speechSynthesis) { if (cb) cb(); return; }
  try {
    speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'de-DE'; u.rate = rate || S.rate || 0.95; u.pitch = 1;
    var v = pickVoice(); if (v) u.voice = v;
    if (cb) { u.onend = cb; u.onerror = cb; }
    speechSynthesis.speak(u);
  } catch (e) { if (cb) cb(); }
}

/* ----------------------------- distractors ------------------------------ */
function distract(item, n, field) {
  field = field || 'en';
  var pool = IDX[item.type] || ITEMS;
  var out = [], tries = 0, sameLv = [];
  var cand = pool.filter(function (x) {
    if (x.id === item.id) return false;
    if (!x[field]) return false;
    if (field === 'en' && norm(x.en) === norm(item.en)) return false;
    if (field === 'de' && norm(x.de) === norm(item.de)) return false;
    return true;
  });
  cand = shuffle(cand);
  cand.sort(function (a, b) { return (a.lv === item.lv ? -1 : 0) - (b.lv === item.lv ? -1 : 0); });
  for (var i = 0; i < cand.length && out.length < n && tries < 400; i++) {
    tries++;
    var v = cand[i][field];
    if (out.indexOf(v) < 0 && out.every(function (o) { return norm(o) !== norm(v); })) out.push(v);
  }
  while (out.length < n) out.push('—');
  return out;
}
function mcOpts(correct, wrongs) {
  var o = shuffle([correct].concat(wrongs).slice(0, 4));
  return { opts: shuffle(o), ans: o.indexOf(correct) };
}
function sentenceTokens(de) {
  return de.replace(/([,.!?:;"'])/g, ' $1 ').split(/\s+/).filter(Boolean);
}
function blankKeywords(de) {
  var w = sentenceTokens(de).filter(function (t) { return /[A-Za-zÄÖÜäöüß]/.test(t); });
  w.sort(function (a, b) { return b.length - a.length; });
  return w;
}

/* ====================== EXERCISE FACTORY ====================== */
/* Every generator returns:
   {kind, q, sub, opts, ans, say, hint, exp, type}                          */
function EX(o) { o.type = o.type || 'recall'; return o; }

function genNoun(it, r, mode) {
  var artCls = { der: 'art-der', die: 'art-die', das: 'art-das' }[it.art] || '';
  var word = '<span class="art ' + artCls + '">' + esc(it.art) + '</span> ' + esc(it.de);
  if (mode === 'article' || (mode == null && r.st.reps === 0)) {
    var arts = ['der', 'die', 'das'];
    return EX({
      kind: 'mc', type: 'n', q: esc(it.de), sub: 'Which article? · ' + esc(it.en),
      opts: shuffle(arts), ans: arts.indexOf(it.art),
      say: it.art + ' ' + it.de, hint: 'Gender of „' + it.de + '“ (' + it.en + ')',
      exp: '<b>' + it.art + ' ' + it.de + '</b>' + (it.pl ? ' · Plural: <b>die ' + it.pl + '</b>' : '') + ' = ' + esc(it.en)
    });
  }
  if (mode === 'plural' && it.pl) {
    return EX({
      kind: 'type', type: 'n', q: 'What is the plural?', sub: esc(it.art) + ' ' + esc(it.de) + ' → die ___',
      ans: [it.pl.replace(/^die /i, '')], say: it.pl,
      hint: 'Plural of ' + it.de, exp: 'der/die ' + it.de + ' → die <b>' + it.pl + '</b>'
    });
  }
  if (mode === 'type') {
    return EX({
      kind: 'type', type: 'n', q: 'How do you say this in German?', sub: esc(it.en),
      ans: [it.de, it.art + ' ' + it.de, it.art + ' ' + it.de + ', ' + (it.pl || '')],
      say: it.art + ' ' + it.de, hint: (S.hintMode ? it.art + ' … ' + it.de.slice(0, Math.max(2, Math.ceil(it.de.length / 2))) + '…' : 'Article: ' + it.art),
      exp: word + ' = ' + esc(it.en)
    });
  }
  if (mode === 'recall') {
    return EX({ kind: 'recall', type: 'n', q: esc(it.de), sub: it.art ? '[' + it.art + ']' : '', ans: it.en, say: it.art + ' ' + it.de, opts: null, exp: word + ' = <b>' + esc(it.en) + '</b>' });
  }
  var m = mcOpts(it.en, distract(it, 3));
  return EX({ kind: 'mc', type: 'n', q: esc(it.art) + ' ' + esc(it.de), sub: 'What does this mean?', opts: m.opts, ans: m.ans, say: it.art + ' ' + it.de, exp: word + ' = <b>' + esc(it.en) + '</b>' });
}

function genVerb(it, r, mode) {
  var P = it.pres, PR = it.prat;
  if (mode === 'conj' && P.length === 6) {
    var p = rnd(6), nom = ['ich', 'du', 'er/sie/es', 'wir', 'ihr', 'sie/Sie'][p];
    var wrongs = [];
    var others = (IDX.v || []).filter(function (v) { return v.pres && v.pres.length === 6 && v.id !== it.id; });
    for (var i = 0; i < 40 && wrongs.length < 3; i++) {
      var c = pick(others)[p];
      if (c && wrongs.indexOf(c) < 0 && norm(c) !== norm(P[p])) wrongs.push(c);
    }
    var m = mcOpts(P[p], wrongs);
    return EX({
      kind: 'mc', type: 'v', q: nom + ' ___', sub: 'Present tense of <b>' + esc(it.de) + '</b> · ' + esc(it.en),
      opts: m.opts, ans: m.ans, say: nom.split('/')[0] + ' ' + P[p],
      exp: '<b>' + nom + ' ' + P[p] + '</b> · ' + esc(it.de) + ' = ' + esc(it.en)
    });
  }
  if (mode === 'perf' && it.pp) {
    return EX({
      kind: 'type', type: 'v', q: 'Perfect tense (er/sie/es)?', sub: esc(it.de) + ' = ' + esc(it.en),
      ans: [it.perf, it.perf.replace(/^(hat|ist) /, '')], say: it.perf,
      hint: 'Auxiliary: ' + it.aux + ' …', exp: '<b>' + esc(it.perf) + '</b>'
    });
  }
  if (mode === 'prat' && PR.length === 6) {
    return EX({
      kind: 'type', type: 'v', q: 'Simple past (er)?', sub: esc(it.de) + ' = ' + esc(it.en),
      ans: [PR[2], PR[0]], say: PR[2], hint: 'Past tense of ' + it.de,
      exp: 'er <b>' + esc(PR[2]) + '</b>'
    });
  }
  if (mode === 'type') {
    return EX({
      kind: 'type', type: 'v', q: 'How do you say this in German?', sub: esc(it.en),
      ans: [it.de], say: it.de, hint: S.hintMode ? it.de.slice(0, 2) + '…' : (it.sep ? 'separable: ' + it.sep : ''),
      exp: '<b>' + esc(it.de) + '</b>' + (it.perf ? ' · Perfekt: ' + esc(it.perf) : '')
    });
  }
  if (mode === 'recall') return EX({ kind: 'recall', type: 'v', q: esc(it.de), sub: 'Verb', ans: it.en, say: it.de, exp: '<b>' + esc(it.de) + '</b> = ' + esc(it.en) });
  var m2 = mcOpts(it.en, distract(it, 3));
  return EX({ kind: 'mc', type: 'v', q: esc(it.de), sub: 'What does this mean?', opts: m2.opts, ans: m2.ans, say: it.de, exp: '<b>' + esc(it.de) + '</b> = ' + esc(it.en) });
}

function genWord(it, r, mode) {
  if (it.type === 'adj' && mode === 'comp' && it.extra && it.extra.indexOf('|') > 0) {
    var parts = it.extra.split('|');
    return EX({
      kind: 'type', type: 'adj', q: 'Comparative?', sub: esc(it.de) + ' = ' + esc(it.en),
      ans: [parts[0]], say: parts[0], hint: it.de + ' → …', exp: esc(it.de) + ' → <b>' + esc(parts[0]) + '</b> → am ' + esc(parts[1] || (parts[0] + 'sten'))
    });
  }
  if (it.type === 'prep' && mode === 'case') {
    var cases = { akk: 'Accusative', dat: 'Dative', akkdat: 'Accusative (motion) / Dative (place)', gen: 'Genitive' };
    var opts = ['Accusative', 'Dative', 'Genitive', 'Accusative or Dative'];
    var corr = it.extra === 'akkdat' ? 'Accusative or Dative' : (cases[it.extra] || 'Dative');
    return EX({
      kind: 'mc', type: 'prep', q: esc(it.de), sub: 'Which case? · ' + esc(it.en),
      opts: shuffle(opts), ans: opts.indexOf(corr), say: it.de,
      exp: '<b>' + esc(it.de) + '</b> + ' + esc(corr) + ' · ' + esc(it.en)
    });
  }
  if (mode === 'type') {
    return EX({
      kind: 'type', type: it.type, q: 'How do you say this in German?', sub: esc(it.en) + (it.type === 'prep' ? ' (+' + (it.extra || '') + ')' : ''),
      ans: [it.de], say: it.de, hint: S.hintMode ? it.de.slice(0, Math.max(1, Math.ceil(it.de.length / 3))) + '…' : '',
      exp: '<b>' + esc(it.de) + '</b> = ' + esc(it.en)
    });
  }
  if (mode === 'recall') return EX({ kind: 'recall', type: it.type, q: esc(it.de), sub: it.type, ans: it.en, say: it.de, exp: '<b>' + esc(it.de) + '</b> = ' + esc(it.en) });
  var m = mcOpts(it.en, distract(it, 3));
  return EX({ kind: 'mc', type: it.type, q: esc(it.de), sub: 'What does this mean?', opts: m.opts, ans: m.ans, say: it.de, exp: '<b>' + esc(it.de) + '</b> = ' + esc(it.en) });
}

function genPhrase(it, r, mode) {
  if (mode === 'type' && it.de.length < 42) {
    return EX({
      kind: 'type', type: 'p', q: 'Translate into German', sub: esc(it.en),
      ans: [it.de], say: it.de, hint: S.hintMode ? it.de.split(' ').slice(0, 2).join(' ') + ' …' : '',
      exp: '<b>' + esc(it.de) + '</b> = ' + esc(it.en)
    });
  }
  if (mode === 'listen') {
    var m = mcOpts(it.en, distract(it, 3));
    return EX({ kind: 'listen', type: 'p', q: '🔊 What did you hear?', sub: '', opts: m.opts, ans: m.ans, say: it.de, exp: '<b>' + esc(it.de) + '</b> = ' + esc(it.en) });
  }
  if (mode === 'recall') return EX({ kind: 'recall', type: 'p', q: esc(it.de), sub: 'Phrase', ans: it.en, say: it.de, exp: '<b>' + esc(it.de) + '</b> = ' + esc(it.en) });
  var m2 = mcOpts(it.en, distract(it, 3));
  return EX({ kind: 'mc', type: 'p', q: esc(it.de), sub: 'What does this mean?', opts: m2.opts, ans: m2.ans, say: it.de, exp: '<b>' + esc(it.de) + '</b> = ' + esc(it.en) });
}

function genSentence(it, r, mode) {
  var toks = sentenceTokens(it.de);
  if (mode === 'order' && toks.length >= 4 && toks.length <= 12) {
    return EX({
      kind: 'order', type: 's', q: 'Put the words in the correct order', sub: esc(it.en),
      opts: shuffle(toks), ans: toks, say: it.de,
      exp: '<b>' + esc(it.de) + '</b><br>' + esc(it.en)
    });
  }
  if (mode === 'fill') {
    var kw = blankKeywords(it.de);
    if (kw.length) {

function confetti(n) {
  n = n || 60;
  var c = document.getElementById('confetti'), ctx = c.getContext('2d');
  c.style.display = 'block';
  c.width = window.innerWidth; c.height = window.innerHeight;
  var P = [], cols = ['#ffc94a', '#4ad9ff', '#b07cff', '#5ee07a', '#ff6ad5', '#ff5d6c'];
  for (var i = 0; i < n; i++) P.push({ x: c.width / 2 + (Math.random() - .5) * 220, y: c.height * .42, vx: (Math.random() - .5) * 12, vy: -Math.random() * 13 - 3, s: 3 + Math.random() * 6, c: pick(cols), r: Math.random() * 6, vr: (Math.random() - .5) * .4, l: 1 });
  var t0 = performance.now();
  (function frame(t) {
    ctx.clearRect(0, 0, c.width, c.height);
    var alive = 0;
    P.forEach(function (p) {
      p.vy += .28; p.x += p.vx; p.y += p.vy; p.r += p.vr; p.l -= .008;
      if (p.l > 0 && p.y < c.height + 40) alive++;
      ctx.save(); ctx.globalAlpha = Math.max(0, p.l); ctx.translate(p.x, p.y); ctx.rotate(p.r);
      ctx.fillStyle = p.c; ctx.fillRect(-p.s / 2, -p.s / 2, p.s, p.s * 1.6); ctx.restore();
    });
    if (alive && t - t0 < 2600) requestAnimationFrame(frame);
    else { ctx.clearRect(0, 0, c.width, c.height); c.style.display = 'none'; }
  })(t0);
}

  document.getElementById('inNew2').oninput = function () { S.newPerDay = +this.value; document.getElementById('lblNew2').textContent = this.value; save(); };
  document.getElementById('inRet2').oninput = function () { S.retention = +this.value / 100; document.getElementById('lblRet2').textContent = this.value + '%'; save(); };
  document.getElementById('inRem').oninput = function () { S.remind = this.value; save(); };
  document.getElementById('btnNotif').onclick = function () {
    try {
      if (!window.Notification) return UI.toast('This browser does not support notifications');
      Notification.requestPermission().then(function (p) { UI.toast(p === 'granted' ? 'Notifications on 🔔' : 'Not allowed'); });
    } catch (e) { }
  };
  document.getElementById('btnExp').onclick = function () {
    var box = document.getElementById('ioBox'); box.classList.remove('hide');
    var t = document.getElementById('ioTxt'); t.value = JSON.stringify(S); t.select();
    try { document.execCommand('copy'); UI.toast('Copied to clipboard 📋'); } catch (e) { }
  };
  document.getElementById('btnImp').onclick = function () { document.getElementById('ioBox').classList.remove('hide'); };
  document.getElementById('btnDoImp').onclick = function () {
    try {
      var o = JSON.parse(document.getElementById('ioTxt').value);
      localStorage.setItem(KEY, JSON.stringify(o)); load(); buildIndex();
      UI.toast('Imported ✅'); UI.hub();
    } catch (e) { UI.toast('Invalid data ❌'); }
  };
  document.getElementById('btnReset').onclick = function () {
    UI.ov('<h3 style="margin:0 0 8px">Delete everything?</h3><p class="mut small" style="margin:0 0 14px">Progress, streak, gems — all gone.</p>' +
      '<button class="btn danger wide" id="rY">Yes, delete</button><button class="btn ghost wide sm" style="margin-top:8px" onclick="SQ.UI.closeOv()">Cancel</button>');
    document.getElementById('rY').onclick = function () { localStorage.removeItem(KEY); location.reload(); };
  };
};
function row2(icon, label, key) {
  return '<div class="between" style="padding:9px 0;border-bottom:1px solid var(--line)"><div><div style="font-weight:700;font-size:14px">' + icon + ' ' + label + '</div></div>' +
    '<div class="switch ' + (S[key] ? 'on' : '') + '" data-sw="' + key + '"><i></i></div></div>';
}
function bindSwitches() {
  Array.prototype.forEach.call(document.querySelectorAll('[data-sw]'), function (b) {
    b.onclick = function () { var k = b.getAttribute('data-sw'); S[k] = S[k] ? 0 : 1; b.classList.toggle('on', !!S[k]); save(); };
  });
}

function sci(t, d) { return '<div style="margin-bottom:12px"><div style="font-weight:800;font-size:14px">' + t + '</div><div class="small mut" style="line-height:1.55">' + d + '</div></div>'; }

/* ================================ BOOT =================================== */
function boot() {
  load();
  buildIndex();
  window.SQ = { UI: UI, S: function () { return S; }, start: startSession, save: saveNow };
  try { speechSynthesis.onvoiceschanged = function () { VOICE = null; pickVoice(); }; } catch (e) { }
  var probe = false;
  try { localStorage.setItem('__sq_probe', '1'); localStorage.removeItem('__sq_probe'); probe = true; } catch (e) { probe = false; }
  if (!probe) setTimeout(function () { UI.toast('⚠️ Storage blocked — progress lasts only for this session'); }, 1500);
  checkAch();
  if (!S.intro) UI.boot(); else UI.hub();
  // heart regen tick
  setInterval(regenHearts, 30000);
  // daily reminder (works while the tab is open; no server, no tracking)
  setInterval(function () {
    if (!S.remind) return;
    var d = new Date(), hh = String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
    var k = dayKey(NOW());
    if (hh === S.remind && S.remindDay !== k) {
      S.remindDay = k; save();
      var m = (S.log[k] || { min: 0 }).min;
      if (m >= S.goalMin) return;
      SFX.chest();
      UI.toast('⏰ German time · ' + Math.round(S.goalMin - m) + ' min to go');
      try { if (window.Notification && Notification.permission === 'granted') new Notification('SPRACHQUEST', { body: 'Time for your daily German.' }); } catch (e) { }
    }
  }, 30000);
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();
