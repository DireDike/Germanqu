<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0b0e17">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="description" content="SPRACHQUEST — German A1→B2 in 16 weeks. Offline, science-based, absurdly addictive.">
<title>SPRACHQUEST · German A1→B2</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚔️</text></svg>">
<style>
/* ===================== SPRACHQUEST design system ===================== */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#090c15; --bg2:#0f1424; --panel:#151c30; --panel2:#1b2340; --line:#27314f;
  --txt:#e9eeff; --dim:#93a0c4; --dim2:#6a7599;
  --gold:#ffc94a; --cyan:#4ad9ff; --lime:#5ee07a; --red:#ff5d6c; --purple:#b07cff; --pink:#ff6ad5;
  --r:16px; --sh:0 10px 30px rgba(0,0,0,.45);
  --f:'Segoe UI Variable','Segoe UI',system-ui,-apple-system,Roboto,Inter,'Helvetica Neue',Arial,sans-serif;
  --fm:'SF Mono',ui-monospace,'Cascadia Mono','Roboto Mono',Menlo,Consolas,monospace;
}
html,body{margin:0;padding:0;height:100%}
html{overflow-x:clip}
body{
  background:
    radial-gradient(1100px 700px at 15% -10%, #1a2450 0%, transparent 60%),
    radial-gradient(900px 600px at 110% 10%, #2a1440 0%, transparent 55%),
    radial-gradient(800px 800px at 50% 120%, #0d2a35 0%, transparent 60%),
    var(--bg);
  color:var(--txt); font-family:var(--f); font-size:16px; line-height:1.45;
  overflow-x:hidden; overscroll-behavior:none; overflow-wrap:break-word;
}
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.5;
  background-image:linear-gradient(rgba(255,255,255,.022) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.022) 1px,transparent 1px);
  background-size:44px 44px;
  mask-image:radial-gradient(circle at 50% 40%,#000 30%,transparent 85%);
}
#app{position:relative;z-index:1;max-width:720px;margin:0 auto;padding:0 14px 40px;min-height:100vh}
button{font-family:inherit;font-size:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select{font-family:inherit;font-size:inherit;color:inherit}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#26304d;border-radius:8px}
::-webkit-scrollbar-track{background:transparent}

/* ---------- generic ---------- */
.card{background:linear-gradient(180deg,var(--panel) 0%,var(--panel2) 100%);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.center{text-align:center}
.grow{flex:1;min-width:0}
.mut{color:var(--dim)}
.dim2{color:var(--dim2)}
.small{font-size:12.5px}
.tiny{font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--dim2);font-weight:700}
.de{font-family:var(--f)}
.wrap{white-space:normal;overflow-wrap:anywhere}
.hide{display:none!important}
.spacer{height:14px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;background:#1e2742;border:1px solid var(--line);font-size:11.5px;font-weight:700;color:var(--dim)}
.chip.g{background:rgba(94,224,122,.13);border-color:rgba(94,224,122,.35);color:#8ff0a4}
.chip.y{background:rgba(255,201,74,.13);border-color:rgba(255,201,74,.35);color:#ffd77a}
.chip.c{background:rgba(74,217,255,.13);border-color:rgba(74,217,255,.35);color:#8fe6ff}
.chip.p{background:rgba(176,124,255,.14);border-color:rgba(176,124,255,.35);color:#caa4ff}
.chip.r{background:rgba(255,93,108,.13);border-color:rgba(255,93,108,.35);color:#ff9aa4}

/* ---------- buttons ---------- */
.btn{
  display:flex;align-items:center;justify-content:center;gap:8px;
  padding:14px 20px;border-radius:14px;font-weight:800;letter-spacing:.01em;
  background:linear-gradient(180deg,#2b3557,#202a46);
  border:1px solid var(--line);transition:transform .08s,filter .15s,box-shadow .15s;
}
.btn:active{transform:translateY(2px) scale(.99)}
.btn.primary{background:linear-gradient(180deg,#ffd15c,#f5a623);color:#2a1a00;border-color:#ffd98a;box-shadow:0 6px 0 #b8791a,0 12px 26px rgba(245,166,35,.32)}
.btn.primary:active{box-shadow:0 3px 0 #b8791a,0 8px 18px rgba(245,166,35,.28)}
.btn.lime{background:linear-gradient(180deg,#6ff08a,#33c05a);color:#06300f;border-color:#8ff5a7;box-shadow:0 6px 0 #1f8a3f,0 12px 26px rgba(51,192,90,.3)}
.btn.lime:active{box-shadow:0 3px 0 #1f8a3f}
.btn.cyan{background:linear-gradient(180deg,#6ee3ff,#21a9d8);color:#012430;border-color:#9fefff;box-shadow:0 6px 0 #187fa5,0 12px 26px rgba(33,169,216,.3)}
.btn.cyan:active{box-shadow:0 3px 0 #187fa5}
.btn.purple{background:linear-gradient(180deg,#c69bff,#8a4ff0);color:#1b0733;border-color:#d9bcff;box-shadow:0 6px 0 #6a34c4,0 12px 26px rgba(138,79,240,.32)}
.btn.purple:active{box-shadow:0 3px 0 #6a34c4}
.btn.ghost{background:rgba(255,255,255,.04)}
.btn.danger{background:linear-gradient(180deg,#ff7a86,#e1304a);color:#fff;border-color:#ff9aa4}
.btn.sm{padding:9px 13px;font-size:13px;border-radius:11px}
.btn.wide{width:100%}
.btn.stack{flex-direction:column;gap:2px;line-height:1.25;text-align:center}
.btn[disabled]{opacity:.45;pointer-events:none;filter:grayscale(.5)}
.iconbtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:rgba(255,255,255,.05);border:1px solid var(--line);font-size:18px}
.iconbtn:active{transform:scale(.94)}

/* ---------- top bar ---------- */
#topbar{position:sticky;top:0;z-index:50;backdrop-filter:blur(14px);background:linear-gradient(180deg,rgba(9,12,21,.96),rgba(9,12,21,.75));border-bottom:1px solid rgba(39,49,79,.8);margin:0 -14px 14px;padding:10px 14px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;background:#161d31;border:1px solid var(--line);font-weight:800;font-size:13.5px}
.pill b{font-variant-numeric:tabular-nums}
.flame{filter:drop-shadow(0 0 6px rgba(255,120,40,.9))}
.xpbar{height:9px;border-radius:99px;background:#101728;border:1px solid var(--line);overflow:hidden}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,#ffd15c,#ff8a3d);box-shadow:0 0 12px rgba(255,180,60,.7);transition:width .5s cubic-bezier(.2,.8,.2,1)}
.hp{height:9px;border-radius:99px;background:#101728;border:1px solid var(--line);overflow:hidden}
.hp i{display:block;height:100%;background:linear-gradient(90deg,#ff5d6c,#ff2d55);transition:width .35s}
.hp.g i{background:linear-gradient(90deg,#6ff08a,#2fc85e)}

/* ---------- hub ---------- */
.hero{position:relative;overflow:hidden;padding:18px;border-radius:22px;border:1px solid var(--line);
  background:linear-gradient(135deg,#1a2450 0%,#2a1440 55%,#123043 100%);box-shadow:var(--sh)}
.hero:after{content:'';position:absolute;inset:0;background:radial-gradient(400px 200px at 80% -20%,rgba(255,201,74,.22),transparent 70%)}
.hero h1{margin:0;font-size:31px;letter-spacing:-.5px;line-height:1.05}
.hero h1 span{background:linear-gradient(92deg,#ffd15c,#ff8ad1 50%,#6ee3ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{margin:8px 0 0;color:#c3cdec;font-size:13.5px}
.cta{position:relative;z-index:2;margin-top:16px}
.unitgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:9px}
.unode{position:relative;padding:11px 10px;border-radius:14px;border:1px solid var(--line);background:#141b2e;text-align:left;transition:transform .12s}
.unode:active{transform:scale(.97)}
.unode.done{border-color:rgba(94,224,122,.5);background:linear-gradient(180deg,rgba(94,224,122,.14),#141b2e)}
.unode.cur{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold),0 0 24px rgba(255,201,74,.25)}
.unode.lock{opacity:.42}
.unode .n{font-size:10.5px;font-weight:800;color:var(--dim2);letter-spacing:.06em;overflow-wrap:anywhere}
.unode .t{font-weight:800;font-size:13px;margin-top:2px;line-height:1.2;overflow-wrap:anywhere;hyphens:auto}
.unode .b{font-size:10.5px;color:var(--dim);margin-top:3px;overflow-wrap:anywhere}
.unode .p{height:5px;border-radius:99px;background:#0d1322;margin-top:7px;overflow:hidden}
.unode .p i{display:block;height:100%;background:linear-gradient(90deg,#ffd15c,#ff8a3d)}
.unode.boss{background:linear-gradient(180deg,rgba(255,93,108,.16),#141b2e);border-color:rgba(255,93,108,.45)}
.qcard{display:flex;align-items:center;gap:11px;padding:12px;border-radius:14px;border:1px solid var(--line);background:#141b2e}
.qcard+.qcard{margin-top:9px}
.qbar{height:7px;border-radius:99px;background:#0d1322;overflow:hidden;margin-top:6px}
.qbar i{display:block;height:100%;background:linear-gradient(90deg,#6ee3ff,#4a8cff)}
.lgrid{display:flex;flex-direction:column;gap:5px}
.lrow{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:11px;background:#141b2e;border:1px solid var(--line);font-size:13px}
.lrow.me{background:linear-gradient(90deg,rgba(255,201,74,.16),#141b2e);border-color:rgba(255,201,74,.5);font-weight:800}
.lrow .r{width:20px;text-align:center;color:var(--dim);font-weight:800;font-size:12px}
.lrow .av{width:24px;height:24px;border-radius:8px;display:grid;place-items:center;background:#223055;font-size:14px}
.lrow .xp{font-variant-numeric:tabular-nums}
.lrow.up{border-color:rgba(94,224,122,.4)}
.lrow.down{border-color:rgba(255,93,108,.4)}
.statgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
.stat{padding:12px;border-radius:14px;background:#141b2e;border:1px solid var(--line)}
.stat b{display:block;font-size:22px;font-variant-numeric:tabular-nums;letter-spacing:-.5px}
.stat span{font-size:11px;color:var(--dim2);text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.heat{display:grid;grid-template-columns:repeat(15,1fr);gap:3px}
.heat i{aspect-ratio:1;border-radius:3px;background:#141b2e;border:1px solid rgba(255,255,255,.03)}
.heat i.l1{background:#1e4d33}.heat i.l2{background:#2a7a4c}.heat i.l3{background:#3fae64}.heat i.l4{background:#6ff08a}
.heat i.t{outline:1.5px solid var(--gold)}

/* ---------- session ---------- */
#sessTop{position:sticky;top:0;z-index:40;background:linear-gradient(180deg,rgba(9,12,21,.97),rgba(9,12,21,.8));backdrop-filter:blur(10px);margin:0 -14px;padding:10px 14px 8px}
.sbar{height:10px;border-radius:99px;background:#101728;border:1px solid var(--line);overflow:hidden}
.sbar i{display:block;height:100%;background:linear-gradient(90deg,#6ff08a,#33c05a);transition:width .35s cubic-bezier(.2,.8,.2,1)}
.qwrap{padding:6px 0 0}
.qhead{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.qprompt{font-size:22px;font-weight:800;line-height:1.3;margin:0 0 4px}
.qsub{color:var(--dim);font-size:14px;margin:0 0 14px}
.bigword{font-size:36px;font-weight:900;letter-spacing:-.8px;line-height:1.15;margin:14px 0 6px}
.bigword .art{font-weight:800}
.art-der{color:#6ec7ff}.art-die{color:#ff7ea8}.art-das{color:#7ef0b0}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px 15px;margin-bottom:10px;border-radius:14px;border:2px solid var(--line);background:#141b2e;transition:transform .08s,border-color .12s,background .12s;font-size:16px;font-weight:600;line-height:1.3}
.opt:active{transform:translateY(2px)}
.opt .k{width:26px;height:26px;flex:none;border-radius:8px;background:#243055;display:grid;place-items:center;font-size:12px;font-weight:900;color:var(--dim)}
.opt.sel{border-color:var(--cyan);background:rgba(74,217,255,.12)}
.opt.ok{border-color:var(--lime);background:rgba(94,224,122,.16)}
.opt.no{border-color:var(--red);background:rgba(255,93,108,.16)}
.opt.dim{opacity:.55}
.opt.dis{pointer-events:none}
.tin{width:100%;padding:15px;border-radius:14px;border:2px solid var(--line);background:#0f1526;color:var(--txt);font-size:19px;font-weight:700;outline:none}
.tin:focus{border-color:var(--cyan);box-shadow:0 0 0 4px rgba(74,217,255,.13)}
.keys{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.keys button{padding:7px 11px;border-radius:10px;background:#1b2340;border:1px solid var(--line);font-weight:700}
/* ---------- reading passages ---------- */
.passage{margin:0 0 14px;padding:13px 14px;border-radius:14px;border:1px solid var(--line);background:#101728;box-shadow:inset 0 1px 0 rgba(255,255,255,.03)}
.passage .ptitle{font-size:17px;font-weight:800;color:var(--gold);margin-bottom:7px;line-height:1.25}
.passage .ptext{font-size:16px;line-height:1.65;color:#dfe6ff;max-height:38vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
.passage .ptext::-webkit-scrollbar{width:5px}
.passage .ptext::-webkit-scrollbar-thumb{background:var(--line);border-radius:9px}
.passage .gloss{display:flex;flex-direction:column;gap:5px;margin-top:9px;padding-top:9px;border-top:1px solid var(--line)}
.passage .vrow{display:flex;align-items:baseline;gap:9px;font-size:13.5px}
.passage .vrow b{color:var(--cyan);font-weight:800;min-width:34%}
.passage .vrow span{color:var(--dim)}
.passage .ptrans{margin-top:9px;padding-top:9px;border-top:1px solid var(--line);font-size:14px;line-height:1.6;color:var(--dim);max-height:38vh;overflow-y:auto}
.passage + .qhead{margin-top:14px}
.tokens{display:flex;flex-wrap:wrap;gap:7px;min-height:52px;padding:10px;border-radius:14px;border:2px dashed var(--line);background:#0f1526}
.tok{padding:8px 12px;border-radius:10px;background:linear-gradient(180deg,#2b3557,#202a46);border:1px solid var(--line);font-weight:700;cursor:pointer}
.tok.used{opacity:.28;pointer-events:none}
.tokrow{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.bank{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
.gbtn{width:100%;text-align:left;padding:13px 15px;border-radius:14px;border:2px solid var(--line);background:#141b2e;font-weight:700}
.grade{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.grade button{padding:11px 4px;border-radius:12px;border:2px solid var(--line);background:#141b2e;font-weight:800;font-size:13px}
.grade button b{display:block;font-size:15px}
.grade button small{color:var(--dim2);font-size:10.5px;font-weight:700}
.grade button:nth-child(1){border-color:rgba(255,93,108,.5);color:#ff9aa4}
.grade button:nth-child(2){border-color:rgba(255,201,74,.45);color:#ffd77a}
.grade button:nth-child(3){border-color:rgba(94,224,122,.5);color:#8ff0a4}
.grade button:nth-child(4){border-color:rgba(74,217,255,.5);color:#8fe6ff}
#fb{position:fixed;left:0;right:0;bottom:0;z-index:60;padding:14px 14px calc(14px + env(safe-area-inset-bottom));transform:translateY(120%);transition:transform .28s cubic-bezier(.2,.9,.2,1)}
#fb.show{transform:translateY(0)}
.fbin{max-width:720px;margin:0 auto;border-radius:18px;padding:15px 16px;border:2px solid;display:flex;flex-wrap:wrap;align-items:flex-start;gap:12px}
.fbin>.btn{flex:1 1 100%;max-width:100%;margin-top:2px}
.fbin.ok{background:linear-gradient(180deg,rgba(94,224,122,.2),rgba(20,27,46,.97));border-color:var(--lime)}
.fbin.no{background:linear-gradient(180deg,rgba(255,93,108,.2),rgba(20,27,46,.97));border-color:var(--red)}
.fbin .ico{font-size:26px;line-height:1;flex:none}
.fbin b{display:block;font-size:17px;margin-bottom:2px}
.fbin .msg{font-size:13.5px;color:#cdd6f0}
.fbin .msg em{color:#fff;font-style:normal;font-weight:800}
.combo{position:fixed;top:64px;right:14px;z-index:45;font-weight:900;font-size:15px;padding:7px 12px;border-radius:999px;background:linear-gradient(90deg,#ff8a3d,#ffd15c);color:#2a1a00;box-shadow:0 6px 20px rgba(255,150,40,.45);transform:scale(.6);opacity:0;transition:.2s}
.combo.show{transform:scale(1);opacity:1}
.pop{animation:pop .32s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{0%{transform:scale(.86)}60%{transform:scale(1.03)}100%{transform:scale(1)}}
.shake{animation:shk .32s}
@keyframes shk{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(4px)}}
.floatxp{position:fixed;z-index:70;pointer-events:none;font-weight:900;font-size:20px;color:var(--gold);text-shadow:0 2px 12px rgba(0,0,0,.6);animation:fxp 1s forwards}
@keyframes fxp{0%{opacity:0;transform:translateY(0) scale(.7)}20%{opacity:1;transform:translateY(-10px) scale(1.15)}100%{opacity:0;transform:translateY(-70px) scale(1)}}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:80}

/* ---------- overlays ---------- */
.ov{position:fixed;inset:0;z-index:90;display:flex;align-items:center;justify-content:center;padding:18px;background:rgba(4,6,12,.78);backdrop-filter:blur(6px);opacity:0;pointer-events:none;transition:opacity .2s}
.ov.show{opacity:1;pointer-events:auto}
.ovbox{width:100%;max-width:420px;border-radius:22px;border:1px solid var(--line);background:linear-gradient(180deg,#1a2340,#121a2e);padding:22px;box-shadow:0 24px 60px rgba(0,0,0,.6);transform:scale(.9) translateY(10px);transition:transform .28s cubic-bezier(.2,1.2,.3,1)}
.ov.show .ovbox{transform:scale(1) translateY(0)}
.chest{font-size:76px;line-height:1;display:block;margin:6px auto 10px;animation:bob 1.4s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-10px) rotate(2deg)}}
.chest.open{animation:chestOpen .6s ease-out}
@keyframes chestOpen{0%{transform:scale(1)}35%{transform:scale(1.25) rotate(-6deg)}70%{transform:scale(.92)}100%{transform:scale(1)}}
.reward{display:flex;align-items:center;gap:10px;padding:11px 13px;border-radius:14px;background:rgba(255,255,255,.05);border:1px solid var(--line);margin-top:8px;font-weight:800;animation:pop .4s backwards}
.tabs{display:flex;gap:6px;padding:5px;border-radius:14px;background:#101728;border:1px solid var(--line);margin-bottom:12px;overflow-x:auto}
.tabs button{flex:1;padding:9px 10px;border-radius:10px;font-weight:800;font-size:13px;color:var(--dim);white-space:nowrap}
.tabs button.on{background:linear-gradient(180deg,#2b3557,#202a46);color:#fff;box-shadow:0 2px 10px rgba(0,0,0,.3)}
.tabpane{display:none}.tabpane.on{display:block}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:11px;padding:11px 13px;border-radius:14px;background:#141b2e;border:1px solid var(--line)}
.item .sw{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:#223055;font-size:17px;flex:none}
.item .nm{font-weight:800;font-size:14px}
.item .ds{font-size:12px;color:var(--dim);margin-top:1px}
.item .pr{flex:none;font-weight:900;color:var(--gold)}
.skill{position:relative;padding:12px;border-radius:14px;border:1px solid var(--line);background:#141b2e;text-align:center}
.skill.on{border-color:rgba(176,124,255,.6);background:linear-gradient(180deg,rgba(176,124,255,.16),#141b2e)}
.skill .e{font-size:24px}
.skill .n{font-weight:800;font-size:12.5px;margin-top:3px;line-height:1.2}
.skill .d{font-size:11px;color:var(--dim);margin-top:2px}
.skill .c{font-size:11px;font-weight:900;color:var(--purple);margin-top:5px}
.ach{display:flex;gap:11px;align-items:center;padding:11px;border-radius:14px;border:1px solid var(--line);background:#141b2e}
.ach.got{border-color:rgba(255,201,74,.45);background:linear-gradient(180deg,rgba(255,201,74,.12),#141b2e)}
.ach .e{font-size:24px;filter:grayscale(1);opacity:.5}
.ach.got .e{filter:none;opacity:1}
.bosswrap{display:flex;align-items:center;gap:14px;padding:16px;border-radius:18px;border:1px solid rgba(255,93,108,.45);background:linear-gradient(135deg,rgba(255,93,108,.18),#141b2e)}
.bosswrap .bav{font-size:46px;animation:bob 2s ease-in-out infinite}
.bosswrap.atk{animation:shk .35s}
input[type=range]{width:100%;accent-color:#ffc94a}
.switch{width:46px;height:26px;border-radius:99px;background:#26304d;position:relative;transition:.2s;flex:none}
.switch i{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
.switch.on{background:var(--lime)}
.switch.on i{left:23px}
input[type=text],input[type=number],select,textarea{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:#0f1526;color:var(--txt);outline:none}
textarea{resize:vertical;min-height:90px;font-family:var(--fm);font-size:12px}
table{width:100%;border-collapse:collapse;font-size:13px}

th{color:var(--dim2);font-size:11px;text-transform:uppercase;letter-spacing:.05em}
.gcard{padding:14px;border-radius:16px;border:1px solid var(--line);background:#141b2e}
.gcard h3{margin:0 0 6px;font-size:16px}
.gcard .rule{font-size:13.5px;color:#c9d3f0;white-space:pre-wrap;line-height:1.5}
.gcard .ex{margin-top:8px;padding-left:10px;border-left:3px solid var(--purple);font-size:13.5px}
.gcard .ex i{display:block;color:var(--dim);font-size:12.5px}
.toast{position:fixed;left:50%;bottom:96px;transform:translate(-50%,20px);z-index:95;background:#1c2540;border:1px solid var(--line);padding:11px 16px;border-radius:14px;font-weight:800;font-size:14px;opacity:0;transition:.25s;pointer-events:none;box-shadow:var(--sh)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.banner{padding:12px 14px;border-radius:14px;border:1px solid rgba(74,217,255,.4);background:linear-gradient(90deg,rgba(74,217,255,.14),rgba(20,27,46,.6));font-size:13px;color:#c9e9ff}

Regens sind wir spazieren gegangen.","Despite the rain we went for a walk.","B1","genitive"],["Wegen eines Unfalls war die Straße gesperrt.","Because of an accident the road was closed.","B1","genitive"],["Ich erinnere mich gern an meine Kindheit.","I like to remember my childhood.","B1","prepverb"],["Er interessiert sich sehr für Politik.","He's very interested in politics.","B1","prepverb"],["Wir freuen uns auf das Wochenende.","We're looking forward to the weekend.","B1","prepverb"],["Sie beschäftigt sich mit Geschichte.","She occupies herself with history.","B1","prepverb"],["Ich bedanke mich für die Einladung.","Thank you for the invitation.","B1","prepverb"],["Hast du Angst vor der Prüfung?","Are you afraid of the exam?","B1","prepverb"],["Der Schlüssel liegt auf dem Tisch.","The key is on the table.","A2","wechsel"],["Ich lege den Schlüssel auf den Tisch.","I put the key on the table.","A2","wechsel"],["Das Bild hängt über dem Sofa.","The picture hangs above the sofa.","A2","wechsel"],["Wir gehen in den Park.","We're going into the park.","A2","wechsel"],["Die Kinder spielen im Garten.","The children are playing in the garden.","A2","wechsel"],["Ich stelle die Flasche in den Kühlschrank.","I put the bottle into the fridge.","A2","wechsel"],["Wir bleiben zu Hause, weil es regnet.","We're staying at home because it's raining.","A2","weil"],["Ich lerne Deutsch, weil ich in Wien studieren möchte.","I'm learning German because I want to study in Vienna.","A2","weil"],["Er sagt, dass er morgen kommt.","He says that he's coming tomorrow.","A2","dass"],["Ich glaube nicht, dass das stimmt.","I don't believe that's true.","A2","dass"],["Wir gehen ins Kino, wenn du Lust hast.","We'll go to the cinema if you feel like it.","A2","wenn"],["Wenn ich Geld hätte, würde ich eine Weltreise machen.","If I had money I would travel the world.","B1","konj2"],["Ich würde gern ein Eis essen.","I would like to eat an ice cream.","B1","konj2"],["Könnten Sie mir bitte sagen, wo der Bahnhof ist?","Could you tell me where the station is?","B1","konj2"],["An deiner Stelle würde ich mehr schlafen.","If I were you I'd sleep more.","B1","konj2"],["Er tut so, als ob er nichts wüsste.","He acts as if he knew nothing.","B2","konj2"],["Das Buch, das auf dem Tisch liegt, gehört mir.","The book that is lying on the table is mine.","B1","relativ"],["Der Mann, den ich gestern getroffen habe, ist Arzt.","The man I met yesterday is a doctor.","B1","relativ"],["Die Frau, mit der ich arbeite, spricht fünf Sprachen.","The woman I work with speaks five languages.","B1","relativ"],["Das ist der Grund, warum ich nicht gekommen bin.","That's the reason why I didn't come.","B1","relativ"],["Mein Freund, dessen Schwester in Köln wohnt, kommt mit.","My friend, whose sister lives in Cologne, is coming along.","B2","relativ"],["Die Stadt, in der ich geboren bin, ist sehr alt.","The city in which I was born is very old.","B1","relativ"],["Das Haus wird gerade renoviert.","The house is being renovated right now.","B1","passiv"],["Die E-Mail wurde gestern Abend geschrieben.","The email was written yesterday evening.","B1","passiv"],["Der Vertrag muss bis Freitag unterschrieben werden.","The contract has to be signed by Friday.","B1","passiv"],["Ihm wurde gekündigt.","He was given notice.","B2","passiv"],["Es wird erwartet, dass die Preise steigen.","Prices are expected to rise.","B2","passiv"],["Das Problem lässt sich leicht lösen.","The problem can be solved easily.","B2","passiv"],["Ich habe vergessen, das Licht auszumachen.","I forgot to turn off the light.","B1","infinitive"],["Es ist wichtig, jeden Tag zu üben.","It's important to practise every day.","B1","infinitive"],["Er hat keine Lust, mit uns zu kommen.","He doesn't feel like coming with us.","B1","infinitive"],["Sie spart Geld, um ein Auto zu kaufen.","She's saving money to buy a car.","B1","umzu"],["Er ging, ohne ein Wort zu sagen.","He left without saying a word.","B1","umzu"],["Statt zu arbeiten, sieht er fern.","Instead of working he watches TV.","B1","umzu"],["Ich helfe dir, damit du schneller fertig wirst.","I'm helping you so that you finish faster.","B1","umzu"],["Nachdem er gegessen hatte, ging er spazieren.","After he had eaten he went for a walk.","B2","plusquam"],["Bevor sie kam, hatten wir schon angefangen.","Before she came we had already started.","B2","plusquam"],["Ich hatte das Buch schon gelesen, als der Film herauskam.","I had already read the book when the film came out.","B2","plusquam"],["Als ich klein war, wohnte ich auf dem Land.","When I was little I lived in the countryside.","B1","preteritum"],["Früher ging er jeden Tag schwimmen.","He used to go swimming every day.","B1","preteritum"],["Im Sommer fuhren wir immer ans Meer.","In summer we always drove to the sea.","B1","preteritum"],["Es war einmal ein König, der in einem Schloss wohnte.","Once upon a time there was a king who lived in a castle.","B1","preteritum"],["Obwohl es regnete, gingen wir spazieren.","Although it was raining we went for a walk.","B1","konzessiv"],["Trotz der Kälte sind wir rausgegangen.","Despite the cold we went outside.","B1","konzessiv"],["Er ist zwar jung, aber sehr erfahren.","He's admittedly young but very experienced.","B1","konzessiv"],["Zwar hat er wenig Geld, dennoch ist er zufrieden.","He has little money, yet he is content.","B2","konzessiv"],["Sowohl Deutsch als auch Englisch wird hier gesprochen.","Both German and English are spoken here.","B1","connectors"],["Weder er noch seine Frau konnten kommen.","Neither he nor his wife could come.","B1","connectors"],["Nicht nur das Wetter war schlecht, sondern auch das Hotel.","Not only the weather was bad, but also the hotel.","B1","connectors"],["Je mehr ich übe, desto besser spreche ich.","The more I practise, the better I speak.","B2","connectors"],["Einerseits ist die Arbeit interessant, andererseits ist sie stressig.","On the one hand the work is interesting, on the other it's stressful.","B1","connectors"],["Ich fahre morgen wegen des Wetters mit dem Zug nach Berlin.","Tomorrow I'm travelling to Berlin by train because of the weather.","B2","tekamolo"],["Sie hat gestern den Bericht sorgfältig im Büro geschrieben.","She carefully wrote the report in the office yesterday.","B2","tekamolo"],["Der Minister erklärte, die Lage sei stabil.","The minister stated that the situation was stable.","B2","konj1"],["Sie behauptet, sie habe das Geld nicht genommen.","She claims she didn't take the money.","B2","konj1"],["Man sagt, er lebe inzwischen in Südamerika.","They say he now lives in South America.","B2","konj1"],["Die im Garten spielenden Kinder sind meine Nichten.","The children playing in the garden are my nieces.","B2","partizip"],["Das gestern gekaufte Auto ist schon kaputt.","The car bought yesterday is already broken.","B2","partizip"],["Die sich ständig ändernden Preise sind ein Problem.","The constantly changing prices are a problem.","B2","partizip"],["In Anbetracht der angespannten Lage empfiehlt sich Vorsicht.","In view of the tense situation caution is advisable.","B2","nominal"],["Die Durchführung der Maßnahme wurde einstimmig beschlossen.","The implementation of the measure was decided unanimously.","B2","nominal"],["Unter der Voraussetzung, dass alle zustimmen, können wir beginnen.","Provided that everyone agrees, we can start.","B2","connectors"],["Es bleibt abzuwarten, ob die Reform Erfolg hat.","It remains to be seen whether the reform succeeds.","B2","nominal"],["Dafür spricht, dass die Kosten sinken.","The argument in favour is that costs are falling.","B2","nominal"],["Dagegen spricht, dass die Qualität leidet.","The argument against is that quality suffers.","B2","nominal"],["Dieser Umstand ist nicht zu vernachlässigen.","This fact must not be neglected.","B2","nominal"],["Er muss den Termin verpasst haben.","He must have missed the appointment.","B2","modal"],["Sie dürfte inzwischen zu Hause sein.","She is likely to be home by now.","B2","modal"],["Das soll ein sehr gutes Restaurant sein.","That is said to be a very good restaurant.","B2","modal"],["Er will den Bericht selbst geschrieben haben.","He claims to have written the report himself.","B2","modal"],["Worauf wartest du noch?","What are you still waiting for?","B1","dakomp"],["Ich erinnere mich nicht daran.","I don't remember that.","B1","dakomp"],["Er hat sich ausdrücklich dafür bedankt.","He explicitly thanked for that.","B2","dakomp"],["Damit kann ich nichts anfangen.","I can't do anything with that.","B2","dakomp"],["Die Entscheidung, die gestern getroffen wurde, war richtig.","The decision that was made yesterday was right.","B1","relativ"],["Es ist nicht das Geld, das mich motiviert.","It isn't money that motivates me.","B2","emphasis"],["Nur mit viel Übung kann man eine Sprache lernen.","Only with a lot of practice can you learn a language.","B2","emphasis"],["Es gibt viele Gründe, Deutsch zu lernen.","There are many reasons to learn German.","B1","es"],["Es zieht, mach bitte das Fenster zu.","There's a draught, please close the window.","B2","es"],["Ich bin der Ansicht, dass mehr investiert werden sollte.","I'm of the opinion that more should be invested.","B2","opinion"],["Zusammenfassend lässt sich sagen, dass sich das Verfahren bewährt hat.","In summary it can be said that the procedure has proven itself.","B2","opinion"],["Es ist davon auszugehen, dass die Nachfrage steigt.","It can be assumed that demand will rise.","B2","opinion"],["Davon hat er keine Ahnung.","He has no idea about that.","B1","idiom"],["Ich drücke dir die Daumen.","I'm keeping my fingers crossed for you.","B1","idiom"],["Das ist mir völlig egal.","I don't care at all.","A2","idiom"],["Übung macht den Meister.","Practice makes perfect.","A2","idiom"],["Lass uns das später besprechen.","Let's discuss that later.","A2","social"],["Hast du Lust, heute Abend essen zu gehen?","Do you fancy going out to eat tonight?","A2","social"],["Ich melde mich morgen bei dir.","I'll get in touch with you tomorrow.","A2","social"],["Vielen Dank für Ihre Hilfe.","Many thanks for your help.","A1","polite"],["Entschuldigen Sie die Verspätung.","Please excuse the delay.","A2","polite"],["Darf ich Sie kurz stören?","May I disturb you briefly?","B1","polite"],["Könnten Sie das bitte wiederholen?","Could you please repeat that?","A1","survival"],["Ich möchte das Zimmer für zwei Nächte reservieren.","I'd like to book the room for two nights.","A2","travel"],["Haben Sie noch ein Zimmer frei?","Do you still have a room available?","A2","travel"],["Der Zug nach Köln fährt von Gleis vier ab.","The train to Cologne departs from platform four.","A2","travel"],["Ich hätte gern eine Fahrkarte nach München, hin und zurück.","I'd like a ticket to Munich, return.","A2","travel"],["Wo muss ich hier umsteigen?","Where do I have to change here?","A2","travel"],["Mein Gepäck ist leider nicht angekommen.","Unfortunately my luggage didn't arrive.","B1","travel"],["Ich möchte diesen Artikel umtauschen.","I'd like to exchange this item.","A2","shopping"],["Kann ich mit Karte zahlen?","Can I pay by card?","A1","shopping"],["Haben Sie das in einer größeren Größe?","Do you have that in a larger size?","A2","shopping"],["Das ist mir zu teuer.","That's too expensive for me.","A1","shopping"],["Ich habe eine Reklamation.","I have a complaint.","B1","shopping"],["Mir ist schlecht, ich muss mich hinlegen.","I feel sick, I have to lie down.","A2","health"],["Ich habe seit drei Tagen Halsschmerzen.","I've had a sore throat for three days.","A2","health"],["Der Arzt hat mir ein Medikament verschrieben.","The doctor prescribed me a medicine.","B1","health"],["Ich bin gegen Penicillin allergisch.","I'm allergic to penicillin.","B1","health"],["Soll ich einen Krankenwagen rufen?","Shall I call an ambulance?","B1","health"],["Ich möchte ein Konto eröffnen.","I'd like to open an account.","A2","bank"],["Wie hoch sind die Gebühren?","How high are the fees?","B1","bank"],["Ich habe eine Überweisung getätigt.","I made a transfer.","B1","bank"],["Können Sie mir einen Kredit anbieten?","Can you offer me a loan?","B1","bank"],["Die Zinsen sind in diesem Jahr gestiegen.","Interest rates have risen this year.","B2","bank"],["Ich bewerbe mich um die Stelle als Projektleiter.","I'm applying for the position of project manager.","B1","work"],["Haben Sie Erfahrung in diesem Bereich?","Do you have experience in this field?","B1","work"],["Wir freuen uns, Ihnen mitteilen zu können, dass ...","We are pleased to inform you that ...","B2","work"],["Das Gehalt wird monatlich überwiesen.","The salary is transferred monthly.","B2","work"],["Ich kündige zum nächstmöglichen Zeitpunkt.","I give notice with effect from the earliest possible date.","B2","work"],["Die Besprechung wurde auf nächste Woche verschoben.","The meeting was postponed to next week.","B1","work"],["Könnten Sie mir das Protokoll zuschicken?","Could you send me the minutes?","B2","work"],["Wir müssen die Kosten so gering wie möglich halten.","We have to keep costs as low as possible.","B2","work"],["Die Firma verzeichnete im letzten Jahr ein deutliches Wachstum.","The company recorded clear growth last year.","B2","work"],["Der Umsatz ist im Vergleich zum Vorjahr um acht Prozent gestiegen.","Turnover rose by eight percent compared with the previous year.","B2","work"],["Aufgrund der schwierigen Marktlage wurden Stellen abgebaut.","Due to the difficult market situation jobs were cut.","B2","work"],["Die Verhandlungen zwischen den Parteien sind gescheitert.","The negotiations between the parties failed.","B2","news"],["Der Verdächtige wurde noch in der Nacht festgenommen.","The suspect was arrested during the night.","B2","news"],["Laut Polizei gab es keine Verletzten.","According to the police there were no injuries.","B2","news"],["Die Regierung hat neue Maßnahmen zum Klimaschutz beschlossen.","The government decided on new climate protection measures.","B2","news"],["Kritiker bezweifeln, dass die Ziele erreicht werden können.","Critics doubt that the targets can be met.","B2","news"],["Experten warnen vor den Folgen des demografischen Wandels.","Experts warn of the consequences of demographic change.","B2","news"],["Die Zahl der Arbeitslosen ist leicht zurückgegangen.","The number of unemployed has fallen slightly.","B2","news"],["Es ist unklar, wann die Baumaßnahmen abgeschlossen werden.","It is unclear when the construction work will be completed.","B2","news"],["Der Anteil der erneuerbaren Energien ist weiter gestiegen.","The share of renewable energies has continued to rise.","B2","news"],["Viele Bürger fühlen sich von der Politik nicht ernst genommen.","Many citizens don't feel taken seriously by politics.","B2","news"],["Man sollte nicht alles glauben, was in der Zeitung steht.","One shouldn't believe everything that's in the newspaper.","B1","opinion"],["Meiner Meinung nach ist das die falsche Entscheidung.","In my opinion that's the wrong decision.","A2","opinion"],["Ich bin mir sicher, dass wir das schaffen.","I'm sure that we'll manage it.","A2","opinion"],["Es kommt darauf an, wie man es betrachtet.","It depends on how you look at it.","B1","opinion"],["Das kann man so nicht sagen.","You can't say it like that.","B1","opinion"],["Ich bin anderer Auffassung.","I take a different view.","B2","opinion"],["Wenn ich das richtig verstehe, bist du dagegen.","If I understand correctly, you're against it.","B1","opinion"],["Was mich betrifft, ist das akzeptabel.","As far as I'm concerned, that's acceptable.","B2","opinion"],["Im Großen und Ganzen bin ich einverstanden.","By and large I agree.","B2","opinion"],["Alles in allem war die Reise ein voller Erfolg.","All in all the trip was a great success.","B2","summary"]],"grammar":[{"lv":"A1","t":"Präsens: regular verbs","r":["Take the infinitive, drop **-en** → stem (^lernen → lern^). Add: ich **-e**, du **-st**, er/sie/es **-t**, wir **-en**, ihr **-t**, sie/Sie **-en**.","If the stem ends in **-t/-d** or consonant+**-m/-n**, insert an extra **-e-** (^warten → du wart**e**st, finden → du find**e**st, atmen → er atm**e**t^).","Stems ending in **-s/-ß/-z/-x** drop the -s of the du ending: ^heißen → du heißt, tanzen → du tanzt^."],"ex":[["Ich lerne jeden Tag Deutsch.","I learn German every day."],["Wir wohnen seit zwei Jahren hier.","We have lived here for two years."]],"q":[["Ich ___ (lernen) Deutsch.","lerne"],["Er ___ (wohnen) in Berlin.","wohnt"],["Du ___ (heißen) Maria.","heißt"],["Wir ___ (machen) eine Pause.","machen"],["Ihr ___ (kommen) aus Österreich.","kommt"]]},{"lv":"A1","t":"Präsens: sein, haben and the modals","r":["^sein^ and ^haben^ are the two most irregular verbs. The modals (^können, müssen, wollen, sollen, dürfen, mögen^) change their vowel in the singular and **drop the umlaut** — but ^ich^ and the whole plural use the **infinitive form**.","ich bin / habe / kann · du bist / hast / kannst · er ist / hat / kann · wir sind / haben / können · ihr seid / habt / könnt · sie sind / haben / können"],"ex":[["Ich bin müde.","I am tired."],["Er hat keine Zeit.","He has no time."],["Wir können gut schwimmen.","We can swim well."]],"q":[["Ich ___ (sein) Student.","bin"],["Du ___ (haben) recht.","hast"],["Er ___ (können) nicht kommen.","kann"],["Wir ___ (müssen) jetzt gehen.","müssen"],["Sie ___ (wollen) ein Eis.","will"]]},{"lv":"A1","t":"Präsens: strong verbs (vowel change)","r":["Strong verbs change their stem vowel in **du** and **er/sie/es**: ^e → i^ (geben → du gibst, er gibt), ^e → ie^ (lesen → du liest, er liest), ^a → ä^ (fahren → du fährst, er fährt), ^au → äu^ (laufen → du läufst).","Every other form is regular."],"ex":[["Er fährt jeden Tag mit dem Bus.","He takes the bus every day."],["Sie liest gern Krimis.","She likes reading detective stories."]],"q":[["Er ___ (fahren) nach München.","fährt"],["Du ___ (lesen) ein Buch.","liest"],["Er ___ (geben) mir das Buch.","gibt"],["Sie ___ (laufen) jeden Morgen.","läuft"],["Er ___ (essen) zu viel.","isst"]]},{"lv":"A1","t":"Gender & the definite articles","r":["Every German noun has a gender: **der** (masculine), **die** (feminine), **das** (neuter). Plural is always **die**.","Learn every noun **with** its article — never the word alone. Say ^der Hund, die Katze, das Haus^.","Useful endings: **-ung, -heit, -keit, -tion, -schaft, -ei, -in** → feminine. **-chen, -lein, -um, -ment** → neuter. **-er, -ismus, -ling** → often masculine."],"ex":[["Der Hund schläft.","The dog is sleeping."],["Die Wohnung ist teuer.","The flat is expensive."],["Das Buch ist interessant.","The book is interesting."]],"q":[["___ Hund bellt. (masc)","Der"],["___ Wohnung ist groß. (fem)","Die"],["___ Haus ist alt. (neut)","Das"]]},{"lv":"A1","t":"Indefinite articles & negation","r":["^ein, eine, ein^ (a/an) → **kein, keine, kein** (no/not any) for negation of nouns.","Use **nicht** to negate verbs, adjectives, or anything that is not a noun: ^Ich komme nicht.^","^kein^ stands before the noun and takes its ending; ^nicht^ usually stands before the part it negates, or at the end of the clause."],"ex":[["Ich habe keine Zeit.","I have no time."],["Ich verstehe das nicht.","I don't understand that."],["Das ist nicht teuer.","That isn't expensive."]],"q":[["Ich habe ___ Geld. (kein)","kein"],["Er kommt heute ___. (nicht)","nicht"],["Das ist ___ mein Auto. (kein)","kein"]]},{"lv":"A1","t":"Questions: W-questions and yes/no questions","r":["A **W-question** puts the question word first: **wer, was, wo, woher, wohin, wann, warum, wie, wie viel, welcher**.","A **yes/no question** puts the conjugated verb first: ^Kommst du? — Ja, ich komme. / Nein, ich komme nicht.^","The answer ^doch^ contradicts a negative question: ^Kommst du nicht? — Doch!^"],"ex":[["Woher kommst du?","Where do you come from?"],["Kommst du mit?","Are you coming along?"]],"q":[["___ kommst du? (place)","Woher"],["___ geht es dir? (how)","Wie"],["___ Uhr ist es? (what)","Wie viel"]]},{"lv":"A1","t":"Word order rule 1: the verb is always in position 2","r":["In a German **main clause** the conjugated verb stands in **second position**. Whatever you put first (subject, time, place) pushes the subject behind the verb:","^Ich **kaufe** heute Brot. → Heute **kaufe** ich Brot.^ (inversion!)","The subject then stands **directly after** or **directly before** the verb."],"ex":[["Heute kaufe ich Brot.","Today I'm buying bread."],["Um acht Uhr frühstücke ich.","I have breakfast at eight."]],"q":[["Heute ___ ich Brot. (kaufen)","kaufe"],["Morgen ___ wir nach Berlin. (fahren)","fahren"]]},{"lv":"A1","t":"Word order rule 2: verb at the end","r":["If a clause is introduced by a subordinator or if a verb is in the infinitive/participle, the verb goes to the **end of the clause**.","^..., weil ich Deutsch **lerne**. / Ich will Deutsch **lernen**. / Ich habe Deutsch **gelernt**.^","This is the #1 mistake English speakers make. Burn it in."],"ex":[["..., weil ich Deutsch lerne.","... because I'm learning German."],["Ich will Deutsch lernen.","I want to learn German."]],"q":[["Ich möchte Pizza ___ (essen).","essen"],["..., weil ich müde ___ (sein).","bin"]]},{"lv":"A1","t":"Separable verbs (trennbare Verben)","r":["Many verbs have a prefix that **splits off** in the present and past, and goes to the **end of the sentence**: ^aufstehen → ich stehe um 7 Uhr **auf**^.","The prefix is **stressed** when spoken. In the infinitive and participle, ge- goes **inside**: ^auf**ge**standen^.","Common: aufstehen, anfangen, einkaufen, anrufen, mitkommen, zurückkommen, aufhören, einladen, abfahren."],"ex":[["Ich stehe jeden Tag um sieben auf.","I get up at seven every day."],["Der Film fängt um acht an.","The film starts at eight."]],"q":[["Ich ___ um sieben ___ (aufstehen).","stehe","auf"],["Wir ___ morgen ___ (einkaufen).","kaufen","ein"]]},{"lv":"A1","t":"Perfekt: how to talk about the past","r":["Spoken German uses the **Perfekt**: conjugated ^haben/sein^ in position 2 + **Partizip II at the end**.","Source: ^ge^ + stem + ^t^ (machen → gemacht, lernen → gelernt). Verbs with inseparable prefixes (be-, ver-, er-, ent-, ge-, zer-) and verbs in **-ieren** get **no ge-**: ^besucht, erklärt, studiert^.","Use **sein** for movement and change of state: ^gehen, kommen, fahren, fliegen, laufen, aufstehen, sterben, werden, sein, bleiben, passieren^."],"ex":[["Ich habe gestern einen Film gesehen.","I watched a film yesterday."],["Er ist nach Hause gegangen.","He went home."]],"q":[["Ich ___ gestern Pizza ___ (essen).","habe","gegessen"],["Sie ___ nach Berlin ___ (fahren).","ist","gefahren"],["Wir ___ viel ___ (lernen).","haben","gelernt"]]},{"lv":"A1","t":"Imperative (commands)","r":["**du**: stem of the verb, often without -en (-e optional) → ^Komm! / Komme! / Warte!^ — for vowel-changing verbs: ^Gib! / Lies! / Fahr!^ (no umlaut: ^Lauf!^)","**ihr**: stem + **-t** → ^Kommt! / Wartet!^","**Sie**: infinitive + **Sie** → ^Kommen Sie bitte!^","Always add ^bitte^ to stay polite."],"ex":[["Komm bitte mit!","Please come along!"],["Nehmen Sie bitte Platz!","Please take a seat!"]],"q":[["___ (kommen, du) bitte!","Komm"],["___ (warten, ihr) hier!","Wartet"],["___ (sprechen, Sie) langsamer!","Sprechen"]]},{"lv":"A2","t":"Nominative and accusative","r":["The **nominative** is the subject (^wer?^), the **accusative** the direct object (^wen?^).","Only the **masculine** changes: ^der/ein → den/einen^. Feminine, neuter and plural stay identical."],"ex":[["Der Mann liest einen Roman.","The man is reading a novel."],["Ich habe einen Hund.","I have a dog."]],"q":[["Ich sehe ___ Mann. (der)","den"],["Er kauft ___ Auto. (ein)","ein"]]},{"lv":"A2","t":"Accusative prepositions","r":["Always **accusative**: **für, gegen, ohne, um, durch, bis, entlang, je**.","Mnemonic: **DOGF BUDGE** (durch, ohne, gegen, für, bis, um, durch, gegen, entgegen?) — simplest: ^**F**ür **G**egen **O**hne **U**m **D**urch **B**is^ = \"FGOUDB\"."],"ex":[["Das ist für dich.","That's for you."],["Wir gehen durch den Park.","We're walking through the park."]],"q":[["Ich kaufe ein Geschenk ___ meine Mutter. (für)","für"],["Wir fahren ___ den Tunnel. (durch)","durch"]]},{"lv":"A2","t":"Dative: prepositions and objects","r":["**Dative** (^wem?^) prepositions: **aus, bei, mit, nach, seit, von, zu, ab, außer, gegenüber, nahe**.","Mnemonic: **^BAM SAV ZN^** — or sing: ^**A**us **A**ußer **B**ei **M**it **N**ach **S**eit **V**on **Z**u^.","Articles: ^der/das → dem, die → der, die (pl) → den^ (+n on nouns in plural: ^mit den Kindern^)."],"ex":[["Ich fahre mit dem Bus.","I'm going by bus."],["Er kommt aus der Schweiz.","He comes from Switzerland."]],"q":[["Ich spreche ___ meiner Freundin. (mit)","mit"],["Wir fahren ___ dem Zug. (mit)","mit"],["Er wohnt ___ seinem Bruder. (bei)","bei"]]},{"lv":"A2","t":"Two-way prepositions (Wechselpräpositionen)","r":["^an, auf, hinter, in, neben, über, unter, vor, zwischen^ take:","**Accusative** = direction (**wohin?** \"into/onto\") — ^Ich gehe in **den** Park.^","**Dative** = location (**wo?** \"in/on\") — ^Ich bin in **dem** Park.^","Mnemonic: **Accusative = Action**."],"ex":[["Ich stelle die Tasse auf den Tisch.","I put the cup on the table. (direction)"],["Die Tasse steht auf dem Tisch.","The cup is on the table. (location)"]],"q":[["Ich gehe in ___ Park. (direction)","den"],["Ich bin in ___ Park. (location)","dem"],["Wir fahren an ___ See. (direction)","den"]]},{"lv":"A2","t":"Possessive articles (mein, dein, sein ...)","r":["mein, dein, sein, ihr, unser, euer, ihr, Ihr.","They take the **same endings as ^ein^** (i.e. **no ending** in nom. masc. and nom./acc. neuter singular; otherwise the ^der^-word endings)."],"ex":[["Das ist mein Bruder.","That is my brother."],["Ich besuche meine Großmutter.","I'm visiting my grandmother."]],"q":[["Ich liebe ___ Frau. (mein, fem acc)","meine"],["Das ist ___ Haus. (mein, neut nom)","mein"]]},{"lv":"A2","t":"weil / denn / dass — the three connectors","r":["**weil** = because → verb to the **end**: ^..., weil ich müde **bin**.^","**denn** = for → **position 0**, word order unchanged: ^Ich bleibe zu Hause, **denn** ich bin müde.^","**dass** = that → verb to the end: ^Ich glaube, dass er **kommt**.^"],"ex":[["Ich lerne Deutsch, weil ich in Berlin arbeiten will.","I'm learning German because I want to work in Berlin."],["Er sagt, dass er keine Zeit hat.","He says that he has no time."]],"q":[["Ich bleibe zu Hause, ___ (weil) ich krank bin.","weil"],["Ich weiß, ___ (dass) er kommt.","dass"],["Ich gehe nicht, ___ (denn) ich habe keine Zeit.","denn"]]},{"lv":"A2","t":"Präteritum of sein, haben and the modals","r":["In writing and storytelling German uses the **Präteritum**, but in speech only for ^sein, haben^ and the modals:","ich war / hatte / konnte · du warst / hattest / konntest · er war / hatte / konnte · wir waren / hatten / konnten"],"ex":[["Gestern war ich in Berlin.","Yesterday I was in Berlin."],["Ich hatte keine Zeit.","I had no time."]],"q":[["Gestern ___ ich im Kino. (sein)","war"],["Früher ___ er nicht schwimmen. (können)","konnte"]]},{"lv":"A2","t":"Reflexive verbs","r":["Reflexive verbs need a reflexive pronoun: **mich, dich, sich, uns, euch, sich, sich**.","Accusative reflexive (most verbs): ^Ich wasche **mich**.^ Dative reflexive if there is already an accusative object: ^Ich wasche **mir** die Hände.^","Many are used with ^sich^ in the infinitive: ^sich freuen, sich erinnern an, sich interessieren für, sich beeilen, sich ausruhen^."],"ex":[["Ich freue mich auf das Wochenende.","I'm looking forward to the weekend."],["Beeil dich!","Hurry up!"]],"q":[["Ich freue ___ auf den Urlaub.","mich"],["Er erinnert ___ an den Film.","sich"]]},{"lv":"A2","t":"Adjective endings 1: after the definite article","r":["After ^der/die/das/...^ the adjective takes only **-e** or **-en**:","nom: der gut**e** Wein · die gut**e** Suppe · das gut**e** Buch · die gut**en** Bücher","all other cases: **-en**."],"ex":[["Der kleine Hund spielt.","The small dog is playing."],["Ich kenne den neuen Lehrer.","I know the new teacher."]],"q":[["Der ___ (klein) Hund.","kleine"],["Ich sehe die ___ (schön) Frau.","schöne"]]},{"lv":"A2","t":"Comparison: Komparativ & Superlativ","r":["**Komparativ** = adjective + **-er** (^schnell → schneller^); **Superlativ** = **am -sten** (^am schnellsten^) or with the adjective ending: ^der/die/das -ste^.","Umlaut often appears: ^groß → größer → am größten, alt → älter, jung → jünger, warm → wärmer^.","Irregular: ^gut → besser → am besten · viel → mehr → am meisten · gern → lieber → am liebsten · hoch → höher^."],"ex":[["Mein Auto ist schneller als deins.","My car is faster than yours."],["Er läuft am schnellsten.","He runs fastest."]],"q":[["Berlin ist ___ als Hamburg. (groß)","größer"],["Das ist ___ Buch, das ich kenne. (gut)","das beste"]]},{"lv":"A2","t":"Verbs with fixed prepositions","r":["Many German verbs demand a specific preposition + case. Learn verb + preposition + case as **one chunk**:","^warten auf (+Akk) · sich freuen auf/über (+Akk) · sich interessieren für (+Akk) · denken an (+Akk) · sich erinnern an (+Akk) · träumen von (+Dat) · sprechen über (+Akk) · sich beschäftigen mit (+Dat) · helfen bei (+Dat) · danken für (+Akk) · gehören zu (+Dat) · bitten um (+Akk)^"],"ex":[["Ich warte auf den Bus.","I'm waiting for the bus."],["Er interessiert sich für Kunst.","He's interested in art."]],"q":[["Ich warte ___ den Bus.","auf"],["Sie träumt ___ einem Haus am Meer.","von"]]},{"lv":"B1","t":"Adjective endings 2: the full system","r":["Three patterns, depending on the word **before** the adjective:","**1. der-words** (der, dieser, jeder, mancher …): nom.sg + acc.sg.neut/fem = **-e**, everything else **-en**.","**2. ein-words** (ein, kein, mein, dein …): nom.sg.masc + nom./acc.sg.neut = **-er/-es** (like the article), everything else **-en**.","**3. no article** (or after viel/wenig/etwas): the adjective takes the **definite-article ending itself**: ^-er, -e, -es, -e, -e, -er, -en, -e^ → ^guter Wein, frische Milch, kaltes Wasser, gute Freunde^.","Genitive always **-en** (after an article word)."],"ex":[["Ich trinke kalten Wein? (no) → Ich trinke kalten Kaffee nicht.","I don't drink cold coffee."],["Mit freundlichen Grüßen","With kind regards."]],"q":[["Ich habe ___ (kein, gut) Idee.","keine gute"],["Er ist ein ___ (gut) Freund.","guter"],["___ (frisch) Brot schmeckt gut.","Frisches"]]},{"lv":"B1","t":"Genitive","r":["The genitive expresses possession (^wessen?^): masculine/neuter add **-s/-es** to the noun, the article becomes ^des/ees^ → ^des Mannes, des Hauses, der Frau^.","It is also used after genitive prepositions: ^wegen, trotz, während, statt, innerhalb, außerhalb, aufgrund, infolge, dank^.","In spoken German ^von + Dativ^ often replaces it."],"ex":[["Das ist das Auto meines Bruders.","That's my brother's car."],["Wegen des Regens bleiben wir zu Hause.","Because of the rain we're staying at home."]],"q":[["Das ist das Buch ___ Frau. (die)","der"],["Trotz ___ Wetters gehen wir spazieren. (das)","des"]]},{"lv":"B1","t":"Relative clauses","r":["A relative clause describes a noun: ^Das ist der Mann, **der** dort steht.^","Pronoun = gender/number of the noun, **case = its function inside the relative clause**. The conjugated verb goes to the **end**.","^der/die/das/die · den/die/das/die · dem/der/dem/denen · dessen/deren/dessen/deren^"],"ex":[["Das Buch, das ich lese, ist spannend.","The book I'm reading is exciting."],["Die Frau, mit der ich spreche, ist meine Chefin.","The woman I'm talking to is my boss."]],"q":[["Das ist der Mann, ___ ich kenne. (acc)","den"],["Die Stadt, in ___ ich wohne, ist groß. (dat)","der"]]},{"lv":"B1","t":"Passive (Vorgangspassiv)","r":["Form: **werden** (in the required tense) + **Partizip II**, and the **accusative object becomes the subject**.","^Präsens: Das Haus **wird gebaut**. · Präteritum: Das Haus **wurde gebaut**. · Perfekt: Das Haus **ist gebaut worden**.^","With modals: ^Das Haus **muss gebaut werden**.^","For the agent use ^von^ (person) or ^durch^ (means)."],"ex":[["Der Brief wird heute geschrieben.","The letter is being written today."],["Das Auto wurde repariert.","The car was repaired."]],"q":[["Das Haus ___ (werden) gebaut.","wird"],["Der Brief ___ (werden) gestern geschrieben.","wurde"]]},{"lv":"B1","t":"Konjunktiv II (polite & hypothetical)","r":["**würde + infinitive** for most verbs: ^Ich würde gern kommen.^","For ^sein, haben, werden, können, müssen, mögen, sollen, wissen^ use the **real** form: ^wäre, hätte, würde, könnte, müsste, möchte, sollte, wüsste^.","Use it for wishes, politeness and unreal conditions: ^Wenn ich Zeit hätte, käme ich.^"],"ex":[["Ich hätte gern einen Kaffee.","I would like a coffee."],["Könnten Sie mir helfen?","Could you help me?"]],"q":[["Ich ___ (haben) gern einen Tee.","hätte"],["Wenn ich reich ___, reiste ich um die Welt. (sein)","wäre"]]},{"lv":"B1","t":"Conditional sentences (Wenn ... dann)","r":["Real condition: ^Wenn es regnet, bleibe ich zu Hause.^ (indicative)","Unreal (present): ^Wenn es regnen **würde**, **bliebe** ich zu Hause.^ (Konjunktiv II)","Unreal (past): ^Wenn ich das **gewusst hätte**, **wäre** ich nicht gekommen.^ (Konjunktiv II, Plusquamperfekt)","Wenn-clauses can also start with the verb: ^Hätte ich das gewusst, ...^"],"ex":[["Wenn ich mehr Zeit hätte, lernte ich Spanisch.","If I had more time I'd learn Spanish."],["Wenn du früher gekommen wärst, hättest du sie getroffen.","If you'd come earlier you'd have met her."]],"q":[["Wenn ich Zeit ___, käme ich mit. (haben)","hätte"],["Wenn er das gewusst ___, wäre er nicht gekommen. (haben)","hätte"]]},{"lv":"B1","t":"Infinitiv mit \"zu\"","r":["After verbs, nouns and adjectives: ^Ich **versuche** zu schlafen. / Ich **habe Zeit** zu schlafen. / Es **ist schwer** zu schlafen.^","^zu^ stands **before** the infinitive, **inside** the separable prefix: ^aufzuhören, einzukaufen^.","No ^zu^ after **modal verbs**, ^lassen, sehen, hören, gehen, kommen, bleiben, helfen, lernen^."],"ex":[["Ich habe vergessen, die Tür zu schließen.","I forgot to close the door."],["Es ist wichtig, jeden Tag zu üben.","It's important to practise every day."]],"q":[["Ich versuche, früh ___ (aufstehen).","aufzustehen"],["Er hat keine Lust ___ (arbeiten).","zu arbeiten"]]},{"lv":"B1","t":"um...zu / ohne...zu / statt...zu","r":["Infinitive clauses with the **same subject** as the main clause:","^um ... zu^ = in order to (purpose) · ^ohne ... zu^ = without -ing · ^statt ... zu^ = instead of -ing","If the subjects **differ**, use ^damit^ (so that) instead: ^Ich lerne fleißig, **damit** mich der Lehrer lobt.^"],"ex":[["Er lernt Deutsch, um in Berlin zu arbeiten.","He's learning German to work in Berlin."],["Sie ging, ohne ein Wort zu sagen.","She left without saying a word."]],"q":[["Er spart, ___ sich ein Auto zu kaufen.","um"],["Sie ging, ___ sich zu verabschieden.","ohne"]]},{"lv":"B1","t":"da-compounds and wo-compounds","r":["For **things** (not people) prepositions merge with ^da-^ / ^wo-^:","^dafür, damit, darüber, davon, dabei, danach, davor, dadurch, dazu, worauf, womit, wofür, worüber, woran^","^Ich **warte darauf**. (Ich warte auf das Geschenk.) — Was? — **Worauf** wartest du?^"],"ex":[["Ich interessiere mich dafür.","I'm interested in that."],["Wofür interessierst du dich?","What are you interested in?"]],"q":[["Ich freue mich ___ (auf das Geschenk).","darauf"],["___ sprichst du? (über das Problem)","Worüber"]]},{"lv":"B1","t":"Double conjunctions","r":["These pairs frame two equal elements:","^zwar ... aber^ (admittedly ... but) · ^nicht nur ... sondern auch^ · ^sowohl ... als auch^ · ^weder ... noch^ · ^entweder ... oder^ · ^je ... desto^ · ^einerseits ... andererseits^","Only the first part (before the noun) determines the **verb position in the main clause**."],"ex":[["Er ist zwar jung, aber sehr erfahren.","He is admittedly young but very experienced."],["Ich spreche sowohl Deutsch als auch Englisch.","I speak both German and English."]],"q":[["Er spricht ___ Deutsch, ___ auch Englisch. (both/and)","sowohl","als"],["___ früher du kommst, ___ besser. (the/the)","Je","desto"]]},{"lv":"B1","t":"Word order of adverbs: TEKAMOLO","r":["Time — Cause — Manner — Place. (^Ich fahre **morgen** [T] **wegen des Wetters** [K] **mit dem Zug** [M] **nach Berlin** [L].^)","The order can shift for **emphasis**, but TEKAMOLO is the safe default.","Pronouns always come before nouns; **new information goes last**."],"ex":[["Ich fahre morgen mit dem Zug nach Berlin.","Tomorrow I'm going to Berlin by train."]],"q":[["Er kommt heute (T) mit dem Bus (M) zur Arbeit (L).","heute mit dem Bus zur Arbeit"]]},{"lv":"B1","t":"Word order of \"nicht\"","r":["^nicht^ stands **before** whatever it negates — and at the **end** if it negates the whole clause or the verb:","^Ich **arbeite** nicht. (whole clause) · Ich komme **nicht heute** (not today, but tomorrow) · **Nicht ich** komme (not me)^","^nicht^ never stands after the Partizip II or the infinitive at the end."],"ex":[["Ich gehe heute nicht ins Kino.","I'm not going to the cinema today."]],"q":[["Ich komme ___ heute, sondern morgen.","nicht"]]},{"lv":"B1","t":"lassen","r":["^lassen^ = to let / to have something done:","^Ich lasse das Auto reparieren.^ (I have the car repaired) · ^Lass mich in Ruhe!^ · ^Das lässt sich nicht ändern.^ (that can't be changed)"],"ex":[["Ich lasse meine Haare schneiden.","I'm having my hair cut."]],"q":[["Ich ___ das Auto reparieren. (lassen)","lasse"]]},{"lv":"B1","t":"Futur I and probability","r":["Futur I = **werden** (position 2) + infinitive at the end: ^Ich werde morgen lernen.^","Germans mostly use the **present** for the future: ^Ich lerne morgen.^ Use Futur I mainly for **predictions** and **assumptions**: ^Er wird wohl krank sein.^ (He's probably ill.)","Futur II = **werden** + Partizip II + ^haben/sein^: ^Er wird angekommen sein.^ (He will have arrived.) — for assumptions about the past."],"ex":[["Es wird morgen regnen.","It will rain tomorrow."],["Er wird das nicht verstanden haben.","He won't have understood that."]],"q":[["Ich ___ morgen Deutsch lernen. (werden)","werde"]]},{"lv":"B2","t":"Konjunktiv I (indirect speech)","r":["Reported speech uses **Konjunktiv I**: take the present stem, add ^-e, -est, -e, -en, -et, -en^.","^Er sagt, er **habe** keine Zeit. / Sie behauptet, sie **sei** unschuldig.^","If Konjunktiv I is identical to the indicative (mostly in the plural), use **Konjunktiv II** instead: ^Sie sagen, sie **hätten** keine Zeit.^"],"ex":[["Der Minister erklärte, die Lage sei stabil.","The minister explained that the situation was stable."]],"q":[["Er sagt, er ___ keine Zeit. (haben)","habe"],["Sie behaupten, sie ___ nichts gewusst. (haben)","hätten"]]},{"lv":"B2","t":"Plusquamperfekt","r":["Past perfect = Präteritum of ^haben/sein^ + Partizip II. It marks something that happened **before** another past event.","^Nachdem er **gegessen hatte**, ging er spazieren.^","Common with ^nachdem^ (after), ^bevor^ (before), ^als^ (when)."],"ex":[["Er hatte das Buch schon gelesen, bevor der Film kam.","He had already read the book before the film came out."]],"q":[["Nachdem er ___ ___ (aufstehen), frühstückte er.","aufgestanden war"]]},{"lv":"B2","t":"Partizip I and II as adjectives","r":["**Partizip I** = infinitive + ^d^ → active/ongoing: ^die **schlafende** Katze^ (the sleeping cat), ^ein **interessanter** Film^","**Partizip II** = passive/completed: ^das **gekaufte** Auto^, ^der **geschlossene** Laden^","They take normal adjective endings and can be extended (^die im Garten spielenden Kinder^)."],"ex":[["Der im Büro arbeitende Mann ist mein Chef.","The man working in the office is my boss."]],"q":[["die ___ (spielen) Kinder","spielenden"],["das ___ (kaufen) Auto","gekaufte"]]},{"lv":"B2","t":"Nominalisation (Nominalstil)","r":["Turn verbs/nouns into nouns — typical of formal German:","^ankommen → die Ankunft · sich entwickeln → die Entwicklung · entscheiden → die Entscheidung · verbessern → die Verbesserung^","Typical suffixes: ^-ung, -heit, -keit, -tion, -schaft, -ismus, -tät^ (all **feminine** except -ismus).","Prefer nominal style in reports, avoid it in conversation."],"ex":[["Die Durchführung der Maßnahme wurde beschlossen.","The implementation of the measure was decided."]],"q":[["die ___ (entscheiden)","Entscheidung"],["die ___ (ankommen)","Ankunft"]]},{"lv":"B2","t":"Passive alternatives","r":["Avoid clumsy passives:","**sein + -bar/-lich** = can be: ^Das ist vermeidbar.^ (It can be avoided.)","**sich lassen + Infinitiv** = can be done: ^Das lässt sich leicht erklären.^","**man** as an active replacement: ^Man sollte mehr lesen.^","**Passiv mit Modalverb**: ^Das muss sofort erledigt werden.^"],"ex":[["Das Problem lässt sich nicht lösen.","The problem cannot be solved."]],"q":[["Das ___ sich leicht machen. (lassen)","lässt"],["Diese Regel ist nicht ___. (vermeiden)","vermeidbar"]]},{"lv":"B2","t":"Modal verbs: subjective meaning","r":["Modals comment on the **truth** of a statement:","^muss^ = strong assumption (must be) · ^kann^ = possibility · ^dürfte^ = likely · ^mag^ = possible · ^soll^ = hearsay (is said to) · ^will^ = claims to","Always with **infinitive at the end**, often in Futur/Konjunktiv II for distance: ^Er dürfte Recht haben.^"],"ex":[["Er muss sehr reich sein.","He must be very rich."],["Sie soll in Berlin leben.","She is said to live in Berlin."]],"q":[["Er ___ krank sein. (strong assumption, müssen)","muss"],["Sie ___ sehr erfahren sein. (hearsay, sollen)","soll"]]},{"lv":"B2","t":"Connectors: cause, concession, consequence, purpose","r":["**Kausal**: weil, da, denn, deshalb, daher, darum, aus diesem Grund, aufgrund (+Gen), infolge (+Gen)","**Konzessiv**: obwohl, obgleich, zwar ... aber, trotzdem, dennoch, trotz (+Gen), ungeachtet (+Gen)","**Konsekutiv**: sodass, folglich, infolgedessen, demnach, mithin, also","**Final**: damit, um ... zu, zu (+Dativ, Zweck)","**Konditional**: wenn, falls, sofern, unter der Bedingung, dass; andernfalls, sonst","**Modal**: indem, dadurch, dass, ohne dass, als ob"],"ex":[["Obwohl es regnet, gehen wir spazieren.","Although it's raining we're going for a walk."],["Er spart, damit er ein Haus kaufen kann.","He saves so that he can buy a house."]],"q":[["___ es regnet, gehen wir raus. (obwohl)","Obwohl"],["Er lernt fleißig, ___ er die Prüfung besteht. (damit)","damit"]]},{"lv":"B2","t":"The five-field model (Feldermodell)","r":["Every German clause has: **Vorfeld** — **linke Satzklammer** (conjugated verb) — **Mittelfeld** — **rechte Satzklammer** (infinitive / Partizip II / prefix / verb) — **Nachfeld** (comparisons, long additions).","^Ich [VF] **habe** [LSK] gestern einen interessanten Film [MF] **gesehen** [RSK], den du auch kennen solltest [NF].^","Only **one** element stands in the Vorfeld. Everything after the right bracket is the Nachfeld."],"ex":[["Gestern habe ich den Bericht fertig geschrieben.","Yesterday I finished writing the report."]],"q":[["Identify the left bracket: [Gestern habe ich den Bericht fertig geschrieben.]","habe"]]},{"lv":"B2","t":"Prepositions with the genitive","r":["^wegen, trotz, während, statt/anstatt, innerhalb, außerhalb, oberhalb, unterhalb, dies-/jenseits, infolge, aufgrund, anlässlich, hinsichtlich, bezüglich, mittels, kraft, laut, dank, ungeachtet, zugunsten, zulasten, abseits, unweit, gewahr^","In informal speech dative is common (^wegen dem Wetter^) — in exams and formal writing always use the **genitive**."],"ex":[["Wegen des starken Regens fiel das Konzert aus.","Because of the heavy rain the concert was cancelled."]],"q":[["Trotz ___ (die) Kälte gingen wir spazieren.","der"],["Innerhalb ___ (ein) Jahres","eines"]]},{"lv":"B2","t":"Indefinite pronouns and quantifiers","r":["^jemand / niemand / etwas / nichts / man / alle / alles / manche / einige / mehrere / viele / wenige / beide / ein paar / jeder / keiner^","After ^etwas, nichts, viel, wenig^ adjectives are **capitalised and neuter**: ^etwas **Gutes**, nichts **Neues**^.","^jemand/niemand^ take **-em/-en/-en** endings (^jemandem, niemanden^)."],"ex":[["Ich habe etwas Interessantes gelesen.","I read something interesting."],["Hat jemand meinen Schlüssel gesehen?","Has anyone seen my key?"]],"q":[["Ich wünsche dir etwas ___. (gut)","Gutes"],["Ich habe mit ___ (jemand) gesprochen.","jemandem"]]},{"lv":"B2","t":"Adjective + preposition collocations","r":["^stolz auf (+A) · zufrieden mit (+D) · interessiert an (+D) · verantwortlich für (+A) · abhängig von (+D) · überzeugt von (+D) · typisch für (+A) · bekannt für (+A) · gut in (+D) · böse auf (+A) · fertig mit (+D) · einverstanden mit (+D)^","Learn them as blocks with an example sentence."],"ex":[["Ich bin stolz auf meine Tochter.","I'm proud of my daughter."]],"q":[["Er ist abhängig ___ seinem Chef. (von)","von"],["Sie ist verantwortlich ___ das Projekt. (für)","für"]]},{"lv":"B2","t":"Word formation: prefixes","r":["**Inseparable** (stress on the stem, **no ge-** in the Partizip II): ^be-, ent-, er-, ge-, ver-, zer-, miss-, emp-, über- (often), unter-, um-, durch-, hinter-, wider-^","**Separable** (stress on the prefix, **ge- inside**): ^an-, auf-, ab-, aus-, ein-, mit-, nach-, vor-, zu-, zurück-, zusammen-, weg-, weiter-, fort-, hin-, her-^","The same prefix can be both with a different meaning: ^**um**fahren (drive around, sep.) vs um**fahren** (run over, insep.)^"],"ex":[["Er versteht das nicht.","He doesn't understand that."],["Wir fahren morgen ab.","We leave tomorrow."]],"q":[["übersetzen (to translate) → Partizip II?","übersetzt"],["abfahren (to depart) → Partizip II?","abgefahren"]]},{"lv":"B2","t":"Emphasis: clefting and es-structures","r":["To highlight one element, front it or wrap it in ^es ist/sind ... der/die/das^:","^**Es war Anna, die** mir geholfen hat.^ (It was Anna who helped me.)","^**Nur** mit viel Übung kann man das lernen.^ (fronting + inversion)","^Es^ can also be a placeholder: ^**Es** gibt viele Gründe.^ / ^**Es** zieht.^"],"ex":[["Es ist nicht das Geld, das mich motiviert.","It isn't money that motivates me."]],"q":[["Es war der Chef, ___ das entschieden hat.","der"]]},{"lv":"B2","t":"Common pitfalls (false friends & traps)","r":["^bekommen^ (get) not \"become\" (^werden^) · ^wissen^ (know a fact) vs ^kennen^ (know a person/place) · ^Realität^ vs ^Wirklichkeit^ · ^eventuell^ = possibly, NOT eventually (^schließlich^) · ^bekommen?^","^aktuell^ = current, not \"actual\" (^tatsächlich^) · ^sensibel^ = sensitive (person), ^sensible^ ≠ English · ^Chef^ = boss · ^Gift^ = poison · ^bald^ = soon · ^Bekannte^ = acquaintance.","Also: **werden ≠ become** always — ^aus jemandem werden^ = to turn into."],"ex":[["Er wird Lehrer.","He is becoming a teacher."],["Ich weiß das nicht.","I don't know that."]],"q":[["\"eventuell\" in English:","possibly"],["\"Gift\" in English:","poison"]]},{"lv":"A1","t":"Plural forms: the five patterns","r":["There are five main plural patterns — learn the plural **with** every noun:","1. **-** (no change): der Lehrer → die Lehrer, das Zimmer → die Zimmer","2. **¨** (umlaut only): der Bruder → die Brüder, der Vogel → die Vögel","3. **-e** (+ umlaut often): der Tag → die Tage, der Zug → die Züge","4. **-er** (+ umlaut always): das Buch → die Bücher, der Mann → die Männer","5. **-(e)n** (never umlaut): die Frau → die Frauen, der Student → die Studenten, das Herz → die Herzen","Loanwords often take **-s**: das Auto → die Autos, das Hotel → die Hotels, das Handy → die Handys.","Feminine nouns nearly always take **-(e)n**."],"ex":[["Die Kinder spielen im Garten.","The children are playing in the garden."]],"q":[["das Buch → plural:","Bücher"],["die Frau → plural:","Frauen"],["der Mann → plural:","Männer"]]},{"lv":"A1","t":"es gibt + accusative","r":["^Es gibt^ = there is / there are. Always followed by the **accusative**.","For specific/known things use ^... ist/sind da^ or ^... steht/liegt/hängt^ instead: ^Der Schlüssel liegt auf dem Tisch.^"],"ex":[["Es gibt ein Problem.","There is a problem."],["Es gibt viele Gründe dafür.","There are many reasons for that."]],"q":[["Es ___ viele Probleme. (gibt)","gibt"],["Es gibt ___ (ein) Fehler.","einen"]]},{"lv":"A2","t":"Object order: dative before accusative","r":["If a verb has both a dative and an accusative object: **dative first** (^Ich gebe **dem Mann** [Dat] **das Buch** [Akk].^)","If one of them is a **pronoun, the pronoun comes first**: ^Ich gebe **es** **dem Mann**. / Ich gebe **ihm** **das Buch**.^","Pronoun before noun, always."],"ex":[["Ich schenke meiner Schwester ein Buch.","I'm giving my sister a book."],["Ich schenke es ihr.","I'm giving it to her."]],"q":[["Ich gebe ___ Mutter (die, Dat) das Buch.","der"],["Ich gebe ___ (es) dem Mann.","es"]]},{"lv":"A2","t":"Position of adverbs of frequency","r":["^immer, oft, manchmal, selten, nie, meistens, normalerweise^ stand **after** the conjugated verb and **before** everything else in the Mittelfeld (but after the subject if the subject is a pronoun):","^Ich **trinke** **oft** Kaffee. / **Oft** **trinkt** er Kaffee.^","Negation ^nie^ also goes there. ^schon^ (already) and ^noch^ (still) follow the same slot."],"ex":[["Er kommt immer zu spät.","He always comes too late."]],"q":[["Ich trinke ___ (oft) Kaffee.","oft"]]},{"lv":"A2","t":"dative-only verbs","r":["Some verbs **always** take the dative — no accusative object possible:","^helfen, danken, gefallen, gehören, passen, folgen, antworten, glauben, gratulieren, zuhören, vertrauen, widersprechen, ähneln, begegnen^","Mnemonic sentence: ^**D**er **M**ann **h**ilft **d**em **K**ind — Dat!^"],"ex":[["Hilf mir bitte!","Please help me!"],["Das gehört mir.","That belongs to me."]],"q":[["Ich helfe ___ (du).","dir"],["Das gefällt ___ (ich) nicht.","mir"]]},{"lv":"A2","t":"schon / erst / noch / nicht mehr","r":["^schon^ = already · ^noch^ = still · ^noch nicht^ = not yet · ^nicht mehr^ = no longer · ^erst^ = only (not before)","They sit in the Mittelfeld, before what they modify.","^Ich bin **schon** fertig. · Ich bin **noch nicht** fertig. · Es ist **erst** drei Uhr.^"],"ex":[["Ich habe erst zwei Stunden geschlafen.","I've only slept two hours."]],"q":[["Ich bin ___ nicht fertig. (not yet)","noch"],["Er wohnt ___ mehr hier. (no longer)","nicht"]]},{"lv":"A2","t":"man, jemand, niemand, alle","r":["^man^ = one/you (generic) — verb is singular: ^In Deutschland **isst** man **gern** Brötchen.^","^jemand/niemand^ = someone/no one — singular, and take ^-em/-en/-en^ endings.","^alle^ = everyone (plural verb) but ^alles^ = everything (singular verb)."],"ex":[["Man kann dort gut einkaufen.","You can shop well there."],["Alles ist fertig.","Everything is ready."]],"q":[["___ kann hier nicht parken. (generic you)","Man"],["Ich habe mit ___ (jemand) gesprochen.","jemandem"]]},{"lv":"B1","t":"Modal particles (Abtönungspartikeln)","r":["Tiny words that colour the sentence — **never stressed**, never translated directly:","^doch^ (contradiction/encouragement) · ^mal^ (casual) · ^eben/halt^ (resignation: \"that's just how it is\") · ^ja^ (you already know) · ^schon^ (reassurance) · ^wohl^ (supposition) · ^eigentlich^ (actually) · ^überhaupt^ (at all)","^Komm **doch** mit! · Das ist **eben** so. · Mach **mal**! · Das ist **ja** klar.^"],"ex":[["Komm doch mit ins Kino!","Oh come on, come to the cinema with us!"]],"q":[["Komm ___ mit! (encouraging particle)","doch"],["Das ist ___ so. (resignation: eben)","eben"]]},{"lv":"B1","t":"Indirect questions","r":["Embedded questions keep the question word, and the **verb goes to the end**:","^Ich weiß nicht, **wo** er **wohnt**. / Können Sie mir sagen, **wann** der Zug **fährt**?^","Yes/no embedded questions use **ob** (whether): ^Ich weiß nicht, **ob** er **kommt**.^","Note the ^ob^ cannot be replaced by ^wenn^ here."],"ex":[["Weißt du, wo der Bahnhof ist?","Do you know where the station is?"]],"q":[["Ich weiß nicht, ___ er kommt. (whether)","ob"],["Wissen Sie, wann der Bus ___ (fahren)?","fährt"]]},{"lv":"B1","t":"Wishes & unreal comparisons (als ob / wenn doch)","r":["Wishes: ^Wenn ich doch **mehr Zeit hätte**! / Ich **wünschte**, ich **wäre** da.^","Unreal comparisons: ^Er tut **so, als ob** er reich **wäre**. / **als** wäre nichts passiert^ (without ob, verb first).","Use **Konjunktiv II** in both clauses."],"ex":[["Wenn ich doch fliegen könnte!","If only I could fly!"]],"q":[["Er tut so, als ___ er krank wäre.","ob"],["Wenn ich doch mehr Zeit ___! (haben)","hätte"]]},{"lv":"B2","t":"Prepositions in W-questions and relative clauses","r":["For things, ^wo(r)-^ replaces ^was^/preposition+neuter:","^**Worauf** wartest du? · **Womit** schreibst du? ·**Worüber** sprichst du?^","In relative clauses: ^die Stadt, **in der** ich wohne · das Thema, **über das** wir sprechen · der Mann, **mit dem** ich arbeite^.","For people keep preposition + relative pronoun."],"ex":[["Wovon träumst du?","What do you dream of?"]],"q":[["___ sprichst du? (about it)","Worüber"],["das Haus, in ___ ich wohne","dem"]]},{"lv":"B2","t":"Style: main clause vs. subordinate clause in academic writing","r":["Formal German prefers **nominal style** and **nested clauses**; good B2 writing mixes short main clauses with precise connectors.","Avoid more than **two** nested clauses: ^..., weil der Bericht, den der Kollege, der ... , geschrieben hat, fehlt.^ → split it.","Start sentences with the **known** information (Thema) and put the **new** information at the end (Rhema)."],"ex":[["Der Bericht liegt dem Antrag bei.","The report is enclosed with the application."]],"q":[["Put new information at the ___ of the sentence.","end"]]}],"units":[["A1 · Week 1","Me & You","Articles, sein/haben, present tense, greetings",["A1"],["intro","greeting","survival"]],["A1 · Week 2","Everyday life","Daily routine, numbers, time, modal verbs",["A1"],["daily","time","question"]],["A1 · Week 3","Word order","Verb position 1 & 2, separable verbs, questions",["A1"],["separable","present","negation"]],["A1 · Week 4","The past","Perfekt, Partizip II, imperatives",["A1"],["perfect","preteritum"]],["A2 · Week 5","Cases & prepositions","Accusative, dative, fixed prepositions",["A2"],["dative","perfect","travel"]],["A2 · Week 6","Two-way prepositions","wohin/wo, possessive articles",["A2"],["wechsel","daily","hotel"]],["A2 · Week 7","Subordinate clauses","weil, dass, wenn, adjective endings 1",["A2"],["weil","dass","wenn"]],["A2 · Week 8","Comparing things","Relative clauses, reflexives, comparatives",["A2"],["relativ","social","shopping"]],["B1 · Week 9","Genitive & endings","Genitive, full adjective system, Präteritum",["B1"],["genitive","preteritum","work"]],["B1 · Week 10","Passive & Konjunktiv II","Process passive, würde-form, conditionals",["B1"],["passiv","konj2","opinion"]],["B1 · Week 11","Infinitive & da-/wo- words","zu + infinitive, um…zu, da- and wo- words",["B1"],["infinitive","umzu","dakomp"]],["B1 · Week 12","Relatives & connectors","Relative pronouns, paired connectors, TEKAMOLO",["B1"],["relativ","connectors","tekamolo"]],["B2 · Week 13","Reported speech","Konjunktiv I, past perfect, participles",["B2"],["konj1","plusquam","partizip"]],["B2 · Week 14","Nominal style","Nominalisation, passive replacements, subjective modals",["B2"],["nominal","passiv","modal"]],["B2 · Week 15","Precision","Field model, genitive prepositions, emphasis",["B2"],["tekamolo","nominal","emphasis"]],["B2 · Week 16","Exam ready","Consolidation, exam simulation, final polish",["B2"],["news","work","opinion"]]],"bosses":[["The Article Demon","👹"],["The Time Ghost","⏰"],["The Verb Splitter","✂️"],["The Perfect Golem","🗿"],["The Case Dragon","🐉"],["The Preposition Spider","🕷️"],["The Sub-Clause Fog","🌫️"],["The Relative Knight","🛡️"],["The Genitive Griffin","🦅"],["The Passive Ghost","👻"],["The Infinitive Incubus","🦑"],["The Connector Kraken","🐙"],["The Subjunctive Goblin","🎭"],["The Nominal Nomad","🏜️"],["The Field Fox","🦊"],["The Exam Phoenix","🔥"]],"passages":[{"lv":"A1","t":"Meine Familie","tag":"family","de":"Ich heiße Anna und ich bin 22 Jahre alt. Ich komme aus Berlin. Meine Familie ist klein: mein Vater, meine Mutter und mein Bruder. Mein Vater heißt Peter. Er ist 50 Jahre alt und er arbeitet in einem Büro. Meine Mutter heißt Maria. Sie ist Lehrerin an einer Schule. Mein Bruder Tom ist 15 Jahre alt. Er geht noch zur Schule und spielt gern Fußball. Wir haben auch einen Hund. Er heißt Bello und er ist schon sehr alt. Am Wochenende besuchen wir oft meine Großeltern. Sie wohnen in einem kleinen Dorf bei Hamburg. Ich mag meine Familie sehr.","en":"My name is Anna and I am 22 years old. I come from Berlin. My family is small: my father, my mother and my brother. My father is called Peter. He is 50 years old and he works in an office. My mother is called Maria. She is a teacher at a school. My brother Tom is 15 years old. He still goes to school and likes playing football. We also have a dog. He is called Bello and he is already very old. At the weekend we often visit my grandparents. They live in a small village near Hamburg. I like my family very much.","q":[["Who works in an office?","Der Vater","Die Mutter","Der Bruder"],["How old is Tom?","15 Jahre","22 Jahre","50 Jahre"],["Where do the grandparents live?","In einem Dorf bei Hamburg","In Berlin","In einem Büro"]],"v":[["besuchen","to visit"],["das Dorf","the village"],["die Großeltern","the grandparents"],["der Hund","the dog"],["schon","already"]]},{"lv":"A1","t":"Mein Alltag","tag":"daily","de":"Ich stehe jeden Tag um sechs Uhr auf. Zuerst dusche ich und putze mir die Zähne. Dann frühstücke ich: ein Brötchen mit Käse und eine Tasse Kaffee. Um sieben Uhr fahre ich mit dem Bus zur Arbeit. Mein Büro ist in der Stadtmitte. Ich arbeite von acht bis siebzehn Uhr. Mittags esse ich in der Kantine eine Suppe oder ein Sandwich. Nach der Arbeit gehe ich oft einkaufen oder ich treffe Freunde. Am Abend koche ich zu Hause und sehe fern. Um elf Uhr gehe ich ins Bett. Mein Tag ist lang, aber er gefällt mir.","en":"I get up every day at six o'clock. First I shower and brush my teeth. Then I have breakfast: a roll with cheese and a cup of coffee. At seven I take the bus to work. M
